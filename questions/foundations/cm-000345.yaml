true_statement: When a colleague misses the morning stand-up, a lead tells a peer, "He just doesn't care about this project," without asking whether anything else came up. That is the fundamental attribution error.
false_statement: When a colleague misses the morning stand-up, a lead tells a peer, "He just doesn't care about this project," without asking whether anything else came up. That is the self-serving bias.
explanation: The lead explains someone else's behaviour by character and ignores his situation, the fundamental attribution error; asking what else was going on is the fix. The self-serving bias is about how we explain our own successes and failures.
