topic: Organizational communication
topic_type: Field
true_statement: The communicative constitution of organizations (CCO) holds that an organization is an ongoing, fragile accomplishment produced through communication, not a container in which communication happens.
false_statement: The communicative constitution of organizations (CCO) holds that an organization is a stable container in which communication happens, so its structure shapes messages but not the other way round.
explanation: 'CCO reverses the container view: talk and text keep making the organization. The practical upshot is that what a change means is negotiated in conversation, so announcements need follow-up talk, not just distribution.'
