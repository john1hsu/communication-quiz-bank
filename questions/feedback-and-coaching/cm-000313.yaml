id: cm-000313
area: feedback-and-coaching
kind: practice
topic: Receiving feedback
topic_type: Skill
true_statement: When your manager says you need to "be more proactive", ask what she saw that prompted it and what, concretely, she would like to see you do instead.
false_statement: When your manager says you need to "be more proactive", agree and promise to take more initiative, so you don't come across as defensive about it.
explanation: 'A vague label like "be more proactive" can mean many things, so the skilled receiver turns it into specifics: what was observed and what is wanted instead. Promising to change without knowing what it means leaves nothing concrete to act on.'
