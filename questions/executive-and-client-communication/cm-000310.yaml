id: cm-000310
area: executive-and-client-communication
kind: practice
topic: Trusted advisor
topic_type: Framework
true_statement: With a sponsor anxious about a slipping launch, listen until she feels understood before you frame the problem, rather than jumping from the opening straight to your recommended fix.
false_statement: With a sponsor anxious about a slipping launch, go from the opening straight to your recommended fix, then listen to her reactions, since a quick solution shows you understood.
explanation: The framework's steps run engage, listen, frame, envision, commit; listening earns the right to frame the problem, and skipping it is the common mistake. This is practitioner guidance from a business book, not a tested sequence.
