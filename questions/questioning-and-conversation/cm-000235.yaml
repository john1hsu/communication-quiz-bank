true_statement: In Roghanizad and Bohns's favour-asking experiments, requesters predicted email would work about as well as asking in person, though in-person asks succeeded far more often.
false_statement: In Roghanizad and Bohns's favour-asking experiments, requesters predicted asking in person would work far better than email, though email asks succeeded just as often.
explanation: People asked face to face complied many times more often, yet requesters didn't foresee it, so they don't notice what they give up by emailing. The samples were students and one request type, so the size is uncertain.
