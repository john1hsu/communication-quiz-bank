topic: Executive briefing
topic_type: Context
true_statement: An information brief aims only at helping a senior leader understand an issue, while a decision brief exists to get a choice made and opens by saying a decision will be sought.
false_statement: A decision brief aims only at helping a senior leader understand an issue, while an information brief exists to get a choice made and opens by saying a decision will be sought.
explanation: 'Military staff training sorts briefs by purpose: information briefs build understanding, decision briefs end with a request for a choice. Confusing the two is a named pitfall, since a fact-heavy information brief leaves the leader with nothing clear to decide.'
