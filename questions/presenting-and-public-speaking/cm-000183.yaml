topic: Filled pauses
topic_type: AntiPattern
true_statement: In a 2024 study of filler rates in speeches, listener ratings did not drop at 5 filler sounds per minute but fell at higher rates, especially 12 per minute.
false_statement: In a 2024 study of filler rates in speeches, listener ratings already fell at 2 filler sounds per minute and dropped no further at 12 per minute.
explanation: The damage came at dense rates, not from the occasional um, which is why chasing zero fillers outruns the evidence. Count your own rate on a recording and aim for few, not none.
