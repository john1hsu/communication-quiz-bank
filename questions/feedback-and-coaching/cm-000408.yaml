topic: Hattie and Timperley's feedback model
topic_type: Framework
true_statement: A 2020 meta-analysis co-authored by Hattie backed the idea that more informative feedback works better, but it could not test the model's claim that praise of the person is the least effective level.
false_statement: A 2020 meta-analysis co-authored by Hattie backed the idea that more informative feedback works better, and it confirmed the model's claim that praise of the person is the least effective level.
explanation: The 2020 review found information-rich feedback outperformed bare rewards or punishments, but it could not code the four levels at all. So the self-level claim remains untested there, part of why the model's status is mixed.
