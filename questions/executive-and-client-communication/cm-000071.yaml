topic: Managing up
topic_type: Skill
true_statement: If your manager keeps rewriting your weekly update at the last minute, ask in your one-on-one how they use it, then send it in the form and at the time that use requires.
false_statement: If your manager keeps rewriting your weekly update at the last minute, make the narrative email longer and more polished so there is less left for them to change.
explanation: In the article's example the manager forwarded the update to a director and needed only decisions, risks and progress, a day earlier. Checking how the boss actually uses information beats guessing harder.
