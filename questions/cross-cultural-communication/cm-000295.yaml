kind: practice
topic: Multicultural team
topic_type: Context
true_statement: To surface a likely problem in a multicultural team, ask an indirect question such as "What would happen if this component failed?" rather than asking someone to name a colleague's failure.
false_statement: To surface a likely problem in a multicultural team, ask each member to say plainly whose component is failing, since stating it directly is clearest for everyone.
explanation: An indirect question surfaces the risk without forcing anyone to state a teammate's failure outright. Demanding names in front of the team is the explicit style that, across a direct/indirect gap, can read as an attack.
