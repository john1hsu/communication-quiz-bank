true_statement: 'The popular claim that you can spot a lying colleague from body language outruns the research: across many studies, people tell lies from truths only slightly better than chance.'
false_statement: 'The popular claim that you can spot a lying colleague from body language is backed by the research: across many studies, people reliably tell lies from truths by watching for nervous cues.'
explanation: Bond and DePaulo's meta-analysis found accuracy barely above chance, and liars don't necessarily look more nervous. Leaning on fidgets or averted gaze as lie signs can distort how you judge someone's credibility.
