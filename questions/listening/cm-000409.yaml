true_statement: 'After a client spends ten minutes on a call listing frustrations, the account manager says, "So three things: invoices arrive late, the portal times out at month-end, and you''re unsure who your new contact is. Did I miss anything?" That is summarizing.'
false_statement: 'After a client spends ten minutes on a call listing frustrations, the account manager says, "So three things: invoices arrive late, the portal times out at month-end, and you''re unsure who your new contact is. Did I miss anything?" That is paraphrasing.'
explanation: The reply gathers several points from a long stretch of talk into one organised statement and invites correction, which is a summary. A paraphrase restates a single point; scope is what separates them.
