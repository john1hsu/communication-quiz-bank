true_statement: In Zuckerman and colleagues' 1982 honesty-judging study, once full speech was present, adding verbal content improved judges' accuracy far more than adding the face did.
false_statement: In Zuckerman and colleagues' 1982 honesty-judging study, once full speech was present, adding the face improved judges' accuracy far more than adding verbal content did.
explanation: The face looked dominant in earlier work only when speech was filtered out or cut to one word. With real speech, words mattered, and no single channel always won.
