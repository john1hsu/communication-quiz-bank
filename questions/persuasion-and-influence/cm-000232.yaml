true_statement: In the elaboration likelihood model, attitude change that comes from thinking through the arguments tends to last longer and predict behaviour better than change driven by simple cues.
false_statement: In the elaboration likelihood model, attitude change driven by simple cues tends to last longer and predict behaviour better than change that comes from thinking through the arguments.
explanation: A sponsor convinced by the analysis is likely to stay convinced when challenged, while one who agreed because a senior partner was present may reverse once that cue is gone. So the durable choice is also the ethical one.
