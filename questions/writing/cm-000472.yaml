true_statement: A 2026 experiment on health journalism found narrative articles produced higher comprehension and interest than inverted-pyramid versions, so putting the point first is not always best for learning.
false_statement: A 2026 experiment on health journalism found inverted-pyramid articles produced higher comprehension and interest than narrative versions, confirming that putting the point first is always best for learning.
explanation: The narrative versions won on comprehension and interest, which is why the article's evidence status is mixed. Leading with the point matters most for busy readers who must act; a story-first structure can suit writing meant to be read in full.
