id: cm-000356
area: cross-cultural-communication
kind: practice
topic: Cultural intelligence
topic_type: Skill
true_statement: Before an important call with a team abroad, write down two or three of your own habits, such as how you say no or disagree, that they might read differently, then watch for evidence.
false_statement: Before an important call with a team abroad, write down two or three traits of their country from a cultural-dimensions ranking, then plan the call to fit those traits.
explanation: Naming your own defaults builds the metacognitive habit of noticing where your norms may not be shared. Country frameworks are only starting hypotheses about a specific team, so planning around them as fixed traits skips the checking step.
