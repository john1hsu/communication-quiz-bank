true_statement: A team lead starts a long email thread to get four managers to agree how to split a disputed budget. Media synchronicity theory would call this a convergence job, better served by a live discussion.
false_statement: A team lead starts a long email thread to get four managers to agree how to split a disputed budget. Media synchronicity theory would call this a conveyance job, well served by email.
explanation: Reaching agreement on a contested question is convergence, which fast-feedback live channels support. Conveyance is passing on information people can absorb alone, such as updates or data, where email works well.
