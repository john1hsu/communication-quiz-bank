true_statement: William Strunk Jr. first printed The Elements of Style privately in 1918, as a short text for his own English classes at Cornell.
false_statement: William Strunk Jr. first printed The Elements of Style in 1918 as a commercial handbook for office and business writers.
explanation: It began as a 43-page classroom text with numbered rules instructors could cite when marking work; a commercial edition followed in 1920, and E. B. White's revision in 1959.
