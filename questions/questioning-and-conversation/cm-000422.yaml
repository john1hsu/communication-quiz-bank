id: cm-000422
area: questioning-and-conversation
kind: practice
topic: GROW model
topic_type: Framework
true_statement: When coaching a report through GROW, ask for her options first and add your own idea only after hers, labelled as one option among several.
false_statement: When coaching a report through GROW, lead with your own recommended option so she has a strong starting point, then ask what else she could try.
explanation: Putting your idea first anchors her and quietly hands ownership back to you, which GROW is meant to avoid. You can still contribute, but after her ideas and as one choice rather than the answer.
