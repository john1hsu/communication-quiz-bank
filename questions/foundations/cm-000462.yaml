topic: Shannon-Weaver model
topic_type: Theory
true_statement: When a cutover email turns on one date, state that date in both the subject line and the body, adding deliberate redundancy so a skimmed or garbled detail can still be caught.
false_statement: When a cutover email turns on one date, state that date only once, in the body, because repeating it counts as noise that makes the signal harder to decode.
explanation: 'In the model, redundancy is the main safeguard against distortion: repeating a key figure, date or owner, or showing it in a second form, lets readers correct an error. Repetition is not noise; noise is what corrupts the signal.'
