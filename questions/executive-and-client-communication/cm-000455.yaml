id: cm-000455
area: executive-and-client-communication
kind: scenario
topic: Escalating a problem
topic_type: Technique
true_statement: After two stalled talks with the data team lead about a shared deadline, a product lead quietly emails his own VP, who he expects will back him, and doesn't tell the other lead. That is a one-sided escalation, which risks a decision made on partial information.
false_statement: After two stalled talks with the data team lead about a shared deadline, a product lead quietly emails his own VP, who he expects will back him, and doesn't tell the other lead. That is a joint escalation, which gets the decision maker both sides' facts.
explanation: The tell is that he goes alone to a leader likely to side with him and leaves the other party uninformed. A joint escalation would bring both leads, their positions fairly stated and a record of how they tried to resolve it, to the decision maker together.
