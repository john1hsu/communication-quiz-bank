kind: scenario
topic: Perspective-getting
topic_type: Technique
true_statement: Planning a handover, a manager asks an analyst whether he'd mind dropping the client reports, hears "that's fine," and assumes he'll also be happy to take over the data pipeline. She asked once and generalised from it.
false_statement: Planning a handover, a manager asks an analyst whether he'd mind dropping the client reports, hears "that's fine," and assumes he'll also be happy to take over the data pipeline. She got his perspective rather than guessing it.
explanation: Asking only improves accuracy on the points actually discussed, so his answer about reports says nothing about the pipeline. She needed a second question about each point her decision depends on.
