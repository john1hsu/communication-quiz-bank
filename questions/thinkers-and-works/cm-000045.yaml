true_statement: Aristotle's Rhetoric answers Plato, whose Gorgias had dismissed rhetoric as a knack without knowledge.
false_statement: Aristotle's Rhetoric answers Cicero, whose writings had dismissed rhetoric as a knack without knowledge.
explanation: Plato's Gorgias set the challenge, and Aristotle replied by calling rhetoric a counterpart of dialectic. Cicero came centuries later and borrowed from the Rhetoric rather than prompting it.
