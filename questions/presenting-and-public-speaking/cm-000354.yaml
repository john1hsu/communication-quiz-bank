true_statement: The popular claim that an audience's attention collapses after 10-15 minutes rests on few primary studies and weak methods; attention seems to vary more with the speaker than with the clock.
false_statement: The popular claim that an audience's attention collapses after 10-15 minutes rests on consistent primary studies, so a talk should change format on that schedule whoever is speaking.
explanation: Bradbury's review found the much-cited figure barely measured attention at all. Varying pace and inviting interaction still helps, but because it keeps people engaged, not because a timer says attention is gone.
