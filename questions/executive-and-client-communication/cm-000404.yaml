area: executive-and-client-communication
kind: practice
topic: Executive presence
topic_type: Skill
true_statement: When a manager says you need "more presence", ask what they saw you do, then pick two or three observable behaviours to practise and get feedback on.
false_statement: When a manager says you need "more presence", pick a senior leader everyone admires and copy their speaking style and manner as closely as you can.
explanation: Vague presence feedback only becomes usable once it is turned into specific behaviours you can rehearse. Copying someone else's style works against the authenticity now valued; the aim is to show your own judgement more clearly.
