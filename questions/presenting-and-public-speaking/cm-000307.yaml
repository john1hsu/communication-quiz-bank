topic: Self-recording playback
topic_type: Technique
true_statement: 'Review a recorded run-through twice: once with the sound off to catch gestures, posture and fidgets, and once with sound to check pace, pauses and filler words.'
false_statement: Review a recorded run-through once with the sound on and check everything together, since muting the clip hides the delivery habits that matter most.
explanation: A muted pass makes hand and body habits stand out, and a second pass with sound covers pace and fillers. Splitting the viewing gives each kind of habit its own look instead of trying to judge everything at once.
