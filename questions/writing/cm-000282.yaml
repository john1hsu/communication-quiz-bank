true_statement: Asked to tighten a project summary before it goes to the director, an analyst adds two clarifying sentences and a caveat but deletes nothing. That is the common default toward adding rather than subtracting when improving something.
false_statement: Asked to tighten a project summary before it goes to the director, an analyst adds two clarifying sentences and a caveat but deletes nothing. That is concise editing, since added caveats make each point more precise.
explanation: 'The tell is that a request to tighten produced a longer text: people improving something tend to overlook removal unless prompted. Ask "what can I delete?" before revising, so the edit actually shortens the summary.'
