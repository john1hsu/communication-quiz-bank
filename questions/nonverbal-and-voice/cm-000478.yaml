true_statement: Inserting short pauses at phrase boundaries in radio news raised second-language listeners' comprehension, most for lower-level learners, though that result comes from a single master's thesis.
false_statement: Inserting short pauses at phrase boundaries in radio news raised second-language listeners' comprehension, most for advanced learners, though that result comes from a single master's thesis.
explanation: Van Loon's experiment found the biggest gain for the weakest listeners, which is why chunking matters most for second-language audiences and poor connections. Being one thesis, it is suggestive rather than settled.
