true_statement: In recorded appraisal interviews, a supervisor's relation-oriented statements drew more active contributions from the employee, which drew further relation-oriented responses, and reviews with more of this cycle were rated more successful.
false_statement: In recorded appraisal interviews, a supervisor's relation-oriented statements made employees more passive and agreeable, so reviews with fewer employee contributions were rated more successful.
explanation: 'Meinecke and colleagues found a reinforcing loop: supportive, relation-oriented talk drew the employee in, and their active contribution was the route to a successful review. Success came from more employee input, not quieter agreement.'
