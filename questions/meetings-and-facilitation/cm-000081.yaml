topic_type: Technique
true_statement: 'Diehl and Stroebe traced most of the idea shortfall in interacting brainstorming groups to production blocking: only one person can speak at a time, so others forget or hold back ideas while waiting.'
false_statement: 'Diehl and Stroebe traced most of the idea shortfall in interacting brainstorming groups to social loafing: members coast on others'' effort because their own contribution can''t be identified.'
explanation: Their experiments pinned the loss on waiting for a turn to talk, which is why NGT starts with silent, individual writing. Loafing is a different explanation from the one their work identified.
