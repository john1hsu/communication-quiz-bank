true_statement: Galinsky's range of acceptable behavior is the span of conduct others will accept from you before backlash, and he argues that power is what sets how wide it is.
false_statement: Galinsky's range of acceptable behavior is the span of conduct others will accept from you before backlash, and he argues that likeability is what sets how wide it is.
explanation: In his 2016 talk, power determines how much room you have to speak up; low-power people face backlash sooner. His tips for widening the range, such as offering choices or advocating for others, are practitioner advice rather than a tested intervention.
