kind: evidence
topic: Camera-optional norm
topic_type: Technique
true_statement: Bennett and colleagues' hourly surveys of employees found no significant link between camera use and post-meeting fatigue, while group belonging was the strongest buffer.
false_statement: Bennett and colleagues' hourly surveys of employees found camera use was the strongest predictor of post-meeting fatigue, while group belonging made no difference.
explanation: Their study challenges the camera effect that Shockley's experiment found, which is why the evidence is mixed. Both point toward giving choice while keeping connection, for example with a short cameras-on check-in.
