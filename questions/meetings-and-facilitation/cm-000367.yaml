topic: Brainstorming
topic_type: Technique
true_statement: A product team generating ideas alternates four-minute solo writing rounds with brief reads of everyone's ideas in a shared doc, then writes again. That alternating pattern is the one a field study at a tech company found produced the most ideas.
false_statement: A product team generating ideas alternates four-minute solo writing rounds with brief reads of everyone's ideas in a shared doc, then writes again. That alternating pattern is the one a field study at a tech company found produced the fewest ideas.
explanation: Switching between short solo writing and quick reviews of teammates' ideas beat continuous group sharing, because people think without a speaking queue and still build on others. The reads don't derail solo thinking; they feed the next round.
