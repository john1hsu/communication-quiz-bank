kind: practice
topic: Asynchronous communication
topic_type: Channel
true_statement: When you message a colleague eight time zones away, put the context, the exact ask, the next step and the links in one message, rather than opening with "Got a minute?" and waiting.
false_statement: When you message a colleague eight time zones away, open with "Got a minute?" and wait for a reply before sending the context, the exact ask and the links.
explanation: In async work each round of clarifying questions can cost hours or days. A complete, self-contained message lets the reader act alone in their own working hours.
