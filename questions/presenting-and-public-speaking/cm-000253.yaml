kind: practice
topic: Presentation rehearsal
topic_type: Technique
true_statement: The evening before a client briefing on video, do one final run on the real camera, screen-share and microphone setup, then stop practising and get some sleep.
false_statement: The evening before a client briefing on video, keep running the talk late into the night on whatever setup is handy, since last-minute extra run-throughs matter more than sleep.
explanation: Rehearsal guidance favours a last run in the real room or on the real video setup, then rest over one more late practice. Late cramming on a different setup leaves you tired and untested on the tools you'll actually use.
