area: nonverbal-and-voice
kind: mechanism
topic: Camera-level gaze on video calls
topic_type: Technique
true_statement: Placing the other person's video right under your webcam works because people are far less sensitive to gaze slightly below their eyes than to gaze off to the side or above.
false_statement: Placing the other person's video right under your webcam works because people are far less sensitive to gaze off to the side than to gaze slightly below their eyes.
explanation: Chen found people about ten times less sensitive to downward gaze, and viewers assume eye contact unless sure it's missing. Sideways glances, like reading a side monitor, are the ones they notice.
