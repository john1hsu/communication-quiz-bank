id: cm-000095
area: questioning-and-conversation
kind: practice
topic: Humble inquiry
topic_type: Technique
true_statement: When a report hands in a client analysis in an unexpected format the day before the review, ask them to walk you through what they were going for before asking for any changes.
false_statement: When a report hands in a client analysis in an unexpected format the day before the review, tell them to redo it in the standard template tonight and discuss their reasoning after the review.
explanation: Asking first surfaces reasons the lead may not know, such as a client request, and still leaves time to agree a format. Telling first assumes the lead already has all the information and shuts the report down.
