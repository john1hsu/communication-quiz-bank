true_statement: A finance partner ends a headcount negotiation with a little less than she asked for, but says she felt heard and can defend the deal to her boss. Those feelings of subjective value predict whether she'll deal with you again better than the economic result does.
false_statement: A finance partner ends a headcount negotiation with a little less than she asked for, but says she felt heard and can defend the deal to her boss. Those feelings matter less than the economic result in predicting whether she'll deal with you again.
explanation: Curhan, Elfenbein and Xu found feelings about the process, oneself and the relationship predicted later negotiation decisions better than economic outcomes. Feeling heard and being able to save face are exactly those clusters, so they shape the next negotiation.
