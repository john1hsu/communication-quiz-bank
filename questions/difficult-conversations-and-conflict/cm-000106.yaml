true_statement: A project lead tells a peer who skipped the design review, "I think we see the review differently. I'd like to hear how you see it, then explain why it matters to me before release." That opens from the third story.
false_statement: A project lead tells a peer who skipped the design review, "I think we see the review differently. I'd like to hear how you see it, then explain why it matters to me before release." That opens by arguing the facts first.
explanation: The lead describes the gap between their views as a neutral observer would and invites the peer to explore it, rather than leading with "You keep ignoring the review process." Listening first, then speaking for yourself, follows the worksheet's order.
