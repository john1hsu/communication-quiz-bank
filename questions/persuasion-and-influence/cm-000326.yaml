true_statement: Pooling many meta-analyses, O'Keefe and Hoeken (2021) found message-design choices, such as one- versus two-sided arguments, have small effects that can't be counted on to help.
false_statement: Pooling many meta-analyses, O'Keefe and Hoeken (2021) found message-design choices, such as one- versus two-sided arguments, reliably help once the right moderating conditions are known.
explanation: Most design choices could plausibly help or hurt in a new setting, even with moderators specified. Rely on credibility, audience-centred reasons and dialogue rather than any single wording rule.
