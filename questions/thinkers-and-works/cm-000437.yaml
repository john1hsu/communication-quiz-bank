true_statement: In Galinsky and colleagues' 2008 study, MBA students told to imagine what their counterpart was thinking reached a deal needing a creative solution 76% of the time, versus 39% for controls.
false_statement: In Galinsky and colleagues' 2008 study, MBA students told to imagine what their counterpart was feeling reached a deal needing a creative solution 76% of the time, versus 39% for controls.
explanation: Thinking about the other side's thoughts, perspective-taking, produced the jump; imagining their feelings, empathy, did no better than controls. The studies used MBA students in simulations of modest size.
