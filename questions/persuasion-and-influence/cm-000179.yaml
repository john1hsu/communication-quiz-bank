area: persuasion-and-influence
kind: scenario
topic: Credibility
topic_type: Concept
true_statement: A respected senior architect pitches a tooling change. The ops team grants he knows the tools cold but suspects the change mostly makes his own team's life easier. Their doubt is about his goodwill, not his competence.
false_statement: A respected senior architect pitches a tooling change. The ops team grants he knows the tools cold but suspects the change mostly makes his own team's life easier. Their doubt is about his competence, not his goodwill.
explanation: Competence is expertise; goodwill is whether the speaker seems to care about the listener's interests, and the two are rated separately. Here the expertise is accepted, so he needs to show how the change serves the ops team.
