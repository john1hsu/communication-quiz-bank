id: cm-000419
area: presenting-and-public-speaking
kind: practice
topic: Signposting
topic_type: Technique
true_statement: When moving between points in a talk, say a transition that closes one point and names the next, such as "That's the cost; now the timeline," rather than just "Moving on."
false_statement: When moving between points in a talk, keep transitions to a quick "Moving on" or "Next slide," rather than spending a sentence on what was just said and what comes next.
explanation: '"Moving on" tells listeners only that something changed, not how the new point relates to the last one. Naming both lets someone who drifted for a minute rejoin the structure.'
