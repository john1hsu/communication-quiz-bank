topic: Refutational two-sided messages
topic_type: Technique
true_statement: O'Keefe's 1999 meta-analysis found refutational two-sided messages slightly more persuasive than one-sided ones, while two-sided messages that only mentioned objections were slightly less persuasive.
false_statement: O'Keefe's 1999 meta-analysis found two-sided messages that only mentioned objections slightly more persuasive than one-sided ones, while refutational versions were slightly less persuasive.
explanation: Pooled across about 107 comparisons, answering objections gave a small gain and merely mentioning them a small loss, so the two kinds of two-sided message cancel out as a group. The false version reverses which kind helps.
