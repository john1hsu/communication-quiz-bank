true_statement: Morton Deutsch argued that competitive exchanges tend to escalate while cooperative ones build on themselves, because each kind of relationship reproduces the processes that created it.
false_statement: Morton Deutsch argued that competitive exchanges tend to settle down over time while cooperative ones tend to slide into rivalry, because each kind of relationship wears away the processes that created it.
explanation: In Deutsch's account, suspicion and deception breed more of the same, as do trust and openness, so a dispute's course is self-reinforcing. That is why protecting cooperative features such as honesty and open information matters early.
