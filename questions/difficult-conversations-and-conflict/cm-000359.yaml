topic: De-escalation
topic_type: Technique
true_statement: 'If a visitor keeps shouting at the front desk, state the limit as a fact and pair it with a real choice: "I can''t keep talking while you''re shouting. We can sit down now, or I can call you at three."'
false_statement: 'If a visitor keeps shouting at the front desk, state the limit as a warning: "Raise your voice at me once more and you''re out of the building, so it''s your choice."'
explanation: De-escalation guidance pairs limits with realistic choices and honest optimism, delivered calmly and tied to the behaviour. A limit dressed as a threat escalates, even when it mentions a choice.
