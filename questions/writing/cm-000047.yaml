area: writing
kind: practice
topic: Active voice
topic_type: Technique
true_statement: 'To fix "Open issues must be resolved before the release is approved" in a client email, name who acts: "Your team needs to fix open issues by Thursday, then I''ll approve the release."'
false_statement: 'To fix "Open issues must be resolved before the release is approved" in a client email, just add a date: "Open issues must be resolved by Thursday before approval."'
explanation: The original's real flaw is that no one owns the work, so each side can assume the other will do it. A deadline alone keeps that gap; putting the actor first assigns each task.
