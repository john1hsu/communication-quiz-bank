kind: scenario
topic: Persuasion
topic_type: Skill
true_statement: Pushing his preferred vendor, a manager tells the committee the discount expires Friday, though he knows it runs to month end. He has crossed into manipulation by inventing urgency to cut short their judgement.
false_statement: Pushing his preferred vendor, a manager tells the committee the discount expires Friday, though he knows it runs to month end. That is still persuasion, since a deadline is a reason the committee can weigh.
explanation: Persuasion offers reasons the audience can inspect and leaves them free to refuse. A deadline he knows is false is not a reason they can check; it is invented urgency meant to bypass their scrutiny.
