id: cm-000362
area: executive-and-client-communication
kind: practice
topic: Elevator pitch
topic_type: Genre
true_statement: End a hallway pitch to a VP with a small, specific request, such as "Could I have 20 minutes with your team next week to propose a pilot?", that she can agree to on the spot.
false_statement: End a hallway pitch to a VP with an open offer, such as "Let me know if you'd ever like to hear more about it," so she doesn't feel pushed into committing on the spot.
explanation: A pitch exists to earn a next step, and an open-ended offer leaves the listener interested with nothing to do. A concrete, low-cost ask turns the interest into a meeting while still being easy to decline.
