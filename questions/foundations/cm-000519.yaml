id: cm-000519
area: foundations
kind: practice
topic: Communication competence
topic_type: Skill
true_statement: If you know what to say to a client about a scope overrun and can say it well, yet keep postponing the call, work on the motivation component, your avoidance, rather than studying more phrasing.
false_statement: If you know what to say to a client about a scope overrun and can say it well, yet keep postponing the call, work on the knowledge component by studying more phrasing for it.
explanation: The component model splits competence into motivation, knowledge and skill, and each needs a different fix. Knowing what fits and being able to do it, yet avoiding the interaction, points to motivation; more phrasing adds knowledge you already have.
