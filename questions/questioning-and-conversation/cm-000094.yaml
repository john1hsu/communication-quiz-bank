kind: scenario
topic: Humble inquiry
topic_type: Technique
true_statement: A director asks her team, "What should we do about the vendor?", listens to twenty minutes of ideas, then announces the plan she had drafted beforehand, unchanged. That is asking then ignoring, which teaches people the door isn't really open.
false_statement: A director asks her team, "What should we do about the vendor?", listens to twenty minutes of ideas, then announces the plan she had drafted beforehand, unchanged. That is humble inquiry, since she asked before deciding.
explanation: Humble inquiry needs real curiosity and a willingness to learn something that changes your view. Asking for input and deciding exactly as planned shows the question was a formality.
