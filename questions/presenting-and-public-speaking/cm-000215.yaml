topic: Habit reversal training
topic_type: Technique
true_statement: 'Rehearsing a results talk, a team lead asks a colleague to tap the table each time she says "um", and when she feels one coming she closes her mouth and pauses. That is habit reversal: awareness training plus a competing response.'
false_statement: Rehearsing a results talk, a team lead asks a colleague to tap the table each time she says "um", and when she feels one coming she closes her mouth and pauses. That is exposure practice for reducing speaking anxiety.
explanation: The tap trains her to detect each filler as it happens, and the silent pause is a response that can't occur at the same time as the sound. Exposure practice targets fear by speaking more often, not a specific habit.
