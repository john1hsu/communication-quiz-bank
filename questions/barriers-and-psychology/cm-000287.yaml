area: barriers-and-psychology
kind: origin
topic: Egocentric bias
topic_type: Barrier
true_statement: Michael Ross and Fiore Sicoly named egocentric bias in research showing that people working jointly accept more responsibility for the outcome than their partners think they deserve.
false_statement: Justin Kruger and Nicholas Epley named egocentric bias in research showing that email senders overestimate how well their intended tone comes across to readers.
explanation: Ross and Sicoly's work on shared tasks gave the bias its name, partly explaining it by how much easier our own contributions are to recall. Kruger and Epley's email studies came later and extended the idea to everyday messages.
