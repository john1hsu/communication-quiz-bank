area: foundations
kind: evidence
topic: Clarity
topic_type: Concept
true_statement: In Oppenheimer's experiments, readers rated the authors of needlessly complex texts as less intelligent than the authors of plainer versions of the same content.
false_statement: In Oppenheimer's experiments, readers rated the authors of needlessly complex texts as more intelligent than the authors of plainer versions of the same content.
explanation: Needless complexity lowered, not raised, readers' estimates of the writer, so writing to sound expert tends to backfire. It is one multi-experiment paper with student raters, so treat the effect as suggestive.
