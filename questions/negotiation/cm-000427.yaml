id: cm-000427
area: negotiation
kind: scenario
topic: Distributive negotiation
topic_type: Technique
true_statement: A contractor quotes a client a $900 day rate. The client says nothing for a few seconds, and the contractor adds, "I could probably do $820." She has filled the silence with a unilateral concession before the client moved.
false_statement: A contractor quotes a client a $900 day rate. The client says nothing for a few seconds, and the contractor adds, "I could probably do $820." She has made a contingent concession tied to the client's next move.
explanation: Nothing was asked in return and the client had not countered, so the drop is unilateral, prompted only by discomfort with silence. A contingent concession names a specific action the other side must take, such as a longer engagement.
