true_statement: When a supplier's late delivery puts your launch at risk, say plainly that you're disappointed with the offer rather than staging anger, which can win concessions but reliably damages trust.
false_statement: When a supplier's late delivery puts your launch at risk, stage some anger at their account rep, since an angry display reliably wins concessions without much cost to the relationship.
explanation: The 2023 review finds anger extracts concessions only under some conditions and reliably harms trust, while expressed disappointment can bring similar gains at lower cost. Displaying emotion you don't feel also shades into deception.
