id: cm-000349
area: persuasion-and-influence
kind: scenario
topic: Refutational two-sided messages
topic_type: Technique
true_statement: 'Proposing a database migration, an engineer writes to her director: "Some will worry about a weekend of downtime, but the long-term gains clearly outweigh that." That is a nonrefutational two-sided message, which on average persuades slightly less than not raising the worry.'
false_statement: 'Proposing a database migration, an engineer writes to her director: "Some will worry about a weekend of downtime, but the long-term gains clearly outweigh that." That is a refutational two-sided message, which on average persuades slightly more than a one-sided case.'
explanation: She names the downtime objection but offers no evidence, safeguard or design change to answer it, so it is left standing. A refutational version would say how downtime is avoided or limited, for example a staged cutover with a rollback plan.
