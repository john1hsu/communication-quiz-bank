id: cm-000142
area: questioning-and-conversation
kind: scenario
topic: Small talk at work
topic_type: Skill
true_statement: Waiting for a client call to start, a consultant asks five quick questions in a row about the client's weekend, team and commute, sharing nothing about herself. That one-way questioning can feel guarded or intrusive.
false_statement: Waiting for a client call to start, a consultant asks five quick questions in a row about the client's weekend, team and commute, sharing nothing about herself. That is skilled small talk, since more questions always make people like you more.
explanation: Questions help, especially follow-ups, but small talk should be reciprocal. After a question or two she should add a short, relevant fact about herself so it feels like a conversation, not an interview.
