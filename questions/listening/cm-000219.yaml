id: cm-000219
area: listening
kind: practice
topic: Interrupting
topic_type: AntiPattern
true_statement: When facilitating, step in at the first interruption you see, for example "Let's let Sam finish," and hand the floor back, because people cut off early tend to say less for the rest of the meeting.
false_statement: When facilitating, let the first few interruptions slide so the discussion keeps its energy, and step in only once the same person has been cut off several times.
explanation: Cannon, Robinson and Smith-Lovin found that early interruptions predicted more interruptions and lower participation later, a cumulative disadvantage. Waiting for a pattern lets the snowball start.
