topic: Rapport
topic_type: Concept
true_statement: If a tense negotiation with a new counterpart will run mostly by email, have a short live call first, with a little non-business talk, before the written exchange starts.
false_statement: If a tense negotiation with a new counterpart will run mostly by email, keep everything in writing from the first message so the record stays clean and nothing personal gets in the way.
explanation: Email strips out the cues that build rapport, and a brief non-business call before an email negotiation led to better economic and social outcomes. A purely written start is where impasses were most common.
