id: cm-000218
area: listening
kind: scenario
topic: Interrupting
topic_type: AntiPattern
true_statement: As a peer walks through her rollout plan, a colleague quietly says "right" and "exactly" while she keeps talking, and she carries on uninterrupted. That is cooperative overlap rather than an intrusive interruption.
false_statement: As a peer walks through her rollout plan, a colleague quietly says "right" and "exactly" while she keeps talking, and she carries on uninterrupted. That is an intrusive interruption, since he spoke while she held the floor.
explanation: An intrusive interruption takes the turn away or changes direction; brief, quiet agreement that leaves the speaker going supports her instead. Some listeners may still hear overlap as rude, so ask rather than assume.
