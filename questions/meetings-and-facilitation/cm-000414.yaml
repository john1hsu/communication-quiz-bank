true_statement: The case for owner-task-date recaps rests mostly on expert consensus; the implementation-intentions research cited for it studied individuals' own if-then plans, not team action lists.
false_statement: The case for owner-task-date recaps rests mostly on trials comparing teams that send recaps with teams that don't, which found clearly better follow-through.
explanation: No studies directly compare teams with and without recaps, so the practice is rated practitioner. Goal-setting research on concrete when-and-how plans offers a plausible mechanism, not proof that recaps work.
