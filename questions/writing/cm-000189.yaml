id: cm-000189
area: writing
kind: practice
topic: Pyramid principle
topic_type: Framework
true_statement: Under a recommendation, sort the supporting points into two to four groups that each hold one kind of idea, rather than one long list that mixes causes, actions and risks.
false_statement: Under a recommendation, put all the supporting points in one long list that mixes causes, actions and risks, rather than splitting them into a few groups that each hold one kind of idea.
explanation: Minto's rules say a group holds one kind of idea and its points neither overlap nor leave gaps, which is the MECE test. A mixed list hides whether the reasons actually add up to the conclusion. This is practitioner guidance, not a tested finding.
