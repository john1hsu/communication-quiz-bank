topic: Business report
topic_type: Genre
true_statement: Meeting minutes and expense reports are informational reports, presenting facts without judgement, while a feasibility study that recommends a course of action is an analytical report.
false_statement: Meeting minutes and expense reports are analytical reports, presenting facts with an interpretation, while a feasibility study that recommends a course of action is an informational report.
explanation: Informational reports record events, activities or conditions without judgement; analytical reports add analysis to solve a problem or recommend something. The false version swaps the two families.
