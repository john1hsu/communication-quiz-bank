id: cm-000473
area: negotiation
kind: scenario
topic: Mythical fixed-pie bias
topic_type: Barrier
true_statement: A buyer assumes her vendor wants an early go-live, so she gives up a volume discount to secure the later date she prefers. The vendor wanted the later date too. Missing an issue where both sides want the same outcome is the incompatibility error.
false_statement: A buyer assumes her vendor wants an early go-live, so she gives up a volume discount to secure the later date she prefers. The vendor wanted the later date too. Missing an issue where both sides want the same outcome is anchoring on the first offer.
explanation: Thompson and Hastie separated the fixed-sum error from the incompatibility error, which is failing to spot issues both sides actually agree on. The tell is that she paid for something the vendor wanted anyway; nobody's opening number drove it, so anchoring does not fit.
