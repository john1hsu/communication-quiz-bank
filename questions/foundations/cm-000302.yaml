true_statement: In Deming's 2017 study of US data, jobs demanding high social interaction grew by nearly 12 percentage points as a share of employment between 1980 and 2012.
false_statement: In Deming's 2017 study of US data, math-intensive jobs with little social interaction grew by nearly 12 percentage points as a share of employment between 1980 and 2012.
explanation: Social-heavy jobs grew while math-intensive jobs low in social interaction shrank. The finding is correlational, so it shows interpersonal skill is valued, not which behaviours build it.
