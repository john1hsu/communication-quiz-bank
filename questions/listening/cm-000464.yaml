id: cm-000464
area: listening
kind: scenario
topic: Conversational narcissism
topic_type: AntiPattern
true_statement: Before a team meeting, a lead asks a colleague, "How did your client workshop go?" After a two-word reply, she says, "Mine last week was brilliant - they want a second round." That is boomerasking.
false_statement: Before a team meeting, a lead asks a colleague, "How did your client workshop go?" After a two-word reply, she says, "Mine last week was brilliant - they want a second round." That is reciprocal self-disclosure.
explanation: 'The tell is the question used as a launch pad: she asks, barely lets him answer, then answers it herself with a brag. Reciprocal disclosure would alternate her sharing with real interest in his answer.'
