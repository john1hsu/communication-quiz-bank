true_statement: Stung by a terse email copied to her manager, an engineer holds off replying but spends the hour rereading it and venting to a teammate. Her pause has become rumination, which tends to leave people angrier.
false_statement: Stung by a terse email copied to her manager, an engineer holds off replying but spends the hour rereading it and venting to a teammate. Her pause is a cooling-off period working as intended.
explanation: What fills the gap decides whether it cools you down. Replaying the slight and venting keep the anger hot; an absorbing, unrelated task is what let anger fade in the experiments.
