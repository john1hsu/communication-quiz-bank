true_statement: In Fitz and colleagues' 2019 field experiment, people who got no phone notifications at all gained no attention benefit and reported more anxiety and fear of missing out than those left with the usual stream.
false_statement: In Fitz and colleagues' 2019 field experiment, people who got no phone notifications at all showed the biggest drop in inattention and stress, outperforming those who got three batches a day.
explanation: 'Going to zero backfired: no gain in attention, plus more anxiety and fear of missing out. Three batches a day was the condition that lowered inattention and stress, so aim for a few planned check-ins rather than a blackout.'
