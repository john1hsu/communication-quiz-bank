true_statement: The Feedforward Interview, an appraisal conversation that starts from an employee's recent success and what made it possible, was proposed by Kluger and Nir in 2010.
false_statement: The Feedforward Interview, an appraisal conversation that starts from an employee's recent success and what made it possible, was proposed by Marshall Goldsmith in 2010.
explanation: Two methods share the name. Goldsmith's is a quick peer exchange of suggestions from his workshops; Kluger and Nir's is a structured manager-employee interview built on appreciative inquiry.
