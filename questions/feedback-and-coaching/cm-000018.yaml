true_statement: Kluger and DeNisi's 1996 meta-analysis found that feedback improved performance on average, yet more than a third of feedback interventions made performance worse.
false_statement: Kluger and DeNisi's 1996 meta-analysis found that feedback improved performance on average, and fewer than one in twenty feedback interventions made performance worse.
explanation: Over a third of interventions backfired, which the authors linked to feedback pulling attention from the task toward the self. SBI's task-focused, specific structure is meant to stay on the helpful side.
