true_statement: Rehearsing a roadmap update, a manager says, "We'll launch in the [pause] third quarter, once legal [pause] signs off." Her pauses fall inside phrases, splitting words listeners need to hear as one unit.
false_statement: Rehearsing a roadmap update, a manager says, "We'll launch in the [pause] third quarter, once legal [pause] signs off." Her pauses fall at the ends of thought groups, showing listeners which words belong together.
explanation: '"In the third quarter" and "legal signs off" are each one chunk, so a silence in the middle breaks the unit. Thought-group pauses go after the chunk: "We''ll launch in the third quarter / once legal signs off."'
