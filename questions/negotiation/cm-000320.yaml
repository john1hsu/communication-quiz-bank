true_statement: 'In her 1925 talk "Constructive Conflict", Mary Parker Follett used a quarrel over a library window to illustrate integration: meeting both readers'' real needs rather than compromising.'
false_statement: 'In her 1925 talk "Constructive Conflict", Mary Parker Follett used a quarrel over a library window to illustrate compromise: each reader giving up part of what they wanted.'
explanation: Follett set integration apart from domination and compromise. One reader wanted to avoid a draught and the other wanted fresh air, so opening a window in an empty next room met both needs with no one giving ground.
