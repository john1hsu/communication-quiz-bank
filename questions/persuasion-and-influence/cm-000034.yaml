topic: Influence without authority
topic_type: Technique
true_statement: A program manager needs time from a security reviewer she can't direct, and offers to present the reviewer's findings by name at the quarterly leadership review. In Cohen and Bradford's model, that is a position-related currency.
false_statement: A program manager needs time from a security reviewer she can't direct, and offers to present the reviewer's findings by name at the quarterly leadership review. In Cohen and Bradford's model, that is a task-related currency.
explanation: Recognition and visibility with leadership are position-related currencies. Task-related ones are resources, assistance, information or fast response, which this offer doesn't provide.
