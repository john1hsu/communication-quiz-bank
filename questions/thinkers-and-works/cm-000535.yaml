topic: The Effects of Feedback Interventions on Performance
topic_type: Study
true_statement: Kluger and DeNisi showed that harmful effects of feedback had been reported since the early 1900s but were routinely explained away, partly because influential reviews treated feedback as reliably helpful.
false_statement: Kluger and DeNisi showed that harmful effects of feedback were first reported in the late 1980s, shortly before their review, because earlier studies had never measured them.
explanation: Their historical review found the negative effects were old news, dismissed for decades because reviews such as Ammons' 1956 summary assumed feedback always helps. The false version invents a late discovery.
