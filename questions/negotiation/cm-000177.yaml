id: cm-000177
area: negotiation
kind: practice
topic: Zone of possible agreement
topic_type: Concept
true_statement: When another team's six-week deadline looks impossible, ask what matters most to them and bring in a second issue such as scope before refusing, since that can create a zone of agreement the deadline alone lacked.
false_statement: When another team's six-week deadline looks impossible, refuse it outright, since if the deadline alone leaves no zone of agreement, no deal can exist.
explanation: Trading across issues can widen or create the zone, the opposite of treating the deal as a fixed pie. Offering the core feature by week six and the rest by week ten can beat a refusal for both sides.
