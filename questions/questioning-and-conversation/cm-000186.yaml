id: cm-000186
area: questioning-and-conversation
kind: practice
topic: Self-disclosure reciprocity
topic_type: Technique
true_statement: When a new contractor says the codebase feels huge, answer with a brief struggle of your own at a similar depth, then ask which part has been hardest, rather than launching into your own longer story.
false_statement: When a new contractor says the codebase feels huge, launch into your own longer story about your first months to show empathy, rather than answering briefly and handing the turn back.
explanation: Reciprocity works by matching the other person's level of detail and alternating turns. Topping a small disclosure with a big one turns the trade into a monologue and breaks the back-and-forth that builds closeness.
