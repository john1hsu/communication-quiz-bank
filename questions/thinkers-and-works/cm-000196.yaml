true_statement: In the 1989 curse-of-knowledge experiments, feedback did little to reduce the bias, while trading in a market roughly halved it without removing it.
false_statement: In the 1989 curse-of-knowledge experiments, feedback largely removed the bias, while trading in a market did little to reduce it.
explanation: Informed students' predictions stayed pulled toward the true earnings they knew despite feedback; markets helped only partly. The lesson is to check understanding with the real audience rather than trusting your sense of what is obvious.
