true_statement: 'More charisma is not always better: in Vergauwe and colleagues'' study of several hundred leaders, those with very high charismatic personality were rated weaker on operational follow-through.'
false_statement: 'More charisma is always better: in Vergauwe and colleagues'' study of several hundred leaders, those with very high charismatic personality were rated strongest on operational follow-through.'
explanation: The link between charisma and rated effectiveness was curvilinear, so beyond a point more charisma hurt on getting things done. It is a caution against treating presence as maximum charisma, especially since the construct itself rests mostly on surveys and interviews.
