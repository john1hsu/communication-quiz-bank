id: cm-000271
area: negotiation
kind: practice
topic: Integrative negotiation
topic_type: Technique
true_statement: In a multi-issue deal, share your own priorities a piece at a time and check that the other side reciprocates before you disclose more.
false_statement: In a multi-issue deal, lay out all your priorities and your budget ceiling in the first few minutes, so the other side sees you are open and follows suit.
explanation: Openness helps both sides find trades, but disclosing everything up front leaves you exposed if the counterpart is playing purely distributively. Revealing in steps lets you test whether information flows both ways.
