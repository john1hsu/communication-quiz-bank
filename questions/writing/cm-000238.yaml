true_statement: In Duffy and Kabance's Navy experiments, rewrites that sharply lowered readability scores barely improved readers' comprehension.
false_statement: In Duffy and Kabance's Navy experiments, rewrites that sharply lowered readability scores clearly improved readers' comprehension.
explanation: Scores fell by several grades while understanding hardly moved, apart from a small vocabulary gain for weaker readers. That is why using formulas as a writing target is contested; testing with real readers is the better check.
