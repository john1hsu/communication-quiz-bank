kind: scenario
topic: Self-recording playback
topic_type: Technique
true_statement: An account manager films her pitch rehearsal, watches it once and winces at her voice and outfit, but notes nothing specific to change. That is watching without criteria, which brings discomfort rather than a fix.
false_statement: An account manager films her pitch rehearsal, watches it once and winces at her voice and outfit, but notes nothing specific to change. That is watching as an outsider, the stance that turns playback into improvement.
explanation: She reacted to how she looked and sounded in general, with no checklist and no chosen fix. Watching as an outsider means judging the clip like a coach against two or three set behaviours, then picking one or two changes.
