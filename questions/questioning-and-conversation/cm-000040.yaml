topic: Teach-back
topic_type: Technique
true_statement: Before going on leave, a lead hands over a client escalation and asks, "If the patch fails Thursday, what are your next two moves, and who hears from you first?" That is teach-back.
false_statement: Before going on leave, a lead hands over a client escalation and asks, "If the patch fails Thursday, what are your next two moves, and who hears from you first?" That is paraphrasing.
explanation: 'The explainer is asking the listener to restate the plan in their own words to check the explanation landed. Paraphrasing is the mirror image: the listener restates on their own initiative.'
