id: cm-000113
area: listening
kind: practice
topic: Active listening
topic_type: Skill
true_statement: In a heated disagreement over priorities, restate the other person's point to their satisfaction before you state your own view.
false_statement: In a heated disagreement over priorities, state your own view briefly first so they know where you stand, then restate their point.
explanation: Rogers and Farson proposed this discipline because being understood lowers the threat that makes people defend their position. Leading with your view invites a counter-argument before they feel heard.
