true_statement: 'W. Charles Redding, often called the father of organizational communication, co-edited the 1964 Business and Industrial Communication: A Source Book, usually seen as the field''s starting point.'
false_statement: 'Chester Barnard, often called the father of organizational communication, co-edited the 1964 Business and Industrial Communication: A Source Book, usually seen as the field''s starting point.'
explanation: Redding edited the source book with George Sanborn. Barnard was an earlier influence, arguing in 1938 that an executive's first job is to build and maintain a communication system.
