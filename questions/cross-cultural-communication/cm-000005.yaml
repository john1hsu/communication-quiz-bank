id: cm-000005
area: cross-cultural-communication
kind: practice
topic: Direct vs. indirect feedback
topic_type: Concept
true_statement: After giving criticism across a directness gap, ask the person what they will do differently; an answer smaller or bigger than the problem shows your message was decoded in the other style.
false_statement: After giving criticism across a directness gap, ask the person whether you came across as polite; a yes shows your message was decoded the way you meant it.
explanation: Politeness tells you how the delivery felt, not what was understood. Asking about their next step tests whether the size of the problem landed, which is where style mismatches go wrong.
