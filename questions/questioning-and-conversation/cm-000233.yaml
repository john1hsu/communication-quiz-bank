true_statement: 'Catching a report at the coffee machine in the open-plan area between meetings, a lead gives him critical feedback on yesterday''s client call. Being in person doesn''t redeem it: a sensitive talk needs a private, unhurried setting.'
false_statement: Catching a report at the coffee machine in the open-plan area between meetings, a lead gives him critical feedback on yesterday's client call. That is good channel choice, since sensitive messages land best in person.
explanation: Face-to-face is the right channel for sensitive messages, but ambushing someone in a public space with no time to respond undermines it. Book a private room, plan specific examples and leave room for the reaction.
