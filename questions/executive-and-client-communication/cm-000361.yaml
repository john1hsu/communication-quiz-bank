id: cm-000361
area: executive-and-client-communication
kind: scenario
topic: Elevator pitch
topic_type: Genre
true_statement: Catching a director after a town hall, a product analyst races through three unrelated ideas (a pricing tweak, a new dashboard, an onboarding fix) in one minute and asks for a meeting on all of them. Her pitch falls into the laundry-list trap, which executives tend to read as uncreative or desperate.
false_statement: Catching a director after a town hall, a product analyst races through three unrelated ideas (a pricing tweak, a new dashboard, an onboarding fix) in one minute and asks for a meeting on all of them. Her pitch falls into the over-rehearsed trap, which executives tend to read as canned.
explanation: 'The tell is the number of ideas, not how practised she sounds: a pitch should carry one idea and one ask. Picking the strongest of the three and leading with its cost to the director would fix it.'
