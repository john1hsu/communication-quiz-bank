true_statement: Before a salary negotiation, a colleague urges you to stand hands-on-hips for two minutes "to boost your testosterone and cut cortisol." That advice rests on hormonal effects a much larger replication failed to find.
false_statement: Before a salary negotiation, a colleague urges you to stand hands-on-hips for two minutes "to boost your testosterone and cut cortisol." That advice rests on hormonal effects that larger studies have since confirmed.
explanation: The hormone claim comes from the small 2010 study; Ranehill and colleagues' larger replication found no effect on testosterone, cortisol or risk-taking, and a 2022 meta-analysis found no hormonal evidence either. Power posing's headline claims are a failed replication.
