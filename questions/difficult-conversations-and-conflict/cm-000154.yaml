true_statement: A 2010 meta-analysis of 175 studies found that receiving an apology was moderately linked to forgiving the offender, with a weighted correlation of about r = .42.
false_statement: A 2010 meta-analysis of 175 studies found that receiving an apology was only weakly linked to forgiving the offender, with a weighted correlation of about r = .12.
explanation: Fehr, Gelfand and Nag reported a moderate association of about .42 across roughly 26,000 participants. They also found intent, responsibility and the victim's anger mattered, so an apology works alongside how the harm is seen.
