id: cm-000002
area: barriers-and-psychology
kind: practice
topic: Curse of knowledge
topic_type: Barrier
true_statement: To catch the curse of knowledge in a draft, ask a few people from the target audience to explain a section in their own words, and revise wherever they misread it.
false_statement: To catch the curse of knowledge in a draft, ask a few people from the target audience "Is this clear?", and revise wherever they say no.
explanation: Readers can say a text is clear and still misread it, so a yes/no question gives you no real signal. A paraphrase test, recorded without correcting them, shows exactly where your missing context trips them up.
