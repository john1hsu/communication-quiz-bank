true_statement: Disagreeing with a hiring plan in a budget thread, a finance lead writes, "We both want the Q3 launch fully staffed; where we differ is when to hire." That is the Emphasise-agreement move in HEAR.
false_statement: Disagreeing with a hiring plan in a budget thread, a finance lead writes, "We both want the Q3 launch fully staffed; where we differ is when to hire." That is the Acknowledge move in HEAR.
explanation: The line names a shared goal before the difference, which is emphasising agreement. Acknowledging would restate the other person's own argument, such as "So your concern is that we'll be short-handed at launch."
