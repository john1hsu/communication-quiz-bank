id: cm-000510
area: presenting-and-public-speaking
kind: practice
topic: Death by PowerPoint
topic_type: AntiPattern
true_statement: When a leadership review needs detailed ticket data, send it as a one-page handout before the meeting and keep the slides for the live argument and the ask.
false_statement: When a leadership review needs detailed ticket data, pack it into the slides so the deck doubles as the record, and skip the separate handout.
explanation: Dense analysis reads better at the reader's own pace in a document; the Columbia board and Tufte both favoured written papers for complex reasoning. A deck meant to be both talk and record usually serves neither.
