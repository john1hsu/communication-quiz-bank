true_statement: Kraus's 2017 finding that people read others' feelings slightly better from voice alone than from voice plus face was challenged by a reanalysis arguing the edge is too small to matter.
false_statement: Kraus's 2017 finding that people read others' feelings slightly better from voice plus face than from voice alone was challenged by a reanalysis arguing the edge is too small to matter.
explanation: Kraus's surprise was that listening only beat listening and watching; Rossiter's 2018 reanalysis questioned whether that small advantage matters in practice. The safe takeaway is that voice is an important emotional channel, not that it outranks the face.
