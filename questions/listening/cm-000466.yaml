id: cm-000466
area: listening
kind: practice
topic: Conversational narcissism
topic_type: AntiPattern
true_statement: If you notice you asked a colleague a question only to give your own answer, next time just share your news directly, since people prefer plain self-disclosure to a question used as a launch pad.
false_statement: If you notice you asked a colleague a question only to give your own answer, next time ask two warm-up questions before sharing, so your news feels less self-focused.
explanation: 'The fix for boomerasking is to drop the pretext: say what you want to share plainly, or ask questions you can''t answer yourself and listen to the reply. More warm-up questions only extend the disguise.'
