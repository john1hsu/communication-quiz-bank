true_statement: Korobov's analysis of couples' everyday arguments found I-language on its own rarely de-escalated them; showing awareness of the partner's feelings helped more.
false_statement: Korobov's analysis of couples' everyday arguments found I-language on its own reliably de-escalated them, whatever else the speaker said.
explanation: In naturally occurring arguments the pronoun alone did little; what helped was visible awareness of the other person's feelings or the relationship. That's why the technique's evidence is rated mixed.
