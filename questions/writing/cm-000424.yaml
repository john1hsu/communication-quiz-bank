id: cm-000424
area: writing
kind: scenario
topic: Wall of text
topic_type: AntiPattern
true_statement: 'A team lead posts one unbroken twelve-line paragraph in a ticket, with three separate requests for three people spread through it. Only the first request gets done. That is a wall of text: nothing guides the scanning eye to the later asks.'
false_statement: 'A team lead posts one unbroken twelve-line paragraph in a ticket, with three separate requests for three people spread through it. Only the first request gets done. That is information overload: the team simply receives too many messages to keep up.'
explanation: 'The failure sits inside one message: dense, unformatted text, so scanners act on the top and miss the rest. Information overload describes too much incoming communication overall; the fix here is one line per request, each with an owner.'
