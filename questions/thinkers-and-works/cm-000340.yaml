true_statement: After a supplier negotiation, a buyer who tried to hide how badly she needs a March delivery is sure she gave it away. Gilovich's negotiation research suggests she probably revealed less than she thinks.
false_statement: After a supplier negotiation, a buyer who tried to hide how badly she needs a March delivery is sure she gave it away. Gilovich's negotiation research suggests she probably revealed even more than she thinks.
explanation: In the 2003 study with Van Boven and Medvec, negotiators hiding their preferences thought they had leaked more than they had, an illusion of transparency. Her vivid sense of her own urgency is not what the supplier saw.
