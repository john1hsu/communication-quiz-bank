topic: Conversational turn-taking
topic_type: Phenomenon
true_statement: In a planning meeting, "Any thoughts?" keeps drawing the same senior engineer, so the chair says, "Ana, how does this look from support?" She is using the rule that the current speaker may pick who goes next.
false_statement: In a planning meeting, "Any thoughts?" keeps drawing the same senior engineer, so the chair says, "Ana, how does this look from support?" She is relying on self-selection, where whoever starts first gets the turn.
explanation: Naming Ana is current-speaker-selects-next, the first of the turn-allocation rules. The open "Any thoughts?" was the self-selection case, which hands the floor to whoever jumps in fastest.
