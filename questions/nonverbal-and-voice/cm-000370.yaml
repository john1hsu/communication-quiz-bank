topic: Paralanguage
topic_type: Concept
true_statement: In a stand-up, asked if the release date still works, a developer pauses for a long moment, then says "Yes, should be okay" in a falling pitch. The doubt her lead should pick up is carried by paralanguage.
false_statement: In a stand-up, asked if the release date still works, a developer pauses for a long moment, then says "Yes, should be okay" in a falling pitch. The doubt her lead should pick up is carried by her choice of words.
explanation: Her words are a plain yes; the hesitation and falling pitch are vocal cues outside the words, which is what paralanguage covers. A good follow-up is to ask what would make her more confident about the date.
