topic: Emoji and tone in text
topic_type: Technique
true_statement: When telling a teammate in chat that their deck needs major rework, state the problem and the next step in plain words rather than adding a smiley to soften it.
false_statement: When telling a teammate in chat that their deck needs major rework, keep it short and add a smiley at the end, since a positive emoji cushions criticism.
explanation: Positive emoji did not soften bad news or criticism in workplace messages and can read as insincere. Carry the reassurance and the next step in words instead.
