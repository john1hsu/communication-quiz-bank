true_statement: Replace a slide titled "Q3 delivery performance" with five bullets by one headed "Late deliveries doubled after July because Warehouse B lost its night shift," above the chart that shows it.
false_statement: Improve a slide titled "Q3 delivery performance" with five bullets by keeping the title and adding the night-shift cause as a sixth, bolded bullet at the bottom.
explanation: The sentence headline carries the conclusion, so leaders who only glance still get the cause, and the chart proves it. Another bullet keeps the topic title and still makes the audience find the point.
