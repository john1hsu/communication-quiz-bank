id: cm-000100
area: writing
kind: scenario
topic: Plain language
topic_type: Principle
true_statement: A database engineer writes a design note for fellow database specialists and keeps the technical terms they all use. That can still be plain language, because the right level depends on who is reading.
false_statement: A database engineer writes a design note for fellow database specialists and keeps the technical terms they all use. That breaks plain language, which means avoiding technical terms whatever the audience.
explanation: Plain language is defined by whether the intended readers can find, understand and use the text; treating it as dumbing down is a common myth. Specialists' shared terms help them, though the same note for clients would need everyday words.
