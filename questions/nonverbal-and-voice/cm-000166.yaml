true_statement: 'Gaze can quietly signal rank: higher-status people tend to look more while speaking and less while listening, the reverse of lower-status people.'
false_statement: 'Gaze can quietly signal rank: higher-status people tend to look more while listening and less while speaking, the reverse of lower-status people.'
explanation: Textbook accounts describe high-status speakers holding gaze as they talk and looking less as listeners. That is one reason to spread eye contact around a meeting rather than fixing only on the most senior person.
