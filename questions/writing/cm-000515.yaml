true_statement: If a leadership team is likely to resist your report's recommendation to close a site, lead with the background and evidence and reach the recommendation at the end.
false_statement: If a leadership team is likely to resist your report's recommendation to close a site, open with the recommendation in the first lines and let the evidence follow it.
explanation: 'Textbook guidance ties placement to the reader''s likely reaction: recommendation first for neutral or positive readers, evidence first for resistant ones so the case is built before the conclusion lands. Opening cold with an unwelcome recommendation invites rejection before the reasons are heard.'
