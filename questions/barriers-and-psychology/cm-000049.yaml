id: cm-000049
area: barriers-and-psychology
kind: scenario
topic: Illusion of transparency
topic_type: Barrier
true_statement: A manager leaves a project review sure her disappointment over the slipped milestone was plain on her face, then is surprised when the lead calls the review "positive." She was caught by the illusion of transparency.
false_statement: A manager leaves a project review sure her disappointment over the slipped milestone was plain on her face, then is surprised when the lead calls the review "positive." She was caught by the curse of knowledge.
explanation: She overestimated how visible her own feeling was, which is the illusion of transparency. The curse of knowledge is about overestimating what others know; the fix here is to say the concern in words.
