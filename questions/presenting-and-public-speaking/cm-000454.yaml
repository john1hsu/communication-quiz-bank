true_statement: In Rodero's 2022 experiment with 120 viewers, speeches with a medium amount of pitch variation were rated most effective, ahead of those with few or many variations.
false_statement: In Rodero's 2022 experiment with 120 viewers, speeches with the most pitch variation were rated most effective, ahead of those with a medium amount or few variations.
explanation: Pitch should move on key words, but the study found a middle level beat both flat and highly varied delivery. It used four actors and 25-second clips, so it may not generalise to long talks.
