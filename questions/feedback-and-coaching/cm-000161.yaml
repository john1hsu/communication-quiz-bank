id: cm-000161
area: feedback-and-coaching
kind: scenario
topic: Manager one-on-one meetings
topic_type: Context
true_statement: A team lead spends each weekly one-on-one walking her analyst through her own project tracker, line by line, while the analyst says little. That turns the one-on-one into a status report, its most common failure.
false_statement: A team lead spends each weekly one-on-one walking her analyst through her own project tracker, line by line, while the analyst says little. That is a well-run one-on-one, since it keeps them aligned on priorities.
explanation: A one-on-one is the report's individual time, centred on their needs; reading out the manager's tracker spends it on the manager's priorities and could have been an update. The tell is who talks and whose list sets the agenda.
