kind: practice
topic: Job interview
topic_type: Context
true_statement: 'Asked how you handle conflicting priorities in an interview, describe one real case: the situation, what you yourself did, and the result, then stop and let the interviewer probe.'
false_statement: Asked how you handle conflicting priorities in an interview, describe yourself as organised and calm under pressure, then offer a real case only if the interviewer probes.
explanation: A concrete story with your own actions and the outcome gives the interviewer scorable evidence. A self-description like "I'm very organised" gives them nothing to rate against the benchmark.
