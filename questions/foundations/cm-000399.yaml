true_statement: In Hofweber and Jaworska's 2022 study of internal emails at a multinational insurer, 62% of requests were direct, mostly "please" plus an imperative.
false_statement: In Hofweber and Jaworska's 2022 study of internal emails at a multinational insurer, only 38% of requests were direct, with most phrased as "could you…?"
explanation: Most requests were direct, and nearly all the indirect ones used the "could you…?" form. Directness also tracked senders' first language, so a blunt request is often a habit rather than rudeness.
