topic: Role reversal
topic_type: Technique
true_statement: In Johnson and Deutsch's 1966 study, when the two sides' positions were truly incompatible, role reversal did no better than plain self-presentation at producing agreement.
false_statement: In Johnson and Deutsch's 1966 study, when the two sides' positions were truly incompatible, role reversal produced more agreements than plain self-presentation.
explanation: Role reversal reliably improved understanding of the opponent, but with incompatible positions it even lowered each side's sense of being understood. Clearer understanding can expose a real clash, so use it to diagnose a dispute, not as a promise of a deal.
