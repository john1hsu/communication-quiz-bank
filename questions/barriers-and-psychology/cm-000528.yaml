area: barriers-and-psychology
kind: practice
topic: Communication apprehension
topic_type: Barrier
true_statement: To help apprehensive colleagues contribute, a facilitator can share the questions before the meeting and use rounds, small groups or written input instead of relying on the open floor.
false_statement: To help apprehensive colleagues contribute, a facilitator can rely on the open floor and call on quiet people without warning, so they get practice speaking up.
explanation: Uncertainty, novelty and audience size all raise apprehension, so advance questions and structured or written routes lower the cost of contributing. Surprise cold-calls add exactly the uncertainty that makes it worse.
