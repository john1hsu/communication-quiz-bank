id: cm-000540
area: writing
kind: practice
topic: Informative headings
topic_type: Technique
true_statement: In a decision paper for a busy director, write statement headings such as "Cutting to 400 seats saves $90K a year" rather than questions such as "How much could we save?"
false_statement: In a decision paper for a busy director, write question headings such as "How much could we save?" rather than statements such as "Cutting to 400 seats saves $90K a year"
explanation: A question heading puts the key idea at the end and withholds your answer, which slows a scanning reader who wants your conclusion. Questions suit FAQs and public pages where you know what people will ask.
