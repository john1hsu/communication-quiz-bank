topic: Charismatic leadership tactics
topic_type: Technique
true_statement: Ernst, Banks and colleagues' 2021 prospective meta-analysis in five countries found charismatic tactics improved performance face to face but had essentially no effect in virtual settings.
false_statement: Ernst, Banks and colleagues' 2021 prospective meta-analysis in five countries found charismatic tactics improved performance most strongly in virtual settings, more than face to face.
explanation: The pooled virtual effect was close to zero while in-person effects were moderate to large, so a charismatic video or email message needs a clear written summary of the substance rather than relying on the tactics.
