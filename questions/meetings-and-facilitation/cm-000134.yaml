id: cm-000134
area: meetings-and-facilitation
kind: practice
topic: Meeting agendas
topic_type: Technique
true_statement: If you sit down to write a meeting's agenda and cannot phrase a single question the group needs to answer together, cancel the meeting.
false_statement: If you sit down to write a meeting's agenda and cannot phrase a single question the group needs to answer together, hold it anyway as an open check-in and let topics emerge.
explanation: Rogelberg argues the questions should set who attends and when the meeting ends; no questions suggests there's nothing this group needs to settle. An open check-in is how unnecessary meetings survive.
