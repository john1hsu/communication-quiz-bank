true_statement: When training a flat voice against a pitch meter, drill the sentences that carry the key points of your own upcoming talk, rather than a set of generic practice sentences.
false_statement: When training a flat voice against a pitch meter, drill a set of generic practice sentences, rather than the sentences that carry the key points of your own upcoming talk.
explanation: Hincks and Edlund had each student repeat lines pulled from their own baseline presentation, and the gain carried over to the real talk. Your own sentences also let you decide which word in each should stand out.
