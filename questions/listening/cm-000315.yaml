id: cm-000315
area: listening
kind: scenario
topic: Labeling emotions
topic_type: Technique
true_statement: On a delivery-date negotiation call, a supplier's account lead tells the buyer, "It seems like you don't care much about quality." That label carries a judgment, so it is likely to be heard as an attack.
false_statement: On a delivery-date negotiation call, a supplier's account lead tells the buyer, "It seems like you don't care much about quality." That label is a neutral observation that invites the buyer to correct it.
explanation: 'The "It seems like" opener doesn''t make a label neutral: this one implies a criticism of the buyer''s motives. A neutral version names the priority instead, such as "It seems like speed is your top concern."'
