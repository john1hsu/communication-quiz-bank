area: thinkers-and-works
kind: definition
topic: Aristotle's Rhetoric
topic_type: Work
true_statement: Aristotle defines rhetoric as the capacity to see the available means of persuasion in a given case, not as actually winning the audience over.
false_statement: Aristotle defines rhetoric as actually winning the audience over, so a speaker who fails to persuade has not mastered the art.
explanation: Like a doctor who does everything possible without curing every patient, a speaker has mastered rhetoric by seeing every available means, even if a stubborn audience isn't persuaded.
