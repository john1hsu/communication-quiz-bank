id: cm-000445
area: meetings-and-facilitation
kind: practice
topic: Unequal participation
topic_type: Barrier
true_statement: In a weekly design review where the director usually opens each topic, ask her to hold her view until everyone else has spoken.
false_statement: In a weekly design review where the director usually opens each topic, ask her to state her view first so others have something concrete to react to.
explanation: Early and frequent speakers gain influence whatever the quality of their input, so a leader who opens anchors the room. Letting the senior person speak last gets the others' views on the table first.
