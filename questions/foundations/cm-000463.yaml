topic: Shannon-Weaver model
topic_type: Theory
true_statement: Shannon's 1948 paper treated the meaning of messages as irrelevant to its engineering problem, so the model's use for human understanding rests on Warren Weaver's 1949 extension.
false_statement: Weaver's 1949 article treated the meaning of messages as irrelevant to its engineering problem, so the model's use for human understanding rests on Claude Shannon's 1948 extension.
explanation: Shannon wrote the 1948 engineering paper and set meaning aside; Weaver's 1949 Scientific American piece added the semantic and effectiveness levels. The false version swaps the two men and their dates.
