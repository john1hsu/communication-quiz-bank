topic: Words of estimative probability
topic_type: Technique
true_statement: 'A risk update reads: "We judge it very likely (80-95%) the launch slips, and we have moderate confidence in that." Under ICD 203 practice, that sentence should be split, because it mixes likelihood and confidence.'
false_statement: 'A risk update reads: "We judge it very likely (80-95%) the launch slips, and we have moderate confidence in that." Under ICD 203 practice, that sentence is ideal, because it pairs likelihood and confidence.'
explanation: Likelihood is how probable the event is; confidence is how solid the evidence is. ICD 203 requires that confidence never share a sentence with a likelihood term, so readers don't blur the two.
