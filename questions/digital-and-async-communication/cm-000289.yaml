id: cm-000289
area: digital-and-async-communication
kind: practice
topic: Scheduled inbox checks
topic_type: Technique
true_statement: During each scheduled inbox check, decide on every message in one pass, replying, delegating, scheduling or archiving it, rather than reading everything first and leaving the replies for later.
false_statement: During each scheduled inbox check, read every new message first to get the full picture, and leave the replies, delegations and archiving for a separate block later in the day.
explanation: One-pass triage closes each message out inside the check-in. Reading and leaving messages means meeting them all again later, so the inbox keeps pulling at your attention between the planned times.
