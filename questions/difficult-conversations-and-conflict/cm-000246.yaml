true_statement: When cancelling conference places you promised, name the specific cause, say what you argued for, and explain how refunds and development plans will be handled, rather than citing "business reasons."
false_statement: When cancelling conference places you promised, cite "business reasons" briefly and thank people for understanding, since a detailed cause only invites argument.
explanation: An account works through its adequacy; an empty one gives people nothing to judge and reads as arbitrary. Covering how people will be treated, not just why, reaches those whose first question is what happens to them next.
