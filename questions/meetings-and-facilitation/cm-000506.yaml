true_statement: Before approving a data-warehouse migration, a director asks a small sub-team to build a complete alternative plan and then has the two plans debated side by side. That is dialectical inquiry.
false_statement: Before approving a data-warehouse migration, a director asks a small sub-team to build a complete alternative plan and then has the two plans debated side by side. That is devil's advocacy.
explanation: 'The tell is the full counter-plan: dialectical inquiry builds and debates a rival option. A devil''s advocate instead critiques the leading proposal''s assumptions, evidence and logic without having to author a whole alternative.'
