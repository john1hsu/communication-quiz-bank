true_statement: 'Methot and colleagues found daily small talk at work had a cost as well as benefits: it disrupted engagement with work, though people high in self-monitoring were less affected.'
false_statement: 'Methot and colleagues found daily small talk at work had a cost as well as benefits: it disrupted engagement with work, though people low in self-monitoring were less affected.'
explanation: Small-talk days brought more positive emotion and helping, but the distraction reduced helping too, least so for high self-monitors. Keep chat brief when a colleague is mid-task.
