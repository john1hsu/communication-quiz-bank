true_statement: A support lead opens her ops-review proposal by tying a billing-page fix to leadership's customer-retention goal for the year. In Dutton and colleagues' terms, that is a packaging move.
false_statement: A support lead opens her ops-review proposal by tying a billing-page fix to leadership's customer-retention goal for the year. In Dutton and colleagues' terms, that is a process move.
explanation: Packaging means presenting the issue as a business case bundled with goals leaders already own. Process moves concern homework, channels and timing, such as choosing the scheduled ops review as the forum.
