true_statement: Schaerer, Swaab and Galinsky found that sellers with a weak alternative felt more powerful than sellers with none, yet made lower first offers and reached less profitable deals.
false_statement: Schaerer, Swaab and Galinsky found that sellers with a weak alternative felt more powerful than sellers with none, and made higher first offers and reached more profitable deals.
explanation: The weak alternative acted as a low anchor on the opening ask. That's why a weak BATNA should set your walk-away point, while your first offer is anchored on your goal.
