true_statement: 1-2-4-All was developed by Henri Lipmanowicz and Keith McCandless as part of Liberating Structures, a free collection of small-group formats.
false_statement: 1-2-4-All was developed by Frank Lyman in 1981 as a classroom method, and was later added to Liberating Structures.
explanation: Lyman proposed think-pair-share for classrooms in 1981; 1-2-4-All shares its alone-then-pair start but was designed by Lipmanowicz and McCandless for any group size.
