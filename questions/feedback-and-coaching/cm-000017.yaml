id: cm-000017
area: feedback-and-coaching
kind: practice
topic: Situation-Behavior-Impact
topic_type: Technique
true_statement: When SBI feedback is meant to change a behaviour, ask what the person was aiming for and listen before suggesting any fix.
false_statement: When SBI feedback is meant to change a behaviour, give your fix straight after the impact and ask about intent only if they push back.
explanation: The intent question turns feedback into a two-way coaching conversation and guards against treating a bad impact as a bad motive. Leading with the fix skips the listening the technique depends on.
