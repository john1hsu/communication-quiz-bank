true_statement: The Culture Map's eight scales were built from executives' real cases and anecdotes, and a 2021 review noted the book rarely engages with empirical research.
false_statement: The Culture Map's eight scales were built from a large validated survey of managers, and a 2021 review praised the book for its close engagement with empirical research.
explanation: The framework is practitioner knowledge rather than a measured instrument, so the reviewer saw it as a useful introduction to pair with real studies. Treat a country's place on a scale as a hypothesis to check with the person.
