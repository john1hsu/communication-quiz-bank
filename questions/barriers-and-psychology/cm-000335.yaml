area: barriers-and-psychology
kind: evidence
topic: Information overload
topic_type: Barrier
true_statement: Barley, Meyerson and Grodal found that hours worked did not explain email-related overload, and argued email partly acts as a symbol that draws attention away from other sources of overload.
false_statement: Barley, Meyerson and Grodal found that long working hours explained most email-related overload, and argued that complaints about email were really a stand-in for overwork.
explanation: In their study of high-tech professionals, time on email tracked felt overload but hours worked did not, so email became a symbol for strain from many sources. That is why persistent overload is worth reading as an organizational signal, such as meeting load or unclear priorities, not just an inbox problem.
