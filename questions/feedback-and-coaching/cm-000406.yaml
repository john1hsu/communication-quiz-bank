true_statement: Reviewing a consultant's muddled deck, a manager says, "Next time, sketch the storyline on sticky notes before you open the slides." In Hattie and Timperley's model that is process-level feedback.
false_statement: Reviewing a consultant's muddled deck, a manager says, "Next time, sketch the storyline on sticky notes before you open the slides." In Hattie and Timperley's model that is task-level feedback.
explanation: The comment targets the method that produced the deck, which is the process level. Task-level feedback would say what is right, wrong or missing in this particular deck, such as "slide 4 has no conclusion."
