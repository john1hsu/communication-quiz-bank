true_statement: Science educator Mary Budd Rowe separated the pause after a question from the pause after the reply, naming them wait time 1 and wait time 2.
false_statement: Science educator Kenneth Tobin separated the pause after a question from the pause after the reply, naming them wait time 1 and wait time 2.
explanation: Rowe named the two pauses after finding teachers waited under a second at both points. Tobin came later, reviewing the accumulated studies in 1987 and locating the benefit above about three seconds.
