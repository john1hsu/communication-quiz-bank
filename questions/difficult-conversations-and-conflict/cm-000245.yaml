true_statement: Telling her team the vendor review is cancelled, a director says, "I cut it to free budget for the security audit, which protects every client we have." That account is a justification, arguing the decision was right given a higher goal.
false_statement: Telling her team the vendor review is cancelled, a director says, "I cut it to free budget for the security audit, which protects every client we have." That account is an excuse, pointing to causes that reduce her responsibility.
explanation: She owns the choice and defends it by the goal it serves, which makes it a justification. An excuse would shift responsibility to outside causes, such as a finance-wide freeze she couldn't stop.
