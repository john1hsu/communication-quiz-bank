topic: Follow-up questions
topic_type: Technique
true_statement: When probing a colleague's account of a project, use an expansive probe such as "What did that look like?" when you need breadth, and a targeted one such as "How sure are you?" when you need precision.
false_statement: When probing a colleague's account of a project, use a targeted probe such as "How sure are you?" when you need breadth, and an expansive one such as "What did that look like?" when you need precision.
explanation: Expansive probes open the answer up and gather more detail; targeted probes pin down one point, such as confidence or how a decision was made. Choose by whether you need range or exactness.
