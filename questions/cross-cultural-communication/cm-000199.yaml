true_statement: Edward T. Hall's 1959 book The Silent Language, the field's founding work, grew out of team efforts at the U.S. Foreign Service Institute to prepare diplomats for postings abroad.
false_statement: Edward T. Hall's 1959 book The Silent Language, the field's founding work, grew out of Darla Deardorff's research on assessing intercultural competence.
explanation: Between 1946 and 1956, linguists and anthropologists at the Foreign Service Institute developed the ideas while training diplomats, which explains the field's practical bent. Deardorff's competence work came decades later.
