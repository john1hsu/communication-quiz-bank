kind: practice
topic: Silence and pauses
topic_type: Skill
true_statement: When a junior colleague raises a risk in a team meeting, respond to it promptly as chair, rather than letting a few seconds of silence hang after she speaks.
false_statement: When a junior colleague raises a risk in a team meeting, let a few seconds of silence hang as chair before responding, to show you are weighing it seriously.
explanation: In the Groningen experiments a brief silence in a group conversation left viewers feeling rejected even when they did not notice it. Right after someone takes a social risk, a gap reads as rejection; save the thinking pause for hard questions put to you.
