true_statement: Lee Sproull and Sara Kiesler at Carnegie Mellon framed workplace email as a loss of social context cues, in a 1986 field study at a Fortune 500 company.
false_statement: Joseph Walther and Judee Burgoon framed workplace email as a loss of social context cues, in a 1986 field study at a Fortune 500 company.
explanation: The cues-filtered-out framing came from Sproull and Kiesler's field study of real employee email. Walther and Burgoon came later, in 1992, and challenged that picture rather than proposing it.
