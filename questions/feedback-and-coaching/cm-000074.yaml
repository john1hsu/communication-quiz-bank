kind: practice
topic: Feedback
topic_type: Concept
true_statement: When asking a colleague for input on your work, say which kind you need (appreciation, coaching or evaluation) and ask a narrow question such as "What's one thing I could do differently?"
false_statement: When asking a colleague for input on your work, ask a broad "Any feedback for me?" and leave it to them to decide which kind of feedback to give.
explanation: Heen notes people want different kinds of feedback at different times, and evaluation can drown out the coaching inside it. Naming the kind and narrowing the question makes the answer usable.
