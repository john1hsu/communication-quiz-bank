id: cm-000430
area: barriers-and-psychology
kind: scenario
topic: Emotional contagion
topic_type: Phenomenon
true_statement: A support manager opens a client-escalation huddle sighing and muttering, "This is a disaster." Within minutes her team is snapping at each other, though nobody mentions her tone. That is emotional contagion.
false_statement: A support manager opens a client-escalation huddle sighing and muttering, "This is a disaster." Within minutes her team is snapping at each other, though nobody mentions her tone. That is low psychological safety.
explanation: Her irritation spreads to the group without anyone noticing it happen, which is mood transfer; leaders are an especially strong source because people watch them. Psychological safety is about whether people dare to speak up or admit mistakes, which this exchange does not show.
