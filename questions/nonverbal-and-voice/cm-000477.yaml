true_statement: When reporting revenue, growth and margin aloud, give each figure its own chunk with a short silent pause after it, rather than running all three together in one breath.
false_statement: When reporting revenue, growth and margin aloud, run all three figures together in one breath and pause once at the end, rather than pausing after each figure.
explanation: A pause and slight pitch drop after each number lets listeners hear which figure goes with which measure and hold it before the next arrives. Strung together, the figures blur, which is the problem the finance example fixes.
