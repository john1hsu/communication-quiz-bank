true_statement: Ethnocentrism is usually credited to William Graham Sumner in 1906, but a 2014 review found Ludwig Gumplowicz using the concept around 1879, so Sumner popularised rather than coined it.
false_statement: Ethnocentrism is usually credited to Ludwig Gumplowicz in 1906, but a 2014 review found William Graham Sumner using the concept around 1879, so Gumplowicz popularised rather than coined it.
explanation: Bizumic's history traced the idea to Gumplowicz's writing from 1879 and 1881; Sumner's 1906 description became the standard reference. The false version swaps the two scholars.
