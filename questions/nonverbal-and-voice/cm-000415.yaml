topic: Acoustic speech-analysis coaching
topic_type: Technique
true_statement: Before a board update, a manager runs a speech-analysis tool that flags her pace, flat pitch and fillers, and she tries to fix all three in one evening's practice. That is chasing every metric.
false_statement: Before a board update, a manager runs a speech-analysis tool that flags her pace, flat pitch and fillers, and she tries to fix all three in one evening's practice. That is over-correcting.
explanation: 'Working on every flagged reading at once dilutes the practice; the published training picked one parameter and drilled it until it shifted. Over-correcting is a different mistake: pushing one reading so far that the voice stops sounding natural.'
