topic: Mirroring
topic_type: Technique
true_statement: In Hale and Hamilton's 2016 virtual-reality work, a rapport boost from being mimicked appeared in an exploratory study but did not hold up in a pre-registered follow-up.
false_statement: In Hale and Hamilton's 2016 virtual-reality work, a rapport boost from being mimicked appeared in an exploratory study and was confirmed in a pre-registered follow-up.
explanation: The pre-registered replication found no reliable effect on rapport or trust, which is why mirroring's evidence is rated mixed. Treat it as a way to draw out detail and show attention, not a guaranteed trust builder.
