area: nonverbal-and-voice
kind: practice
topic: Gaze and eye contact
topic_type: Skill
true_statement: When you're working out a hard answer in a one-to-one, it's fine to look away while you think, then come back to the person's eyes to land your main point.
false_statement: When you're working out a hard answer in a one-to-one, keep holding the person's eyes while you think, so you don't come across as evasive.
explanation: Eye contact draws on general mental resources and slowed people on the hardest tasks, so glancing away while thinking is normal. Holding gaze through a complex answer adds load without signalling anything extra.
