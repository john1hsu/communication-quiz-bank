kind: practice
topic: Manager one-on-one meetings
topic_type: Context
true_statement: In a one-on-one, open with the direct report's agenda items, for example "What's on your list?", and save the manager's own topics for the end.
false_statement: In a one-on-one, open with the manager's own topics so they don't get squeezed out, and take the direct report's agenda items at the end.
explanation: Putting the report's items first makes the meeting follow their priorities and surfaces blockers the manager would not think to ask about. Leading with the manager's list tends to crowd out the report's concerns.
