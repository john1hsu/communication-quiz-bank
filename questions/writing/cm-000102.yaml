true_statement: A 2022 systematic review of plain language summaries of research concluded that most criteria in plain-language writing guidelines did not yet have empirical support.
false_statement: A 2022 systematic review of plain language summaries of research concluded that most criteria in plain-language writing guidelines were backed by consistent experimental evidence.
explanation: Whole rewrites for an audience tend to help, but studies rarely isolate which rule did the work, so individual guidelines remain unproven. That gap is why plain language is rated mixed rather than robust.
