topic: Aristotle's Rhetoric
topic_type: Work
true_statement: A team lead asking a steering committee to fund a test environment frames her case around future benefits and risks. In Aristotle's terms, that fits an audience judging what is advantageous for the future.
false_statement: A team lead asking a steering committee to fund a test environment frames her case around who caused past outages. In Aristotle's terms, that fits an audience judging what is advantageous for the future.
explanation: 'Aristotle defines each kind of speech by what its audience must judge: an assembly decides future advantage, a court judges past acts. A funding decision is forward-looking, so blame for past failures is the wrong frame.'
