id: cm-000059
area: listening
kind: practice
topic: Paraphrasing
topic_type: Technique
true_statement: When an operations lead says a vendor's Tuesday deliveries clash with the weekly stock count, restate the clash and the worry behind it in your own words and ask whether that is the main problem, before defending the schedule.
false_statement: When an operations lead says a vendor's Tuesday deliveries clash with the weekly stock count, explain first that procurement signed off on the schedule last month, then ask how the warehouse can make it work.
explanation: Restating the specific facts and concern, then inviting correction, lets the other person confirm the picture before anyone argues for a solution. Leading with the sign-off defends the plan before you have shown you understood the problem.
