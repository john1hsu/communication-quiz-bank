topic: Trusted advisor
topic_type: Framework
true_statement: Opening a quarterly review, an account lead spends ten minutes on her firm's awards, then pitches an add-on service before asking about the client's goals. In trust-equation terms, that raises self-orientation, which divides trust.
false_statement: Opening a quarterly review, an account lead spends ten minutes on her firm's awards, then pitches an add-on service before asking about the client's goals. In trust-equation terms, that raises credibility, which outweighs the other terms.
explanation: Talking up your firm and selling before asking about the client puts visible focus on your own revenue and image, which is self-orientation, the denominator. Credibility is about believable expertise, and it is only one of three numerator terms, not a trump card.
