id: cm-000213
area: foundations
kind: practice
topic: Common ground and grounding theory
topic_type: Theory
true_statement: In a team spread across offices, treat a colleague's silence on your proposal as missing evidence of understanding and ask directly, rather than reading it as agreement.
false_statement: In a team spread across offices, treat a colleague's silence on your proposal as agreement once a reasonable time has passed, rather than chasing for an explicit reply.
explanation: Grounding needs positive evidence such as a relevant reply or a read-back; silence in a dispersed team could mean anything, from disagreement to a holiday. Without that evidence, the message hasn't reached common ground.
