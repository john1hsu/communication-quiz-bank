true_statement: In Tey and colleagues' 2021 studies, people who received concessions that shrank step by step made less ambitious counteroffers than those who received concessions in other patterns.
false_statement: In Tey and colleagues' 2021 studies, people who received concessions that shrank step by step made more ambitious counteroffers than those who received concessions in other patterns.
explanation: Shrinking steps signal that a negotiator is nearing their limit, which tempers the other side's demands. The effect weakened at extreme paces or round counts, and it only stays ethical when the limit it signals is real.
