true_statement: Ray Tomlinson chose "@" to separate the user's name from the host computer in network email addresses because it could not be mistaken for part of a name.
false_statement: Ray Tomlinson chose "@" to separate the user's name from the host computer in network email addresses because it was already the standard symbol for addresses on printers.
explanation: He needed a separator that no name would contain and that signalled where the user was, and the user@host format is still standard. The printer link is invented; he actually rejected a printer-based protocol.
