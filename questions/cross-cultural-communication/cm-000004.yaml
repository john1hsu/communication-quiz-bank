id: cm-000004
area: cross-cultural-communication
kind: scenario
topic: Direct vs. indirect feedback
topic_type: Concept
true_statement: A manager tells a colleague from a blunter culture that a report is "perhaps not quite there yet", and the colleague sends it unchanged. The manager's phrase was a downgrader, softening a serious problem into what sounded like a suggestion.
false_statement: A manager tells a colleague from a blunter culture that a report is "perhaps not quite there yet", and the colleague sends it unchanged. The manager's phrase was an upgrader, sharpening the criticism so it sounded harsher than meant.
explanation: Words like "perhaps" and understatement such as "not quite there" are downgraders that cushion criticism. Decoded in a direct style, the warning was heard as optional; upgraders are intensifiers like "totally" or "absolutely".
