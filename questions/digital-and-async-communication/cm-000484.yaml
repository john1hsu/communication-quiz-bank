true_statement: In Gloria Mark's lab experiment, people interrupted every few minutes while answering email finished faster but reported more stress and effort, because they compensated by working harder.
false_statement: In Gloria Mark's lab experiment, people interrupted every few minutes while answering email finished more slowly and reported more stress, because each interruption made them start the task over.
explanation: Interrupted participants sped up, not down; the cost showed up as stress, frustration, time pressure and effort. That hidden cost is why chat etiquette tries to cut needless alerts. The study had 48 mostly student participants, so it is indirect support.
