topic: 1-2-4-All
topic_type: Technique
true_statement: In the whole-group share of 1-2-4-All, ask each group of four for one important idea not yet on the board, rather than letting the most confident group report everything it discussed.
false_statement: In the whole-group share of 1-2-4-All, let the most confident group report everything it discussed first, then ask the other groups whether they have anything to add.
explanation: The final share is where the bold can dominate again. One new idea per group spreads airtime and avoids repeats; this is practitioner guidance, backed only indirectly by classroom research.
