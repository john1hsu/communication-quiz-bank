true_statement: In lab studies Legg and Sweeny reported in 2013, 78% of recipients wanted the bad news first, while news-givers mostly preferred to start with good news.
false_statement: In lab studies Legg and Sweeny reported in 2013, 78% of news-givers wanted to give the bad news first, while recipients mostly preferred to start with good news.
explanation: Recipients wanted the bad news first and ended up less worried when they got it; givers leaned toward cushioning, which mainly serves the speaker. Imagining the recipient's feelings shifted givers only slightly.
