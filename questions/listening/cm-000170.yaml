topic: Wait time
topic_type: Technique
true_statement: In a retro, a product manager asks, "What slowed us down?" and a second later adds, "Was it the test environment? Or the late spec changes?" He has filled wait time 1, turning an open question into multiple choice.
false_statement: In a retro, a product manager asks, "What slowed us down?" and a second later adds, "Was it the test environment? Or the late spec changes?" He has skipped wait time 2, the pause after someone answers.
explanation: Wait time 1 is the silence right after you ask; offering options during it lets the asker's guesses steer the reply. Wait time 2 comes after an answer, and nobody has answered yet.
