area: listening
kind: scenario
topic: Support response
topic_type: Technique
true_statement: A designer says the client rejected her mock-ups twice this week, and her lead replies, "Twice? Last year a client rejected mine six times." That is a shift response.
false_statement: A designer says the client rejected her mock-ups twice this week, and her lead replies, "Twice? Last year a client rejected mine six times." That is a support response.
explanation: The reply turns her news into an opening for his own story, moving attention to him. A support response would keep the topic hers, for example "Twice - what did they push back on?"
