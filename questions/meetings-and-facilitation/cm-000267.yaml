kind: scenario
topic: Facilitation
topic_type: Skill
true_statement: In a retro, the team lead running the discussion says, "Honestly, I think the real problem is the test environment, so let's spend our time there." As facilitator, she has given up her neutral stance by steering the content.
false_statement: In a retro, the team lead running the discussion says, "Honestly, I think the real problem is the test environment, so let's spend our time there." As facilitator, she is keeping discussion on track by redirecting a tangent.
explanation: A facilitator owns the process and leaves the content to the group; the tell here is that she names the cause herself and points the group at it. Redirecting a tangent brings people back to the agreed agenda, not to the chair's preferred answer.
