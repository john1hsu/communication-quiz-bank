true_statement: In Blunden and colleagues' studies, asking reviewers for "advice" rather than "feedback" drew more concrete, actionable input, an effect strongest for improvement suggestions and weaker for comments on strengths.
false_statement: In Blunden and colleagues' studies, asking reviewers for "advice" rather than "feedback" drew more concrete, actionable input, an effect strongest for comments on strengths and weaker for improvement suggestions.
explanation: Advice framing pushes reviewers to think about what you should do next, which sharpens suggestions for improvement most; praise for strengths changed less. The studies measured the quality of input, not whether people then improved.
