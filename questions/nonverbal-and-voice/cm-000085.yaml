true_statement: At a trade-show demo, a visiting client keeps stepping closer as a sales engineer talks, and the engineer silently labels him pushy. That reads a likely difference in distance norms as a flaw of character.
false_statement: At a trade-show demo, a visiting client keeps stepping closer as a sales engineer talks, and the engineer silently labels him pushy. That is an accurate read, since closing distance reliably signals pushiness.
explanation: People tend to blame closeness on the person rather than on a cultural norm. The better move is to assume a norm difference first and adjust, since comfortable distances vary by culture, gender and age.
