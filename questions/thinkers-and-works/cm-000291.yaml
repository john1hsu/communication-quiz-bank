topic: The Culture Map
topic_type: Work
true_statement: 'Erin Meyer''s central idea in The Culture Map is relativity: what matters is where a culture sits on a scale compared with the people you work with, not its absolute position.'
false_statement: 'Erin Meyer''s central idea in The Culture Map is absolute position: what matters is where a culture sits on each scale, whichever colleagues you happen to be working with.'
explanation: Two cultures that both look direct to an outsider can still clash, because each judges the other from its own spot on the scale. So the useful question is how your position differs from your counterpart's.
