kind: scenario
topic: Spotlight effect
topic_type: Barrier
true_statement: After mispronouncing a client's product name once during a pitch, a consultant replays it for days, sure everyone in the room remembers it. That is the spotlight effect.
false_statement: After mispronouncing a client's product name once during a pitch, a consultant replays it for days, sure everyone in the room remembers it. That is the illusion of transparency.
explanation: She overestimates how much others noticed and will remember her slip, which is the spotlight effect. The illusion of transparency is about overestimating how well others can read your inner feelings.
