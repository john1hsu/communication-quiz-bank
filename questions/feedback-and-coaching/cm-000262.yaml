kind: practice
topic: Performance review
topic_type: Context
true_statement: When a report pushes back on her rating in a performance review, ask what she sees differently and explore her reasons, rather than restating the case for the rating.
false_statement: When a report pushes back on her rating in a performance review, restate the evidence for the rating firmly, so the disagreement doesn't take over the meeting.
explanation: Disagreement is the main way employees actively take part in reviews, so expect it and explore it. Defending the rating turns the meeting back into a one-way verdict, and disagreement already goes with feeling less supported by the manager.
