true_statement: Popular rules that teams need a precise ratio of positive to negative comments, such as 5.6 to 1, trace to a model whose mathematics Brown, Sokal and Friedman showed in 2013 to be unfounded.
false_statement: Popular rules that teams need a precise ratio of positive to negative comments, such as 5.6 to 1, trace to a model that Brown, Sokal and Friedman confirmed in a 2013 replication.
explanation: Brown, Sokal and Friedman debunked the Fredrickson-Losada positivity-ratio maths, so there is no magic number. Mostly positive interaction is still sound advice; the precise ratio is the myth.
