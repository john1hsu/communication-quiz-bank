true_statement: Reviewing an analyst's deck that hides the recommendation on slide 14, a lead says, "Great job overall! Maybe think about the order a bit? But honestly, it's great." The generic praise buries the fix, so she may hear only "great job."
false_statement: Reviewing an analyst's deck that hides the recommendation on slide 14, a lead says, "Great job overall! Maybe think about the order a bit? But honestly, it's great." That is a well-built sandwich, since praise surrounds the correction.
explanation: Even the sandwich's own advocates require specific, sincere praise and one plainly stated correction with an alternative. Here the praise is padding and the fix is a vague hint, so the correction is easy to miss.
