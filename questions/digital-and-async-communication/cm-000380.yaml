topic: Video call communication
topic_type: Channel
true_statement: For a distributed team that must come up with new product ideas, plan in-person time or solo idea generation first, and use video for evaluating and choosing among the ideas.
false_statement: For a distributed team that must come up with new product ideas, generate the ideas together over video, and save in-person time for evaluating and choosing among them.
explanation: Brucks and Levav found video pairs produced fewer creative ideas than pairs in the same room but were no worse at picking which idea to pursue. So video is the weak channel for generation, not for selection.
