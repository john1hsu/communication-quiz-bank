topic: 'The illusion of transparency: Biased assessments of others'' ability to read one''s emotional states'
topic_type: Study
true_statement: Gilovich and colleagues proposed that when each bystander thinks their own alarm shows but sees everyone else looking calm, each concludes the others are unworried, so nobody steps in.
false_statement: Gilovich and colleagues proposed that when each bystander thinks their own alarm is hidden but sees everyone else looking worried, each assumes someone else will act, so nobody steps in.
explanation: In the cheating study people felt more concerned than they looked yet believed their concern was visible. Reading others' calm faces as calm minds is the proposed route to silence; the false version reverses what each person believes about their own visibility.
