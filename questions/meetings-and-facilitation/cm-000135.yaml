area: meetings-and-facilitation
kind: evidence
topic: Meeting agendas
topic_type: Technique
true_statement: In Leach and colleagues' 2009 surveys, circulating a written agenda before the meeting was linked to higher perceived effectiveness, while one handed out only at the meeting showed no significant link.
false_statement: In Leach and colleagues' 2009 surveys, handing out a written agenda at the start of the meeting was linked to higher perceived effectiveness, while one circulated beforehand showed no significant link.
explanation: The benefit is tied to sending it ahead, partly because attendees then feel more involved. The links were small and correlational, so the agenda's design and use matter more than its existence.
