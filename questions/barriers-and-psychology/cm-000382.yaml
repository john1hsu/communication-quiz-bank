true_statement: In a quarterly review, an analyst shows the cost chart on one slide and explains what its lines mean on the next, so the room keeps asking her to flip back. The design adds extraneous load through split attention.
false_statement: In a quarterly review, an analyst shows the cost chart on one slide and explains what its lines mean on the next, so the room keeps asking her to flip back. The design adds extraneous load through redundancy.
explanation: Listeners must hold one source in mind while hunting for the other, which is split attention; the fix is to put the explanation and labels on the chart itself. Redundancy would mean repeating the same information twice, such as reading out text already on screen.
