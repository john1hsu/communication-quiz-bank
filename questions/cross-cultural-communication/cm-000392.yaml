id: cm-000392
area: cross-cultural-communication
kind: practice
topic: Culture assimilator
topic_type: Technique
true_statement: When building a culture assimilator for your team, keep only the episodes whose correct explanation members of the other culture broadly agree on.
false_statement: When building a culture assimilator for your team, keep only the episodes whose correct explanation your team's most experienced expatriate managers agree on.
explanation: The method aims at explaining behaviour the way the other culture would, so insiders of that culture must confirm each answer. Outsiders, however experienced, can share the very misreading the episode is meant to correct.
