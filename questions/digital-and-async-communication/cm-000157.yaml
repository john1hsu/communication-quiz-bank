topic: Zoom fatigue
topic_type: Barrier
true_statement: Bailenson's 2021 nonverbal-overload account of Zoom fatigue was offered as hypotheses drawn from older research, not as findings already tested on video calls.
false_statement: Bailenson's 2021 nonverbal-overload account of Zoom fatigue was offered as findings from his own controlled tests on video calls, not as hypotheses.
explanation: Bailenson proposed four design features (close-up gaze, cue effort, self-view, being kept still) and said they were untested on video calls. Other teams then measured fatigue in field and lab studies, with mixed results on the camera.
