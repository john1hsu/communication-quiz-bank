topic: Egocentric bias
topic_type: Barrier
true_statement: A product lead who chose the new sprint cadence tells her director, "Honestly, the whole team will be on board with this," though she hasn't asked anyone. Assuming others share a choice because she made it is egocentric bias, in its false-consensus form.
false_statement: A product lead who chose the new sprint cadence tells her director, "Honestly, the whole team will be on board with this," though she hasn't asked anyone. Assuming others share a choice because she made it is the curse of knowledge.
explanation: Her own choice is colouring her estimate of how many others would choose the same, the false-consensus pull of egocentric bias. The curse of knowledge is about forgetting background others lack, which isn't the issue here.
