id: cm-000083
area: negotiation
kind: practice
topic: First offer
topic_type: Technique
true_statement: Having found that similar analytics retainers cost $8K-11K a month, a buyer should open with a precise figure near the low end, give a one-sentence reason, then stop and listen.
false_statement: Having found that similar analytics retainers cost $8K-11K a month, a buyer should say there is no fixed budget yet and ask what the agency would normally charge.
explanation: Knowing the market as well as the agency, she can set the reference point herself with a stated rationale. Asking them to name a price invites an anchor at the top of the range.
