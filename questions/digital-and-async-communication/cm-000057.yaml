true_statement: In Kushlev and Dunn's 2015 field experiment, people told to check email three times a day with notifications off reported lower daily stress than in a week of unlimited checking.
false_statement: In Kushlev and Dunn's 2015 field experiment, people told to check email three times a day with notifications off reported higher daily stress than in a week of unlimited checking.
explanation: Batching email checks lowered daily stress in this exploratory study, though it did not change overall weekly stress. The finding supports checking on purpose rather than reacting to every notification.
