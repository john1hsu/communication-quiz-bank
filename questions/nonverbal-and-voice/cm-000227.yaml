id: cm-000227
area: nonverbal-and-voice
kind: scenario
topic: Gesturing while speaking
topic_type: Skill
true_statement: Presenting the quarterly forecast, a manager keeps twisting his pen and touching his collar between slides. Those movements are adaptors, which tend to read as anxiety.
false_statement: Presenting the quarterly forecast, a manager keeps twisting his pen and touching his collar between slides. Those movements are illustrators, which help listeners follow the content.
explanation: Illustrators move with speech to show size, shape or sequence; adaptors are self-touching or fidgeting that signal arousal. Filming a rehearsal and watching it silently is the usual way to catch them.
