area: listening
kind: evidence
topic: Open-ended questions
topic_type: Technique
true_statement: Minson and colleagues found that questions presuming a problem exists, such as "What problems have you had with it?", drew more honest disclosure of bad news than general ones.
false_statement: Minson and colleagues found that general questions, such as "What do you think of it?", drew more honest disclosure of bad news than ones presuming a problem exists.
explanation: In written tasks and face-to-face meetings, problem-presuming questions surfaced concealed issues best, and general questions did worst. It challenges the idea that a neutral open question is always most revealing.
