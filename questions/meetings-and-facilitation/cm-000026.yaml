id: cm-000026
area: meetings-and-facilitation
kind: practice
topic: Psychological safety
topic_type: Phenomenon
true_statement: To make it safer to raise problems in a status meeting, a leader can go first by naming something she got wrong or doesn't know.
false_statement: To make it safer to raise problems in a status meeting, a leader should first present the plan as settled, so the team sees confidence before voicing doubts.
explanation: Modelling fallibility lowers the price of the next admission, and framing the work as a learning problem invites every view. Presenting the plan as settled tells people the answer is already decided.
