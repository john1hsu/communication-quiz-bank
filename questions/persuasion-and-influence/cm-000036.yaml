topic: Influence without authority
topic_type: Technique
true_statement: Yukl and Tracey's 1992 study found exchange and ingratiation helped moderately when influencing peers and subordinates, but not when influencing bosses.
false_statement: Yukl and Tracey's 1992 study found exchange and ingratiation helped most when influencing bosses, but not when influencing peers and subordinates.
explanation: Rational persuasion, inspirational appeals and consultation won commitment in every direction; trade-based tactics only helped sideways and downward. Overt quid-pro-quo is the weakest part of the influence model's evidence.
