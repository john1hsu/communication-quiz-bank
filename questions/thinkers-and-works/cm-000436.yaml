true_statement: In their 2001 paper "First offers as anchors", Adam Galinsky and Thomas Mussweiler found that whichever side opened, buyer or seller, tended to get the better deal.
false_statement: In their 2001 paper "First offers as anchors", Adam Galinsky and Thomas Mussweiler found that whichever side waited for the other to open, buyer or seller, tended to get the better deal.
explanation: The experiments showed a first-mover advantage, with the opening number strongly predicting the final price, face to face and over email. That turned anchoring into tested negotiation advice.
