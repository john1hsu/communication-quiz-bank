topic: Nonverbal communication
topic_type: Concept
true_statement: If a colleague goes quiet and frowns while you present a plan, ask about it afterwards, such as "You went quiet at the deadline. Is it workable?", rather than concluding she disagrees.
false_statement: If a colleague goes quiet and frowns while you present a plan, treat it as disagreement and rebut her likely objections, since a frown with silence reliably signals it.
explanation: A frown or silence doesn't specify an emotion or intent; she may just be working through the numbers. Checking turns a guess into information, while acting on the guess can start an argument nobody was having.
