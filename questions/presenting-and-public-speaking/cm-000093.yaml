true_statement: A 2019 meta-analysis of 30 randomized trials found psychological treatments reduced fear of public speaking with a moderate-to-large effect (g = 0.74) that grew larger at follow-up.
false_statement: A 2019 meta-analysis of 30 randomized trials found psychological treatments reduced fear of public speaking with a moderate-to-large effect (g = 0.74) that had faded by follow-up.
explanation: The effect rose to g = 1.11 at follow-up, suggesting people kept improving after treatment. Self-reported gains were larger than physiological or behavioural ones, and small trial arms are a limit.
