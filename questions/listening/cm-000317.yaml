topic: Labeling emotions
topic_type: Technique
true_statement: In Lieberman's 2011 experiments, people correctly expected reappraising a feeling to help but wrongly expected that labeling it would make them feel worse; labeling in fact made them feel slightly better.
false_statement: In Lieberman's 2011 experiments, people correctly expected labeling a feeling to help but wrongly expected that reappraising it would make them feel worse; reappraisal in fact made them feel slightly better.
explanation: The forecasting error was about labeling, not reappraisal, and it helps explain why managers avoid naming emotions they can plainly see. The benefit was real but small, so labeling is a modest aid, not a guaranteed de-escalator.
