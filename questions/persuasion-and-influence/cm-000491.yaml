true_statement: Each week an analyst mentions in stand-up that she worked late or over the weekend to finish her part. In Jones and Pittman's taxonomy she is using exemplification, aiming to look dedicated.
false_statement: Each week an analyst mentions in stand-up that she worked late or over the weekend to finish her part. In Jones and Pittman's taxonomy she is using ingratiation, aiming to look likeable.
explanation: Advertising extra effort targets an image of dedication, which is exemplification. Ingratiation seeks to be liked, through favours or flattery; the article also notes exemplification is linked to perceptions of office politics.
