topic: Anchoring and adjustment
topic_type: Phenomenon
true_statement: Anchoring replicates strongly, but a 2025 set of preregistered studies found no evidence that less time to adjust makes it stronger, a core prediction of the insufficient-adjustment account.
false_statement: Anchoring replicates strongly, and a 2025 set of preregistered studies confirmed that less time to adjust makes it stronger, as the insufficient-adjustment account predicts.
explanation: Röseler and colleagues found anchoring robust in classic designs but no time effect, so the effect is settled while its mechanism is not. Selective accessibility, where anchor-consistent facts come to mind more easily, is the rival explanation.
