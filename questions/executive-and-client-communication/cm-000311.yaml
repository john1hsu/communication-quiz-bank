true_statement: In Ko's 2010 field survey of consultant-client pairs, clients' benevolent trust in their consultants, not their competence trust, predicted successful knowledge transfer.
false_statement: In Ko's 2010 field survey of consultant-client pairs, clients' competence trust in their consultants, not their benevolent trust, predicted successful knowledge transfer.
explanation: Clients who believed the consultant cared about their interests absorbed more, which fits the framework's stress on intimacy and low self-orientation over expertise alone. It is one study in one setting, and the trust equation itself remains a practitioner model.
