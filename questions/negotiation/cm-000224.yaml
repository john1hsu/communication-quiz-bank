topic: Concession strategy
topic_type: Technique
true_statement: 'Asked for a 15% renewal discount, a vendor''s account manager replies, "OK, we can do 15% off. Shall I send the paperwork?" She has made a one-sided concession: the whole budget at once, unlabelled, with nothing asked in return.'
false_statement: Asked for a 15% renewal discount, a vendor's account manager replies, "OK, we can do 15% off. Shall I send the paperwork?" She has made a contingent concession, tied to the client signing quickly.
explanation: A contingent concession states what you need back, as in "we can do X if you can do Y". Here nothing is asked or named, so the client learns the price was soft and has no reason to give anything back.
