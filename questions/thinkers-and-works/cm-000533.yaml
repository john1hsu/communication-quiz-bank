topic: The Effects of Feedback Interventions on Performance
topic_type: Study
true_statement: Pooling 607 effect sizes, Kluger and DeNisi's 1996 meta-analysis put the average effect of feedback interventions on performance at d = 0.41, a moderate gain.
false_statement: Pooling 607 effect sizes, Kluger and DeNisi's 1996 meta-analysis put the average effect of feedback interventions on performance at d = 0.91, a very large gain.
explanation: The average was moderate, d = 0.41, and hid wide spread, with many interventions hurting performance. A very large average would not fit the study's message that feedback often backfires.
