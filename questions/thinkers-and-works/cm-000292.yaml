true_statement: When a colleague's way of disagreeing clashes with yours, Meyer's advice is to explain your own style and adjust it, rather than expect the colleague to adopt yours.
false_statement: When a colleague's way of disagreeing clashes with yours, Meyer's advice is to state your team's style once, clearly, and expect the colleague to adopt it.
explanation: Her rules ask managers to see themselves from colleagues' perspective and keep adjusting their own behaviour. Insisting others conform treats your own spot on the scale as the norm. The advice is practitioner guidance, not tested intervention.
