kind: scenario
topic: Ethnocentrism
topic_type: Barrier
true_statement: In a design review, a manager waves off a proposal from an engineer with a strong accent as "not thought through", then praises the same idea when a same-culture colleague raises it a week later. That uneven credibility is a sign of ethnocentrism.
false_statement: In a design review, a manager waves off a proposal from an engineer with a strong accent as "not thought through", then praises the same idea when a same-culture colleague raises it a week later. That is a fair call on delivery, not ethnocentrism.
explanation: The idea was identical; only the messenger changed. Trusting the same content more from someone who shares your culture is a classic ethnocentric filter on credibility, not a judgement about delivery.
