topic: 1-2-4-All
topic_type: Technique
true_statement: A lead asks ten engineers, "What should we change to cut incidents?", hears a senior engineer suggest more alerting, asks "Anyone else? No?" and records it as the action. The first senior voice has set the answer, an unequal-participation problem.
false_statement: A lead asks ten engineers, "What should we change to cut incidents?", hears a senior engineer suggest more alerting, asks "Anyone else? No?" and records it as the action. That is fair consensus, since everyone had a chance to speak.
explanation: In an open round the quickest or most senior person anchors the room, and quieter people rarely speak up. A minute of silent writing followed by pairs gives everyone an idea and a low-risk audience first.
