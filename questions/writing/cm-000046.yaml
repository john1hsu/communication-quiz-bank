topic: Active voice
topic_type: Technique
true_statement: A release note reads, "The team shipped the fix last night." An editor flags it as passive because it describes the past, but the sentence is already in active voice.
false_statement: A release note reads, "The team shipped the fix last night." An editor flags it as passive because it describes the past, and the sentence should be rewritten into active voice.
explanation: The doer, the team, is the subject, so the sentence is active; past tense is a separate question from voice. A passive would look like "The fix was shipped", a form of "to be" plus a past participle.
