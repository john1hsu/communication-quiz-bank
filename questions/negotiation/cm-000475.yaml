true_statement: Kern, Brett, Weingart and Eck found that people entering multiparty negotiations held weaker fixed-pie perceptions than people negotiating in pairs.
false_statement: Kern, Brett, Weingart and Eck found that people entering multiparty negotiations held stronger fixed-pie perceptions than people negotiating in pairs.
explanation: Across three studies and an internal meta-analysis, the fixed-pie belief was weaker when more than two parties were at the table. The false version reverses the direction of the effect; note that most of this evidence comes from simulations.
