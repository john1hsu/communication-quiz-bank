kind: scenario
topic: Meeting recaps
topic_type: Technique
true_statement: 'A project lead''s recap lists "Marketing to follow up on the pricing page" and "We''ll look into the API errors." Those are owners by implication: neither action names one responsible person or a date.'
false_statement: 'A project lead''s recap lists "Marketing to follow up on the pricing page" and "We''ll look into the API errors." That is a transcript recap: a blow-by-blow account that buries the decisions.'
explanation: The tell is "marketing" and "we" in place of a named person, and no due date. A transcript recap is the opposite problem, too much narrative; the fix here is one owner, a verb-first task and a deadline per line.
