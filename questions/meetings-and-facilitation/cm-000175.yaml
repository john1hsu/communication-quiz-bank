id: cm-000175
area: meetings-and-facilitation
kind: definition
topic: RACI matrix
topic_type: Technique
true_statement: In a RACI matrix, Consulted people give input before the work is finished, while Informed people are told the outcome afterwards.
false_statement: In a RACI matrix, Informed people give input before the work is finished, while Consulted people are told the outcome afterwards.
explanation: The C column is whose expertise must be heard before a deadline; the I column is your distribution list once the decision is made. Mixing them up either floods people with reviews or leaves needed experts out.
