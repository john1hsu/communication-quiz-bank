area: difficult-conversations-and-conflict
kind: practice
topic: Apology
topic_type: Genre
true_statement: An apology email for sending a client the wrong file should name the error in the first person, state what it cost them and offer a dated fix, without asking the client to forgive you.
false_statement: An apology email for sending a client the wrong file should name the error in the first person, state what it cost them and offer a dated fix, then close by asking the client to forgive you.
explanation: In Lewicki and colleagues' tests, a request for forgiveness was the component people rated least effective, while responsibility and repair rated highest. Ending with a plea shifts the focus to your discomfort and puts a demand on the person you harmed.
