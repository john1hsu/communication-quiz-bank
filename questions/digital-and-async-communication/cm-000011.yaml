id: cm-000011
area: digital-and-async-communication
kind: practice
topic: Channel selection
topic_type: Technique
true_statement: After settling a contested decision on a call, send a same-day written recap of the decision, owners and dates.
false_statement: After settling a contested decision on a call, book a second call to confirm the decision, owners and dates instead of writing them down.
explanation: Live talk is good for reaching agreement but leaves nothing to reread. Mixing channels (facts in writing, discussion live, recap in writing) locks in the shared understanding; another call still leaves no record.
