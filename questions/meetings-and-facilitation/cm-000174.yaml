topic: RACI matrix
topic_type: Technique
true_statement: If a RACI grid marks engineering, marketing and support all as A for release notes, name one of them as the single Accountable approver and move the others to Consulted or Informed.
false_statement: If a RACI grid marks engineering, marketing and support all as A for release notes, keep all three as Accountable so each function has an equal say in approval.
explanation: Shared accountability recreates the circular edits the grid was meant to end; the core rule is one A per row. This rests on practitioner guidance rather than tested evidence, but it is the rule all the guides agree on.
