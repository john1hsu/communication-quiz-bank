id: cm-000214
area: foundations
kind: evidence
topic: Common ground and grounding theory
topic_type: Theory
true_statement: In Keysar and colleagues' 2000 eye-tracking experiments, listeners first considered objects only they could see and used shared knowledge to correct themselves afterwards.
false_statement: In Keysar and colleagues' 2000 eye-tracking experiments, listeners restricted their search from the start to objects they knew the speaker could also see.
explanation: This egocentric heuristic challenges the idea that people consult common ground automatically. Grounding as a joint process is well supported, but moment to moment we start from our own view.
