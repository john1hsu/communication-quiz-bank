true_statement: In experiments reported in 2005, email readers identified whether statements were sarcastic or serious only about 56% of the time, though senders expected about 78%.
false_statement: In experiments reported in 2005, email readers identified whether statements were sarcastic or serious about 78% of the time, slightly beating the 56% senders expected.
explanation: Kruger, Epley and colleagues found email readers barely beat chance while senders were confident their tone would land; voice listeners did much better. Text strips out tone, and senders rarely notice.
