id: cm-000259
area: executive-and-client-communication
kind: practice
topic: Executive briefing
topic_type: Context
true_statement: When an executive interrupts your briefing with a question, answer it before moving on, or say where in the brief you will cover it and then make sure you do.
false_statement: When an executive interrupts your briefing with a question, note it and hold every question until the end, so you finish your planned points before the slot runs out.
explanation: Senior listeners often interrupt, and briefing courses say to deal with the question now or name exactly when you will, then follow through. Parking every question ignores what the leader needs to know; this is practitioner advice rather than a tested finding.
