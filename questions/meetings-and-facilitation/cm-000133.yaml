topic: Meeting agendas
topic_type: Technique
true_statement: 'A team lead''s invite for a 45-minute meeting reads: "Agenda: 1. Office move update 2. Desk allocation 3. AOB." Those topic labels give the group no finish line for any item.'
false_statement: 'A team lead''s invite for a 45-minute meeting reads: "Agenda: 1. Office move update 2. Desk allocation 3. AOB." That is a well-designed agenda, since every item names an area to cover.'
explanation: A bare noun doesn't say what counts as done or whether people are deciding or listening. "(Decide, 15 min) Which two weeks in March should we move?" gives a question, a purpose and a time box.
