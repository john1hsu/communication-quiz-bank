kind: practice
topic: Setting reply-time expectations
topic_type: Technique
true_statement: When a request has a real deadline, put the reply-by time and its reason in the subject line or opening lines, as in "[Action by Thu 3pm] Q3 figures for the board pack."
false_statement: When a request has a real deadline, give the context first and put the reply-by time and its reason in the closing line, so the reader understands why before seeing when.
explanation: A deadline left at the end of a long message makes the reader dig or guess, a common mistake. Stating it early, with the reason, lets them plan straight away; the context can follow.
