id: cm-000433
area: digital-and-async-communication
kind: scenario
topic: Emoji and tone in text
topic_type: Technique
true_statement: Writing a first email to a client's procurement lead she has never met, an account manager closes with "Looking forward to working together :)". In formal first contacts like this, smileys tend to lower how competent the sender seems.
false_statement: Writing a first email to a client's procurement lead she has never met, an account manager closes with "Looking forward to working together :)". In formal first contacts like this, smileys tend to raise warmth with no cost to perceived competence.
explanation: Glikson and colleagues found smileys in a work email to an unknown contact lowered perceived competence, and recipients shared less in reply. The warmth-without-cost result held only in informal settings.
