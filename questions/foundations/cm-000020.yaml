topic: Audience analysis
topic_type: Technique
true_statement: When one document must serve both executives and technical reviewers, give each group its own clearly labelled section.
false_statement: When one document must serve both executives and technical reviewers, blend both groups' material into every paragraph so neither feels left out.
explanation: Mixing material for different readers confuses everyone. Separate, labelled sections let the primary reader get what they need up front while technical readers find the detail they want.
