true_statement: In a one-on-one a tester says the sprint scope keeps changing. Her lead replies, "So the mid-sprint changes leave you rushed and worried about quality, but the client already agreed, so we can't move it." The restatement was a lead-in to rebuttal.
false_statement: In a one-on-one a tester says the sprint scope keeps changing. Her lead replies, "So the mid-sprint changes leave you rushed and worried about quality, but the client already agreed, so we can't move it." That is paraphrasing done well.
explanation: 'The "but" straight after the restatement, with no check question, gives it away: the paraphrase set up an argument. Done well, it ends with "Have I got that right?" and holds the lead''s own view until she confirms.'
