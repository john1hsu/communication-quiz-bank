topic: Curse of knowledge
topic_type: Barrier
true_statement: An engineer rereads her handover note, judges it perfectly clear and sends it; the new hire replies asking what "the Q-pipeline" is and where to start. Her self-check failed because of the curse of knowledge.
false_statement: An engineer rereads her handover note, judges it perfectly clear and sends it; the new hire replies asking what "the Q-pipeline" is and where to start. Her self-check failed because of information overload.
explanation: The tell is internal shorthand plus a clarity check done by rereading it herself, the very judgment the curse of knowledge distorts. The note isn't too long; it is missing background she can no longer imagine lacking.
