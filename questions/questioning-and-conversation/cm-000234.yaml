topic: Face-to-face conversation
topic_type: Channel
true_statement: When you need a colleague in another team to give you two days of data work, ask in person or in a short meeting rather than relying on a well-worded email you assume will work as well.
false_statement: When you need a colleague in another team to give you two days of data work, rely on a well-worded email, which works about as well as asking in person and saves their time.
explanation: In-person requests drew far more yeses than the same words by email, apparently through trust and empathy. Email asks from a stranger look more suspicious than the person standing in front of you.
