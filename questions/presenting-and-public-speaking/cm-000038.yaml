id: cm-000038
area: presenting-and-public-speaking
kind: practice
topic: Anxiety reappraisal
topic_type: Technique
true_statement: Use anxiety reappraisal in the final minutes before a talk as an add-on to rehearsal, not as a substitute for knowing your material.
false_statement: Use anxiety reappraisal in place of rehearsal when time is short, since relabelling nerves as excitement makes up for thin preparation.
explanation: No study tested reappraisal instead of preparation; it changes how the nerves feel, not whether you know the content. Rehearse first, then use the reframe just before you start.
