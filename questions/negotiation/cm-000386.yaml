true_statement: Hart, Bear and Ren (2024) found job candidates overestimate the chance that negotiating will make the employer withdraw the offer, partly because they see the negotiation as zero-sum.
false_statement: Hart, Bear and Ren (2024) found job candidates underestimate the chance that negotiating will make the employer withdraw the offer, partly because they see the negotiation as joint problem-solving.
explanation: 'The finding runs the other way: fear is inflated, driven by zero-sum framing and feeling powerless, which is why many candidates never ask. Treating the talk as joint problem-solving is the remedy the article suggests, not the cause of the error.'
