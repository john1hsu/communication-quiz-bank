topic: Grice's cooperative principle
topic_type: Principle
true_statement: 'Grice''s cooperative principle does not require being polite or agreeable: a curt, even evasive reply can still be cooperative in his minimal, rational sense.'
false_statement: Grice's cooperative principle requires being polite and agreeable, so a curt or evasive reply breaks it and stops listeners inferring meaning.
explanation: Reading cooperation as niceness is the misreading Davies calls cooperation drift. Grice described the expectations listeners use to work out meaning, which is why even a terse reply carries implications.
