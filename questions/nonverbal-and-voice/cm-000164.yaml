kind: scenario
topic: Gaze and eye contact
topic_type: Skill
true_statement: Presenting a contested budget change, a project lead locks eyes with the most doubtful manager on every point, and the manager grows more resistant. Pressing gaze on a sceptic like that can backfire.
false_statement: Presenting a contested budget change, a project lead locks eyes with the most doubtful manager on every point, and the manager grows more resistant. Pressing gaze on a sceptic like that is what makes a speaker persuasive.
explanation: Chen and colleagues found listeners who already disagreed were persuaded less the more they watched the speaker's eyes. Spread your gaze around the group, ask the doubter for their concern and watch them while they answer.
