true_statement: 'With 22% of migrated records failing validation, a lead''s report reads: "Status: GREEN. Some data-quality items being worked through; we remain confident about the timeline." That is a watermelon report, green outside and red inside.'
false_statement: 'With 22% of migrated records failing validation, a lead''s report reads: "Status: GREEN. Some data-quality items being worked through; we remain confident about the timeline." That is the deaf effect, executives ignoring a warning.'
explanation: The rating stays green while the real problem hides in hedged phrases, so the author is softening bad news. The deaf effect is on the receiving side, when leaders ignore warnings that were actually sent.
