true_statement: Sanchez-Burks and colleagues found Americans became less indirect at work than in social settings, while East Asian participants did not shift that way.
false_statement: Sanchez-Burks and colleagues found East Asian participants became less indirect at work than in social settings, while Americans did not shift that way.
explanation: The work-versus-social drop in indirectness appeared for Americans, not for Korean and Chinese participants, suggesting a cultural schema switched on by the workplace rather than a fixed national trait.
