true_statement: 'Clark and Fox Tree argued that "uh" and "um" are words speakers choose to signal a delay: "uh" announces a short one and "um" a longer one.'
false_statement: 'Clark and Fox Tree argued that "uh" and "um" are words speakers choose to signal a delay: "um" announces a short one and "uh" a longer one.'
explanation: In their corpus, pauses followed "um" far more often than "uh" and ran longer. Seeing fillers as planning signals, not mere noise, is why their work challenges the zero-filler goal.
