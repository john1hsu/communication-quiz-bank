id: cm-000192
area: barriers-and-psychology
kind: practice
topic: Anchoring and adjustment
topic_type: Phenomenon
true_statement: Before you accept or counter a vendor's opening price, list reasons that figure could be wrong, since considering the opposite weakens an anchor's pull, even for experts.
false_statement: Before you accept or counter a vendor's opening price, list reasons that figure is reasonable, so your counter stays close enough to it to seem credible.
explanation: Mussweiler, Strack and Pfeiffer found that arguing against the anchor reduced its influence for students and experts alike. Building the case for the number does the opposite, keeping more anchor-consistent reasons in mind.
