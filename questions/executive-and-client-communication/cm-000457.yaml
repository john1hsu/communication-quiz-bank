topic: Escalating a problem
topic_type: Technique
true_statement: In Park, Im and Keil's 2008 lab experiment, time urgency indirectly raised people's willingness to report project bad news, so stressing how narrow the window to fix a problem is can prompt earlier escalation.
false_statement: In Park, Im and Keil's 2008 lab experiment, time urgency indirectly lowered people's willingness to report project bad news, so stressing how narrow the window to fix a problem tends to delay escalation.
explanation: The study found urgency pushed reporting up, not down, which is why managers are advised to stress the shrinking window to fix a problem. It is one lab experiment on the mum effect; the escalation practices themselves remain untested practitioner advice.
