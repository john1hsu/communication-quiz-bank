true_statement: To gauge how your calls with a partner office are going, ask a colleague from that office how your approach lands, rather than relying on your own sense of how well you adapted.
false_statement: To gauge how your calls with a partner office are going, rate your own adaptability on a self-assessment questionnaire, rather than asking a colleague from that office how you come across.
explanation: Self-report shows only half the picture, and tested abilities often diverge from actual behaviour, so Deardorff recommends getting the other side's view of how your conduct landed. A self-rating alone can miss exactly the misreadings that matter.
