true_statement: 'A director keeps a job candidate waiting twenty minutes past the slot, then ends the interview early to take another call. The candidate reads it as a sign of low priority: a message sent through chronemics, the nonverbal code of time.'
false_statement: 'A director keeps a job candidate waiting twenty minutes past the slot, then ends the interview early to take another call. The candidate reads it as a sign of low priority: a message sent through proxemics, the nonverbal code of time.'
explanation: Lateness and cutting a meeting short are uses of time, which is chronemics. Proxemics is the code of space, such as how close people stand, so it doesn't fit an exchange that turns on waiting and duration.
