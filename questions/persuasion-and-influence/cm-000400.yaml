true_statement: 'Pitching a shared on-call rota, a team lead tells the directors: "Picture a quarter where nobody gets paged three nights running and incidents still close within an hour." In Monroe''s sequence, that is the visualization step.'
false_statement: 'Pitching a shared on-call rota, a team lead tells the directors: "Picture a quarter where nobody gets paged three nights running and incidents still close within an hour." In Monroe''s sequence, that is the satisfaction step.'
explanation: She is painting the concrete future once the solution is in place, which is visualization. Satisfaction would be explaining the rota itself, showing it works and answering the strongest objection.
