topic: George Loewenstein
topic_type: Person
true_statement: To open a training talk on a new pricing model, applying Loewenstein's information-gap idea, start with the puzzle the sales team actually has, such as why two similar customers got different quotes, then walk through the answer.
false_statement: To open a training talk on a new pricing model, applying Loewenstein's information-gap idea, front-load every detail of the model first, then invite the team's questions about specific quotes at the end.
explanation: Curiosity grows when people notice a gap between what they know and want to know, and curious learners remember answers better. A curiosity opener suits talks where attention must be earned; a busy reader of a decision email still needs the answer first.
