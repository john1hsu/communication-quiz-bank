true_statement: The popular line that two people do over 60% of the talking in a six-person meeting is offered by Leigh Thompson without a named study, so treat it as an illustration, not a measured norm.
false_statement: The popular line that two people do over 60% of the talking in a six-person meeting comes from Woolley and colleagues' 2010 studies, so treat it as a measured norm.
explanation: Kellogg's page presents the figure with no study behind it. Woolley's 2010 work was about turn-taking equality and a collective intelligence factor, not this airtime statistic.
