topic: Organizational communication
topic_type: Field
true_statement: 'An operations manager announces a new shift system by memo alone and then meets confusion and pushback. The gap is in the system: no explanation of why, no route for questions to flow back up, and no conversation to make sense of it together.'
false_statement: An operations manager announces a new shift system by memo alone and then meets confusion and pushback. The gap is a badly drafted memo, a one-person writing problem that clearer wording would solve.
explanation: Organizational communication looks at how information moves, not only at one message. The memo lacked meaning-making and an upward channel, so a follow-up conversation would help more than a sharper rewrite.
