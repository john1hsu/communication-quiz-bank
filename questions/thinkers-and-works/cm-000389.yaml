true_statement: Weger and colleagues trace active listening to Carl Rogers's 1951 account of empathic listening in therapy, and credit Thomas Gordon with turning it into a teachable method.
false_statement: Weger and colleagues trace active listening to Thomas Gordon's 1951 account of empathic listening in therapy, and credit Carl Rogers with turning it into a teachable method.
explanation: Rogers supplied the therapeutic idea of empathic listening; Gordon later packaged it as a method people could be trained in. The false version swaps their roles.
