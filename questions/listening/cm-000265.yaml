true_statement: If picturing a rival team's motives before a budget meeting leaves you expecting them to grab all they can, check that expectation against what they have actually done before acting on it.
false_statement: If picturing a rival team's motives before a budget meeting leaves you expecting them to grab all they can, move first and claim your share before they can claim theirs.
explanation: 'Imagining a counterpart can tip into cynicism: in experiments on splitting scarce resources, people who expected others to be selfish took more themselves. Test the suspicion against evidence instead of acting on it pre-emptively.'
