true_statement: The Army pamphlet's clarity index adds average sentence length to the percentage of words of three or more syllables, with a target of about 30.
false_statement: The Army pamphlet's clarity index adds average sentence length to the percentage of words of three or more syllables, with a target of below 20.
explanation: About 30 was the aim; scores under 20 were called abrupt and over 40 hard to read. It is a rule of thumb that counts length, not whether readers understand.
