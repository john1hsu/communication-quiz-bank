true_statement: In a 2008 survey of 220 US employees, their rating of the supervisor's communicator competence explained about 68% of the variance in their communication satisfaction.
false_statement: In a 2008 survey of 220 US employees, their rating of the supervisor's communicator competence explained about 18% of the variance in their communication satisfaction.
explanation: Madlock found supervisor competence accounted for roughly 68% of communication satisfaction and about 18% of job satisfaction; the false version borrows the job-satisfaction figure. The study is cross-sectional, so it shows association, not cause.
