id: cm-000104
area: barriers-and-psychology
kind: practice
topic: Self-distancing strategies
topic_type: Technique
true_statement: Use distanced self-talk to steady yourself before a tense meeting, but switch back to "I" when you make a personal commitment, such as "I will raise the risk at Thursday's review."
false_statement: Use distanced self-talk to steady yourself before a tense meeting, and keep using your own name even when you make a personal commitment, such as "Sam will raise the risk at Thursday's review."
explanation: Seeing yourself from outside may weaken identification with your future self, so researchers suggest the first person for commitments. Distancing is for appraising the moment, not for owning the promise.
