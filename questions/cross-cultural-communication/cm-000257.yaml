topic: Hofstede's dimensions of national culture
topic_type: Theory
true_statement: Hofstede's first four dimensions came from averaging, by country, an employee opinion survey he ran across IBM's national subsidiaries, published in Culture's Consequences in 1980.
false_statement: Hofstede's first four dimensions came from averaging, by country, World Values Survey answers from national population samples, published in Culture's Consequences in 1980.
explanation: The original data were IBM staff questionnaires about pay, conditions and bosses; World Values Survey data came in only later, through Michael Minkov's work on the sixth dimension. Critics note that one company's employees may not typify a nation.
