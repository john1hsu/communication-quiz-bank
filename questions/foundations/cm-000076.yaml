area: foundations
kind: scenario
topic: Rapport
topic_type: Concept
true_statement: Before a pricing call, a sales lead plans to build rapport by copying the client's posture and gestures. That treats a sign of being in sync as a lever, which the original account of rapport does not support.
false_statement: Before a pricing call, a sales lead plans to build rapport by copying the client's posture and gestures. That is the core rapport-building move the research recommends most often.
explanation: Mirroring emerges once people are coordinated; it is not a technique to perform. The research most often builds rapport through active listening, personal interest and self-disclosure, with body cues in only about a tenth of studies.
