topic: Hattie and Timperley's feedback model
topic_type: Framework
true_statement: When a report's draft misses the mark, start by confirming the goal you both hold for it, then compare the draft with that goal and name the next step.
false_statement: When a report's draft misses the mark, start by listing everything that's off, then name the next step, and agree what the goal was only at the end.
explanation: The model's order is where am I going, how am I going, where to next. Comments help only when the person knows the target, and missing goals are a common reason feedback fails.
