id: cm-000546
area: difficult-conversations-and-conflict
kind: practice
topic: Nonviolent Communication
topic_type: Framework
true_statement: Before raising late plan changes with a colleague, name your need, such as being able to stand behind what the client sees, separately from the one fix you prefer, so other solutions stay open.
false_statement: Before raising late plan changes with a colleague, state the one fix you prefer as your need, so the colleague knows exactly what would satisfy you and the talk stays short.
explanation: NVC keeps a need free of any particular person or action; folding your preferred strategy into the need closes off other ways to meet it. Name the value first, then make one concrete request.
