topic: Delivering bad news
topic_type: Context
true_statement: A team lead learns on Monday that a report's promotion went to someone else, and keeps postponing the talk all week because she doesn't want to upset him. That is the MUM effect, and the delay lets rumour fill the gap.
false_statement: A team lead learns on Monday that a report's promotion went to someone else, and keeps postponing the talk all week because she doesn't want to upset him. That is a sound instinct, since waiting for a better moment softens the blow.
explanation: The MUM effect is the reluctance to pass on unwelcome news, and its strongest driver was fear of upsetting the recipient, so delay feels kind. Set yourself a deadline and tell him plainly and early.
