kind: practice
topic: Describe-analyze-evaluate
topic_type: Technique
true_statement: If a newly transferred engineer stays silent in design reviews and emails good concerns afterwards, name that pattern and ask how disagreements were raised on teams they've worked on.
false_statement: If a newly transferred engineer stays silent in design reviews and emails good concerns afterwards, tell them to say it in the room, since emailing later looks like going around the team.
explanation: The better reply leads with the observable pattern, allows several explanations and checks before judging. The worse one presents an evaluation, going around the team, as fact, when the engineer may follow a different norm.
