true_statement: In Gilovich, Savitsky and Medvec's 1998 lying game, liars predicted about 49% of their group would catch them, but only about 26% did, roughly chance.
false_statement: In Gilovich, Savitsky and Medvec's 1998 lying game, liars predicted about 26% of their group would catch them, but about 49% did, well above chance.
explanation: Liars roughly doubled the share of the group they expected to see through them; actual detection sat near chance. The swapped version reverses the bias the study was named for.
