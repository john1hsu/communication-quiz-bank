id: cm-000331
area: writing
kind: practice
topic: Paramedic method for revising prose
topic_type: Technique
true_statement: 'To revise "There was a discussion of the pricing options by the sales team," turn the buried action into a verb with its doer as subject: "The sales team discussed the pricing options."'
false_statement: 'To revise "There was a discussion of the pricing options by the sales team," move the doer to the front but keep the noun: "The sales team had a discussion of the pricing options."'
explanation: The action is hiding in the noun "discussion"; the method's key step is to make it a simple verb with the actor as subject. Moving the team to the front but keeping "had a discussion of" leaves the nominalisation and its extra preposition.
