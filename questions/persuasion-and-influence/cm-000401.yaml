id: cm-000401
area: persuasion-and-influence
kind: practice
topic: Monroe's motivated sequence
topic_type: Framework
true_statement: Proposing a pilot to senior leaders who expect the conclusion first, state your ask at the start and use Monroe's need, solution and visualization steps as the body that supports it.
false_statement: Proposing a pilot to senior leaders who expect the conclusion first, keep Monroe's canonical order and hold the ask for the close, since that order is what makes the sequence persuasive.
explanation: For answer-first readers a solution held back to the end can read as stalling, and the one controlled test found the canonical order is not the active ingredient. The steps still work as a checklist of what to cover.
