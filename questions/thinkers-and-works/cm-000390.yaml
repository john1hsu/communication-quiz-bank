topic: The Relative Effectiveness of Active Listening in Initial Interactions
topic_type: Study
true_statement: One limit of Weger and colleagues' 2014 experiment is that the confederates who used active listening received far more training than the confederates in the other conditions.
false_statement: One limit of Weger and colleagues' 2014 experiment is that the confederates who gave advice received far more training than the confederates using active listening.
explanation: The active-listening confederates were trained much longer, which could favour that condition. Along with small effects, a student sample and no direct replication, it is why the result is rated mixed.
