topic: Zone of possible agreement
topic_type: Concept
true_statement: In an offer call, a candidate's walk-away point is a $70,000 salary and the employer's ceiling is $65,000. There is no zone of possible agreement on salary, so both should turn to their alternatives instead of haggling on.
false_statement: In an offer call, a candidate's walk-away point is a $70,000 salary and the employer's ceiling is $65,000. The zone of possible agreement runs from $65,000 to $70,000, so they should settle in the middle.
explanation: A ZOPA exists only where the two reservation points overlap. The candidate's lowest acceptable figure sits above the employer's highest, so any number between them is worse than walking away for one side.
