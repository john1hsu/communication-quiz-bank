topic: Workplace meetings
topic_type: Context
true_statement: When a weekly team meeting is mostly people reading status aloud, move the updates to a written post the day before and spend the live time only on the items that need a decision.
false_statement: When a weekly team meeting is mostly people reading status aloud, keep the round of updates but cap each speaker at two minutes so the meeting finishes on time.
explanation: Updates that need no discussion belong in an asynchronous channel, which frees the live minutes for the problem-solving and action-planning talk linked to better outcomes. Time-boxing the status round still spends everyone's time hearing updates nobody needed live.
