kind: scenario
topic: Anchoring and adjustment
topic_type: Phenomenon
true_statement: A team lead opens a planning meeting with, "Marketing thinks the launch needs about four weeks; does that work for engineering?" Saying that figure first is likely to anchor every estimate that follows.
false_statement: A team lead opens a planning meeting with, "Marketing thinks the launch needs about four weeks; does that work for engineering?" Saying that figure first gives a neutral reference that makes the estimates more accurate.
explanation: People adjust away from the first number they hear, but usually not far enough. Asking each team to send its own estimate before any figure is spoken keeps one early voice from framing the room.
