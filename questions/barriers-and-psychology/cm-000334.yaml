topic: Information overload
topic_type: Barrier
true_statement: In the inverted-U model of information overload, decision quality rises as useful information is added, peaks, then falls as still more arrives.
false_statement: In the inverted-U model of information overload, decision quality rises as useful information is added, then levels off at a plateau however much more arrives.
explanation: The model's warning is that past a peak, extra information makes decisions worse, not merely no better; overload begins where that decline starts. A plateau would make surplus information harmless. Whether the curve holds exactly is still debated.
