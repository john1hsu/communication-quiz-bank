topic: Culture assimilator
topic_type: Technique
true_statement: The culture assimilator came out of 1960s work by Fred Fiedler, Harry Triandis and colleagues, and was first tested with US military, Peace Corps and adviser groups.
false_statement: The culture assimilator came out of 1990s work by Dharm Bhawuk and colleagues, and was first tested with US business students preparing for exchange programmes.
explanation: Fiedler and Triandis developed the method at Illinois and Washington in the 1960s. Bhawuk came later and built a theory-based version organised around individualism and collectivism.
