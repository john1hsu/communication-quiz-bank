true_statement: In Sprecher and colleagues' 2013 experiment, stranger pairs who alternated between sharing and listening liked each other more than pairs who did their sharing in separate one-way blocks.
false_statement: In Sprecher and colleagues' 2013 experiment, stranger pairs who did their sharing in separate one-way blocks liked each other more than pairs who alternated between sharing and listening.
explanation: Alternating turns produced more liking, closeness and enjoyment, likely because partners could respond to each other and set the depth together. These were lab chats between students, so transfer to work is plausible rather than proven.
