true_statement: A 2016 systematic review of six randomised trials found evidence summaries probably easier to understand than full reviews, but their effect on whether decision makers actually used the evidence was unclear.
false_statement: A 2016 systematic review of six randomised trials found evidence summaries probably easier to understand than full reviews, and found they clearly increased how often decision makers used the evidence.
explanation: Petkovic and colleagues' review supports the comprehension benefit of summary-first formats, not a proven effect on decisions. The trials were also in health policy, so the transfer to ordinary business reports is plausible but untested.
