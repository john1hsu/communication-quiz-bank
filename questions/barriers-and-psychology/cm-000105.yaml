true_statement: In 2016 spotlight-effect experiments, people imagining an embarrassing entrance in the first person guessed about 47-48% of the room would notice, versus about 27-30% with a third-person view.
false_statement: In 2016 spotlight-effect experiments, people imagining an embarrassing entrance in the first person guessed about 27-30% of the room would notice, versus about 47-48% with a third-person view.
explanation: The observer's vantage point brought estimates closer to the real noticing rate and cut embarrassment. The samples were small and from one university, so treat it as suggestive.
