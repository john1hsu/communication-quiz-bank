true_statement: To flag a vendor delay, write "The API will arrive two weeks late; please choose by Thursday between moving launch to 14 March or cutting reporting" rather than "We may need to revisit the timeline given vendor developments."
false_statement: To flag a vendor delay, write "We may need to revisit the timeline given vendor developments" rather than "The API will arrive two weeks late; please choose by Thursday between moving launch to 14 March or cutting reporting."
explanation: Clarity means the reader can act on the first pass. The specific version names the fact, the decision and the deadline; the hedged one leaves the reader unsure whether anything has even changed.
