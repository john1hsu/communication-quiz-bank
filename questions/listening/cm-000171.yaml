true_statement: 'If you hold less power in a negotiation, don''t lean on long silences: in MIT studies of simulated job negotiations, pauses by the lower-status party brought no benefit and left them feeling worse.'
false_statement: 'If you hold less power in a negotiation, lean on long silences: in MIT studies of simulated job negotiations, pauses helped the lower-status party more than anyone and left them feeling better.'
explanation: Pauses of three seconds or more helped negotiators find deals good for both sides, but the benefit had a status boundary. Silence is room to think, not a lever, and it can backfire for the weaker party.
