true_statement: A new client contact asks why the change request stalled, and the lead replies, "Per prior thread, CR-2 blocked, see SOW." The reply is short, but it is not clear, because it drops context this reader doesn't have.
false_statement: A new client contact asks why the change request stalled, and the lead replies, "Per prior thread, CR-2 blocked, see SOW." The reply is clear, because brevity is what clarity asks for.
explanation: Brevity is only one part of Grice's Manner maxim, next to avoiding obscurity and ambiguity. Clarity is judged by the receiver, and a new contact can't decode a thread they never saw.
