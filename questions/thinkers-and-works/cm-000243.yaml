true_statement: 'Calling Tomlinson the inventor of email is contested: MIT''s CTSS MAIL already carried messages within one computer in 1965, and his step was mail between computers on a network.'
false_statement: 'Calling Tomlinson the inventor of email is contested: MIT''s CTSS MAIL already carried messages between computers in 1965, and his step was mail between users of one computer.'
explanation: CTSS MAIL worked only within one time-sharing machine; Tomlinson's 1971 work crossed the ARPANET. The defensible claim is that he built the first network email and its addressing convention.
