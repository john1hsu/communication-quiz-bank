true_statement: Stakeholder salience theory holds that the stakeholders who get most attention are those seen to hold power, legitimacy and urgency at the same time.
false_statement: Stakeholder salience theory holds that the stakeholders who get most attention are those seen to hold power, interest and influence at the same time.
explanation: Mitchell, Agle and Wood's three attributes are power, legitimacy and urgency, and all three are perceptions that shift over time. Power and interest are the axes of the separate grid.
