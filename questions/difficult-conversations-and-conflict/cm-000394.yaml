topic: Thomas-Kilmann Conflict Mode Instrument
topic_type: Framework
true_statement: 'For the third sprint running, a designer drops her own accessibility requirements as soon as the product manager pushes back, saying, "Fine, your call." In Thomas-Kilmann terms she is accommodating: unassertive and cooperative.'
false_statement: 'For the third sprint running, a designer drops her own accessibility requirements as soon as the product manager pushes back, saying, "Fine, your call." In Thomas-Kilmann terms she is avoiding: unassertive and uncooperative.'
explanation: She yields to the other person's concerns rather than sidestepping the issue, which is accommodating; done habitually it breeds resentment. Avoiding would mean postponing or dodging the disagreement, serving neither side's concerns.
