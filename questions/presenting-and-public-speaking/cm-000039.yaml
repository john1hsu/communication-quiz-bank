true_statement: A 2025 direct replication of Brooks's public-speaking study found that saying "I am excited" made people feel more excited, but observers rated their speeches no better.
false_statement: A 2025 direct replication of Brooks's public-speaking study found that saying "I am excited" left people feeling no more excited, yet observers rated their speeches better.
explanation: The replication kept the feeling shift but lost the performance gain on every observer rating, which is why the technique's evidence is contested. It is cheap to try, but don't count on it to impress the audience.
