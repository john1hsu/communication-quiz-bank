true_statement: In Keysar and Henly's 2002 study, when speakers believed a listener had understood an ambiguous sentence, the listener had in fact misunderstood it 46% of the time.
false_statement: In Keysar and Henly's 2002 study, when speakers believed a listener had understood an ambiguous sentence, the listener had in fact misunderstood it 6% of the time.
explanation: Nearly half of the cases speakers counted as understood were misunderstandings, which is why the advice is to expect miscommunication and check. A 6% miss rate would make the bias trivial.
