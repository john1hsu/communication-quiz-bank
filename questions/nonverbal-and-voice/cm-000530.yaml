true_statement: An HR lead proposes buying software that scores job candidates' emotions from their faces on recorded video interviews. That is the kind of high-stakes judgement the 2019 Barrett review warned against basing on facial analysis.
false_statement: An HR lead proposes buying software that scores job candidates' emotions from their faces on recorded video interviews. That is the kind of high-stakes judgement the 2019 Barrett review said facial analysis can now support.
explanation: The review found that a given expression maps to a given feeling too loosely and inconsistently to infer emotion from the face alone, and named hiring among the uses to avoid. Faces are cues to check, not verdicts to score.
