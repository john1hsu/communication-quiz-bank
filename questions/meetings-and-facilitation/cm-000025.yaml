topic: Psychological safety
topic_type: Phenomenon
true_statement: A project lead opens a status meeting with "We're on track, right?", gets nods, and hears about an integration slip afterwards in the corridor. That points to low psychological safety in the meeting.
false_statement: A project lead opens a status meeting with "We're on track, right?", gets nods, and hears about an integration slip afterwards in the corridor. That points to high psychological safety, since no one disagreed.
explanation: 'Real discussion happening in the hallway rather than the room is a classic low-safety sign: people judged that raising bad news in front of the group was risky. Silence in the meeting isn''t agreement.'
