true_statement: The 1986 Army pamphlet Effective Writing for Army Leaders told leaders to insist on the bottom line first, crediting the habit to business writers.
false_statement: The 1986 Army pamphlet Effective Writing for Army Leaders told leaders to insist on the bottom line first, presenting the habit as a new Army invention.
explanation: DA Pam 600-67 is the earliest official BLUF instruction found, but it explicitly says business writers already did this. Later Army texts gave the habit the BLUF name.
