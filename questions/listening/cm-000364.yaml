id: cm-000364
area: listening
kind: scenario
topic: Mirroring
topic_type: Technique
true_statement: On a client status call, the sponsor says the team is "mostly comfortable with the rollout plan." The project manager replies, "Mostly comfortable?" and then says nothing. That is mirroring.
false_statement: On a client status call, the sponsor says the team is "mostly comfortable with the rollout plan." The project manager replies, "Mostly comfortable?" and then says nothing. That is paraphrasing.
explanation: The manager repeats the sponsor's own hedge word as a curious question and then waits, which is the mirror. Paraphrasing would restate the meaning in his own words rather than echo hers.
