true_statement: In Daft and Lengel's theory, equivocality means competing interpretations of a situation, reduced only by exchanging views, while uncertainty means missing data, reduced by more information.
false_statement: In Daft and Lengel's theory, uncertainty means competing interpretations of a situation, reduced only by exchanging views, while equivocality means missing data, reduced by more information.
explanation: 'The distinction drives channel choice: a lean report can fill a data gap, but differing readings of a situation need a rich, two-way channel. A schedule update is uncertainty; a disputed reorganisation is equivocality.'
