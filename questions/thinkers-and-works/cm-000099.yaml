true_statement: In Lengel and Daft's 1984 study of 95 managers, the share choosing face-to-face rose from about 14% to 84% as an incident's interpretive load increased.
false_statement: In Lengel and Daft's 1984 study of 95 managers, the share choosing face-to-face fell from about 84% to 14% as an incident's interpretive load increased.
explanation: More ambiguous incidents pushed managers toward richer channels, while addressed written documents fell from about 62% to 11%. These were self-reported choices at one petrochemical company.
