topic: Credibility
topic_type: Concept
true_statement: Kumkale and Albarracín's 2004 meta-analysis found noncredible-source cues on their own produced almost no sleeper effect; reliable effects needed the discounting cue to follow strong arguments.
false_statement: Kumkale and Albarracín's 2004 meta-analysis found noncredible-source cues on their own produced a reliable sleeper effect, whatever the strength of the arguments.
explanation: The sleeper effect, a distrusted source gaining influence as people forget who said it, proved fragile, with only a small average rise over time. It showed up mainly with strong arguments, a late discounting cue and a motivated audience.
