id: cm-000107
area: difficult-conversations-and-conflict
kind: practice
topic: Difficult conversation
topic_type: Context
true_statement: When a colleague's remark in a meeting stung, keep their intent separate from its impact on you, rather than assuming they meant the harm you felt.
false_statement: When a colleague's remark in a meeting stung, treat the impact on you as evidence of what they meant, and say so plainly so the issue is named.
explanation: People tend to judge others by impact and themselves by intent, which keeps the "what happened" conversation stuck in blame. Describe the impact on you and ask what they intended.
