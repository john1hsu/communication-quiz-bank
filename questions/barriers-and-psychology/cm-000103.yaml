id: cm-000103
area: barriers-and-psychology
kind: scenario
topic: Self-distancing strategies
topic_type: Technique
true_statement: The most junior person in a cross-team review tells herself, "Priya, you spotted a real gap. Ask one short question about the churn assumption, then let the lead answer." That is distanced self-talk.
false_statement: The most junior person in a cross-team review tells herself, "Priya, you spotted a real gap. Ask one short question about the churn assumption, then let the lead answer." That is anxiety reappraisal.
explanation: The tell is coaching herself by name, as "you", which shifts her vantage point rather than relabelling her racing heart as excitement. Reappraisal changes what the arousal means; distancing changes who is looking.
