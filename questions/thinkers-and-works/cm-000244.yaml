true_statement: RFC 561, the 1973 header standard Tomlinson co-wrote, required From, Subject and Date fields at the top of every message.
false_statement: RFC 561, the 1973 header standard Tomlinson co-wrote, required From, To and CC fields at the top of every message.
explanation: Subject has been mandatory since the first header standard, which is why it is meant to tell readers what a message is about before they open it. To, CC and reply-to were added later by others.
