topic: 'The illusion of transparency: Biased assessments of others'' ability to read one''s emotional states'
topic_type: Study
true_statement: In the 1998 lying studies, silent observers who knew the same facts as each liar predicted far lower detection than the liars did, so the bias seems to come from experiencing the lie yourself.
false_statement: In the 1998 lying studies, silent observers who knew the same facts as each liar predicted detection as high as the liars did, so the bias seems to come from a general belief that lies are easy to spot.
explanation: The yoked observers guessed around a quarter would catch the lie, versus about 44% for the liars. Living the inner state, not general beliefs about lying, inflated the estimate.
