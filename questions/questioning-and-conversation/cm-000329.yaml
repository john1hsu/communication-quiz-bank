true_statement: In Yeomans and colleagues' 2020 studies, how receptive executives sounded to their discussion partners and to an algorithm did not match the executives' own sense of how receptive they had been.
false_statement: 'In Yeomans and colleagues'' 2020 studies, executives judged their own receptiveness accurately: their self-ratings closely matched how their discussion partners and an algorithm rated them.'
explanation: People are poor judges of how receptive they sound, which is why the article treats receptive language as something to practise deliberately, for example by drafting tough replies before sending. Feeling open-minded is no guarantee you come across that way.
