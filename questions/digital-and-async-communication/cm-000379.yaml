kind: scenario
topic: Video call communication
topic_type: Channel
true_statement: On a video call, a manager asks the team whether the new release date works, hears a beat of silence, says "OK, sounds like nobody's keen," and moves on. She has likely read link lag as disagreement and should have paused longer.
false_statement: On a video call, a manager asks the team whether the new release date works, hears a beat of silence, says "OK, sounds like nobody's keen," and moves on. She has read the silence correctly, since a pause after a question on video signals disagreement.
explanation: Small transmission delays make turn starts slower on video, so a short silence is often the link, not the team. The fix is to wait a little longer after a question before concluding anything or moving on.
