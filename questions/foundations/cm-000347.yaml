true_statement: Carl Hovland's Yale Communication and Attitude Change Program tested how source credibility, presentation order, one- versus two-sided messages and fear appeals change opinions.
false_statement: Floyd Allport's Yale Communication and Attitude Change Program tested how source credibility, presentation order, one- versus two-sided messages and fear appeals change opinions.
explanation: Hovland founded the Yale programme after running the US Army's wartime training-film experiments, making persuasion a core topic. Allport is credited with defining the field in 1924 as the experimental study of social behaviour.
