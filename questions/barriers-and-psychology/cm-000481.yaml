id: cm-000481
area: barriers-and-psychology
kind: evidence
topic: Hot-cold empathy gap
topic_type: Barrier
true_statement: In Nordgren's research, people who were not tired or in pain blamed a struggling person's poor performance on low motivation, and simply telling them to empathise did not close that gap.
false_statement: In Nordgren's research, people who were not tired or in pain blamed a struggling person's poor performance on low motivation, and simply telling them to empathise was enough to close that gap.
explanation: A bare instruction to empathise left the cold group's judgments unchanged, which is why the advice is to ask the other person and assume their experience is worse than it looks. Awareness is a prompt to check, not a cure.
