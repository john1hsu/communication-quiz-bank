true_statement: To get better at charismatic leadership tactics, rehearse on video with feedback and keep practising over several weeks, rather than reading up on the list the night before your talk.
false_statement: To get better at charismatic leadership tactics, read up on the list the night before your talk, rather than spending several weeks rehearsing on video with feedback.
explanation: The trained gains came from hours of filmed practice and coaching spread over weeks, and the nonverbal tactics in particular were learned by rehearsal, not reading. One-off cramming is a listed mistake.
