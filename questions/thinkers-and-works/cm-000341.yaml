true_statement: In Savitsky and Gilovich's public-speaking study, speakers told about the illusion of transparency overestimated their visible nervousness less and were rated by observers as more confident.
false_statement: In Savitsky and Gilovich's public-speaking study, speakers told about the illusion of transparency felt calmer, but observers rated them no more confident than other speakers.
explanation: Simply learning that the audience sees far less of your nerves than you feel changed how speakers came across, not just how they felt. That makes it a useful reminder to give yourself or an anxious colleague before a presentation.
