id: cm-000350
area: persuasion-and-influence
kind: practice
topic: Refutational two-sided messages
topic_type: Technique
true_statement: In a decision memo, put your answers to the reader's likeliest objections straight after your recommendation and main reason, where a sceptical reader is already raising them.
false_statement: In a decision memo, save your answers to the reader's likeliest objections for a closing section after the full case, so they don't distract from the recommendation.
explanation: Objections are most useful answered at the moment the reader thinks of them, which is usually right after the recommendation. Burying them at the end leaves the doubt hanging while the reader works through the rest of the case.
