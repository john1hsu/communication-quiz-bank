kind: scenario
topic: Self-disclosure reciprocity
topic_type: Technique
true_statement: In her first one-on-one with a new hire, a director confides, "I'm struggling to stay on top of this role right now." Sharing a current weakness from the senior seat risks costing her influence; a past struggle she has solved would be safer.
false_statement: In her first one-on-one with a new hire, a director confides, "I'm struggling to stay on top of this role right now." Sharing a current weakness from the senior seat is the safest way to build connection.
explanation: Gibson, Harari and Marr found higher-status people who disclosed a weakness were seen as lower in status, liked less and resisted more, while peers paid no penalty. Managers can still reciprocate with interests, work preferences or solved challenges.
