id: cm-000207
area: executive-and-client-communication
kind: practice
topic: Project status reporting
topic_type: Genre
true_statement: When a data problem puts go-live at risk, a status report should give the cause, what has already been done, two options with their costs, a recommendation and the date a decision is needed.
false_statement: When a data problem puts go-live at risk, a status report should note that the team is working through it and promise a fuller update in the next report, once the fix is clearer.
explanation: Framing the issue as a decision lets the sponsor act while action is still cheap. Deferring to the next report is the optimistic "fixed next month" habit that keeps troubled projects invisible until options have narrowed.
