true_statement: 'The summary page of a pricing review for the sales VP reads: "This study examined three years of deal data using regression analysis. Results indicate that discount depth is associated with churn." It is written like an academic abstract, not an executive summary.'
false_statement: 'The summary page of a pricing review for the sales VP reads: "This study examined three years of deal data using regression analysis. Results indicate that discount depth is associated with churn." It is a sound executive summary, since it covers purpose, method and results.'
explanation: Purpose, method and results for peers is the abstract's recipe. An executive summary leads with the recommendation, frames it in the reader's terms such as revenue or risk, gives the numbers and ends with the decision needed; this one has no ask at all.
