true_statement: Before a contract renewal, a buyer jots down what the supplier's account rep must hit this quarter, what her boss will ask her and which terms she can't move on. He is practising perspective-taking rather than empathy.
false_statement: Before a contract renewal, a buyer jots down what the supplier's account rep must hit this quarter, what her boss will ask her and which terms she can't move on. He is practising empathy rather than perspective-taking.
explanation: He is mapping her goals, pressures and reasoning, the cognitive route that defines perspective-taking. Empathy would mean connecting with her feelings, which in negotiation studies led people to give ground without finding creative trades.
