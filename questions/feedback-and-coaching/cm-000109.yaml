area: feedback-and-coaching
kind: scenario
topic: Feedforward
topic_type: Technique
true_statement: A project manager asks a peer for two ideas to keep kick-offs on time. The peer suggests sending the agenda a day early, and he replies, "We tried that; clients don't read it." That breaks feedforward's no-debate rule.
false_statement: A project manager asks a peer for two ideas to keep kick-offs on time. The peer suggests sending the agenda a day early, and he replies, "We tried that; clients don't read it." That is feedforward done well, testing each idea as it arrives.
explanation: In feedforward the only reply is "thank you"; you write the idea down and decide later whether to try it. Rebutting on the spot turns the exchange back into a debate and discourages further suggestions.
