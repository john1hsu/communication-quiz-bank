topic: BATNA
topic_type: Technique
true_statement: 'Before treating a competing quote as your BATNA, translate it into the same terms as the deal on the table: total cost, coverage, timing and switching effort.'
false_statement: Before treating a competing quote as your BATNA, compare its headline price with the deal on the table; coverage, timing and switching effort can be sorted out later.
explanation: An alternative judged on its headline number can look better than it is, as in the homeowner whose 30%-cheaper policy turned out worse on limits and exclusions. Only a like-for-like comparison tells you which option truly wins.
