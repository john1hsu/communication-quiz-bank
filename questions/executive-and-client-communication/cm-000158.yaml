topic: Risk numbers as natural frequencies
topic_type: Technique
true_statement: To brief a leader on auto-cancelling orders a fraud model flags, say "of about 518 flagged orders per 10,000, only 18 are fraud" rather than "it catches 90% of fraud with a 5% false-positive rate."
false_statement: To brief a leader on auto-cancelling orders a fraud model flags, say "it catches 90% of fraud with a 5% false-positive rate" rather than "of about 518 flagged orders per 10,000, only 18 are fraud."
explanation: Accuracy percentages invite the listener to ignore how rare fraud is. Counts from one group show the base rate and the false alarms, so the leader can see most flags are wrong before deciding.
