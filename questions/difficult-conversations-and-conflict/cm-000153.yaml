true_statement: A client tells an analyst he believes she deliberately hid a cost overrun; she didn't, and the records will show it. Because this is an accusation about integrity, a clear denial is likely to protect trust better than an apology.
false_statement: A client tells an analyst he believes she deliberately hid a cost overrun; she didn't, and the records will show it. Because apology beats denial after any trust violation, an apology is likely to protect trust better than a denial.
explanation: Kim and colleagues found apology helps after a lapse of skill but backfires on integrity accusations, because admitting fault confirms the dishonesty judgement. An apology later contradicted by the evidence would hurt trust further.
