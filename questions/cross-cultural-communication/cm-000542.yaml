topic: Politeness theory
topic_type: Theory
true_statement: Needing a vice president's sign-off on the mockups, a designer posts in a shared channel, "Still no sign-off on the mockups," and hopes he takes the hint. She has gone off record, a strategy a senior reader can simply miss.
false_statement: Needing a vice president's sign-off on the mockups, a designer posts in a shared channel, "Still no sign-off on the mockups," and hopes he takes the hint. She has used negative politeness, hedging her request to respect his autonomy.
explanation: A hint that never states the ask is the off-record strategy; negative politeness still makes the request, softened with hedges, questions or apologies ("Would you be able to sign off by Friday?"). With higher-status readers, make the actual ask recoverable.
