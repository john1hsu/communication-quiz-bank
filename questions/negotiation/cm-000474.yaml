id: cm-000474
area: negotiation
kind: practice
topic: Mythical fixed-pie bias
topic_type: Barrier
true_statement: Before renegotiating a support contract, picture having to explain to your manager how you reached the deal, not just what you won; accountability for the process weakened fixed-pie thinking in experiments.
false_statement: Before renegotiating a support contract, picture having to report to your manager only the final price you won; accountability for the bottom line weakened fixed-pie thinking in experiments.
explanation: De Dreu and colleagues found that being accountable for how you negotiated raised the motive to be accurate and led to more integrative deals. Focusing only on the number you extract keeps the deal framed as one pie to split.
