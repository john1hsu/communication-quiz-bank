id: cm-000092
area: presenting-and-public-speaking
kind: practice
topic: Public speaking anxiety
topic_type: Barrier
true_statement: To build tolerance for speaking, volunteer for short, low-stakes slots such as a two-minute stand-up update before taking on a long, high-stakes briefing.
false_statement: To build tolerance for speaking, take on the longest, highest-stakes briefing you can get first, so that every smaller talk afterwards feels easy.
explanation: The evidence comes mostly from cognitive and behavioural programmes that use graded exposure. Repeated small steps closer to the real setting build tolerance; jumping straight to the hardest case is not what those programmes do.
