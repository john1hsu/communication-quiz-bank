true_statement: 'Walther and Burgoon found time mattered more than medium: computer-mediated groups grew more positive over repeated exchanges, so digital working relationships develop more slowly rather than staying colder.'
false_statement: 'Walther and Burgoon found medium mattered more than time: computer-mediated groups stayed less positive however many exchanges they had, so digital working relationships stay colder rather than developing more slowly.'
explanation: 'This is the social information processing view: people carry relational meaning through wording, address and sign-offs, which takes longer in text. Their 1992 study found repeated contact closed much of the gap the cues-filtered-out view had predicted would persist.'
