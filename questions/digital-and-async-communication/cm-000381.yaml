true_statement: When Newman and Schwarz played identical talks at high or low sound quality, listeners rated the same researchers and their research less favourably when the audio was poor.
false_statement: When Newman and Schwarz played identical talks at high or low sound quality, listeners rated the researchers the same either way and judged only the recording itself as worse.
explanation: Poor audio leaked into judgments of the speaker and the content, not just the recording. That's why the advice is to fix sound before video, especially on pitches and interviews.
