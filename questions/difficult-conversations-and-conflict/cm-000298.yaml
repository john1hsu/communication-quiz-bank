id: cm-000298
area: difficult-conversations-and-conflict
kind: practice
topic: Role reversal
topic_type: Technique
true_statement: When preparing alone for a hard contract talk, write the other party's brief in their voice, argue it aloud, and note which of your own arguments would actually move them.
false_statement: When preparing alone for a hard contract talk, write out your own strongest arguments, argue them aloud, and rehearse rebuttals to the objections you expect.
explanation: Solo role reversal means arguing from the other side's chair, which shows how the facts look from there and which of your points survive. Rehearsing only your own case keeps you inside your own perspective.
