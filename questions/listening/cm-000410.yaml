id: cm-000410
area: listening
kind: practice
topic: Summarizing
topic_type: Technique
true_statement: When summarizing a colleague's concerns, keep your own view and proposed fix out of the summary, and raise them only once they have confirmed or corrected it.
false_statement: When summarizing a colleague's concerns, fold your own view and proposed fix into the summary, so they can confirm both your reading and your plan at once.
explanation: A summary is a clarifying move that tests understanding; adding your position turns the check into an argument or a proposal. Confirm their version first, then use it as the bridge to solutions.
