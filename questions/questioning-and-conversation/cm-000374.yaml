id: cm-000374
area: questioning-and-conversation
kind: practice
topic: Conversational turn-taking
topic_type: Phenomenon
true_statement: When you want others to come in during a meeting, end your turn with a clear question or a complete sentence, rather than trailing off or stacking extra clauses.
false_statement: When you want others to come in during a meeting, trail off or keep adding clauses, rather than ending your turn with a clear question or a complete sentence.
explanation: Listeners hand over the floor at recognisable end points of a turn. A clear question or finished sentence signals the floor is open, while trailing off or piling on clauses blurs or delays that point.
