true_statement: A 2015 meta-analysis found statistical evidence shifted beliefs and attitudes more than narratives did, while narratives did more to shift people's intentions to act.
false_statement: A 2015 meta-analysis found narratives shifted beliefs and attitudes more than statistical evidence did, while statistics did more to shift people's intentions to act.
explanation: Stories and numbers move different outcomes, which is why the advice is to pair them rather than pick one. Use the figures to establish what is true and the story to motivate action.
