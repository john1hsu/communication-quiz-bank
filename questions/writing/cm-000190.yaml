true_statement: Barbara Minto developed the pyramid principle while editing associates' reports at McKinsey, and published it as The Pyramid Principle in 1985.
false_statement: Barbara Minto developed the pyramid principle while editing associates' reports at McKinsey, and published it as The Pyramid Principle in 1963.
explanation: Minto joined McKinsey in 1963 and left in 1973; the book came out in 1985 after she had taught the method in courses across the firm. She later revised it as The Minto Pyramid Principle.
