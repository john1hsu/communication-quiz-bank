topic: Group decision making
topic_type: Context
true_statement: In Schulz-Hardt and colleagues' 2006 study, three-person groups that began by disagreeing found the hidden best option far more often, even when none of them had started out favouring it.
false_statement: In Schulz-Hardt and colleagues' 2006 study, three-person groups that began by disagreeing found the hidden best option far more often, but only when at least one of them had started out favouring it.
explanation: Prior dissent helped even when every member's first choice was wrong, because disagreement drives deeper discussion of the information. That is why collecting views independently first and valuing dissent beats smoothing it over.
