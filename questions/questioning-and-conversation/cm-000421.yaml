true_statement: In a one-on-one, after a report has listed three ways to clear her review backlog, her manager asks, "Which will you start with, and when shall we check how it went?" In GROW, that question opens the Will stage.
false_statement: In a one-on-one, after a report has listed three ways to clear her review backlog, her manager asks, "Which will you start with, and when shall we check how it went?" In GROW, that question opens the Options stage.
explanation: Options is where routes are generated; she has already listed three. Asking her to choose one, name a first step and set a review point is Will, or Way forward.
