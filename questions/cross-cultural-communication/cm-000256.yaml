topic: Hofstede's dimensions of national culture
topic_type: Theory
true_statement: If a junior analyst on a partner team never corrects the director in meetings, consider their occupation and seniority before their nationality as an explanation.
false_statement: If a junior analyst on a partner team never corrects the director in meetings, look up their country's power-distance score first, since nationality best explains power-distance values.
explanation: A meta-analysis found occupation grouped power-distance values far better than country did, so role and rank are the first place to look. A national score is at most a hypothesis to check by asking the team how it likes to disagree.
