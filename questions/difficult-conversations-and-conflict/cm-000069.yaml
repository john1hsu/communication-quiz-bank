true_statement: A 2015 meta-analysis of self-affirmation tests found a small effect on accepting threatening messages (d = 0.17) and a larger one on behaviour (d = 0.32).
false_statement: A 2015 meta-analysis of self-affirmation tests found a larger effect on accepting threatening messages (d = 0.32) and a small one on behaviour (d = 0.17).
explanation: The effect on behaviour was the larger of the two; acceptance moved only slightly. Most of these studies used health messages, so the workplace payoff is plausible rather than proven.
