true_statement: A 2025 meta-analysis of 90 negotiation studies found the size of the first offer correlated strongly with the final agreement value (r = .62).
false_statement: A 2025 meta-analysis of 90 negotiation studies found the size of the first offer correlated only weakly with the final agreement value (r = .16).
explanation: The pull of the opening number on the final deal was strong, which is why the effect is rated robust. The same analysis also found that very ambitious openings led to more impasses.
