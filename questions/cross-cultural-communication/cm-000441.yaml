true_statement: In Oetzel and Ting-Toomey's 2003 four-country survey, concern for one's own face predicted a dominating conflict style, while concern for the other person's face predicted avoiding and integrating.
false_statement: In Oetzel and Ting-Toomey's 2003 four-country survey, concern for the other person's face predicted a dominating conflict style, while concern for one's own face predicted avoiding and integrating.
explanation: Protecting your own image pushed people to dominate, while protecting the other's image went with avoiding or integrating. The data were self-reported by college students, so treat the link as a tendency, not a rule.
