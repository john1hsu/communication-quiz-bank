true_statement: A candidate with no data on a role's pay band asks the hiring manager what range the company had in mind before naming any number. Holding back fits first-offer guidance, because the other side knows the range better.
false_statement: A candidate with no data on a role's pay band asks the hiring manager what range the company had in mind before naming any number. That throws away the first-mover advantage, since opening first always pays.
explanation: 'The advantage depends on information: move first when you know the zone of agreement at least as well as the other side. Uninformed openers in Maaravi and Levy''s studies landed far off the market in both directions.'
