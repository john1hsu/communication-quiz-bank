true_statement: A designer emails a director with the subject "Quick question" and three paragraphs of project history before finally asking for sign-off on the mockups by Friday. The email buries its request.
false_statement: A designer emails a director with the subject "Quick question" and three paragraphs of project history before finally asking for sign-off on the mockups by Friday. The email is well built, giving context before the ask.
explanation: A vague subject and an ask hidden under background are two classic email pitfalls. A better version names the action in the subject and opens with the sign-off request and its Friday deadline.
