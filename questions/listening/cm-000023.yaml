area: listening
kind: practice
topic: Open-ended questions
topic_type: Technique
true_statement: When you need a firm answer on a known risk, such as whether a release will slip past the 30th, ask a direct, specific question rather than an open one.
false_statement: When you need a firm answer on a known risk, such as whether a release will slip past the 30th, ask a broad open question like "How's it going?"
explanation: Open questions are for exploring; commitments and specific facts call for closed, pointed questions. Very general questions invite "fine" and leave room to dodge.
