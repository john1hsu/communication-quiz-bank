id: cm-000125
area: digital-and-async-communication
kind: practice
topic: Camera-optional norm
topic_type: Technique
true_statement: When setting a camera-optional norm, tell newer colleagues directly, one-to-one, that turning the camera off will not count against them.
false_statement: When setting a camera-optional norm, let newer colleagues pick it up by watching what the rest of the team does, so it doesn't feel like special treatment.
explanation: In Shockley's experiment the fatigue cost of cameras-on was larger for newer employees, who feel most pressure to look attentive. Saying it to them directly removes the guesswork that watching others leaves.
