id: cm-000391
area: cross-cultural-communication
kind: scenario
topic: Culture assimilator
topic_type: Technique
true_statement: Drafting a culture assimilator episode for her team, a lead writes, "The supplier stayed quiet in the review because he was embarrassed about the delay." She has broken the rule to describe the scene and leave the reason out.
false_statement: Drafting a culture assimilator episode for her team, a lead writes, "The supplier stayed quiet in the review because he was embarrassed about the delay." She has broken the rule to validate each explanation with insiders.
explanation: Writing the cause into the scene hands learners the answer, so they never practise generating and testing explanations. Insider validation is a separate step that checks which offered explanation locals would accept; the problem here is the description itself.
