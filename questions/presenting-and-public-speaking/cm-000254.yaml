true_statement: The link between rehearsal and better-rated speeches comes mostly from correlational studies of university speech students, so part of it may reflect stronger students simply preparing more.
false_statement: The link between rehearsal and better-rated speeches comes mostly from randomized trials with working professionals, so more rehearsal has been shown to cause better talks at work.
explanation: 'The core studies surveyed or tracked students in speech courses and found that preparation went with higher ratings, but grade average also predicted performance. That is why rehearsal is rated mixed: a sound habit, with modest and context-dependent evidence.'
