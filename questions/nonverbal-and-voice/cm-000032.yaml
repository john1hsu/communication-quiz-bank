topic: Mehrabian's 7-38-55 rule
topic_type: Concept
true_statement: When praising a colleague, put your phone away and let your tone match your words, because when cues about feelings conflict, listeners tend to trust the tone and face.
false_statement: When praising a colleague, the exact words matter more than tone or attention, because when cues about feelings conflict, listeners tend to trust the words.
explanation: 'The part of Mehrabian''s finding that survives is narrow: with mixed emotional signals, people believe the nonverbal cue. Flat praise while checking a phone reads as insincere, however well worded.'
