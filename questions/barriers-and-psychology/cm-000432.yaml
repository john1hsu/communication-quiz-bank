area: barriers-and-psychology
kind: evidence
topic: Emotional contagion
topic_type: Phenomenon
true_statement: Hess and Fischer's 2013 review found people mimic the emotions of friends and allies far more than those of rivals, which undercuts the idea that emotional mimicry is an automatic motor copy.
false_statement: Hess and Fischer's 2013 review found people mimic the emotions of rivals as readily as those of friends and allies, which supports the idea that emotional mimicry is an automatic motor copy.
explanation: Mimicry depends on the relationship, which is why the mechanism is contested and the evidence rated mixed. In practice, enthusiasm may not spread to a sceptical or competing counterpart.
