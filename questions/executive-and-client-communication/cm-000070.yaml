topic: Managing up
topic_type: Skill
true_statement: Asked if the new date is realistic, an engineer who privately thinks it is impossible tells her manager, "Sure, we'll make it work," as she always does with bosses. That is the over-compliant reflex that distorts a boss relationship.
false_statement: Asked if the new date is realistic, an engineer who privately thinks it is impossible tells her manager, "Sure, we'll make it work," as she always does with bosses. That is managing up done well, adapting to the boss.
explanation: Swallowing disagreement is one of the authority reflexes Gabarro and Kotter warn about. Managing up rests on dependable candour, so she should flag the risk now, ideally with a proposed fix.
