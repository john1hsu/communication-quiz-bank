topic: Cultural intelligence
topic_type: Skill
true_statement: In Rockstuhl and Van Dyne's 2018 meta-analysis, cultural knowledge held by people low in metacognitive CQ was even negatively related to task performance.
false_statement: In Rockstuhl and Van Dyne's 2018 meta-analysis, cultural knowledge held by people low in motivational CQ was even negatively related to task performance.
explanation: Metacognitive CQ, the habit of checking and revising your interpretations, strengthened the payoff of the other capabilities; without it, knowing about cultures could backfire. Motivational CQ was linked mainly to adjustment, not to this moderating role. The evidence base is mixed and mostly self-report.
