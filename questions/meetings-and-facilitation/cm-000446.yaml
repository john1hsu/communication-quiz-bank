topic: Unequal participation
topic_type: Barrier
true_statement: In a 2020 study of leaderless groups, the time a member spent talking predicted whether others saw them as a leader, even with intelligence, personality and gender controlled for.
false_statement: In a 2020 study of leaderless groups, the time a member spent talking predicted whether others saw them as a leader, but only because the biggest talkers were also the most intelligent.
explanation: The effect held after controlling for intelligence, so airtime itself buys influence. That is how lopsided talk rewards whoever speaks first and longest, not whoever knows most.
