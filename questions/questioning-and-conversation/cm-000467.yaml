area: questioning-and-conversation
kind: scenario
topic: Follow-up questions
topic_type: Technique
true_statement: Opening a client call, the client asks a consultant, "How's your quarter been?" She answers briefly, then replies, "And how's yours been?" In Huang and colleagues' terms, that is a mirror question.
false_statement: Opening a client call, the client asks a consultant, "How's your quarter been?" She answers briefly, then replies, "And how's yours been?" In Huang and colleagues' terms, that is a follow-up question.
explanation: A mirror question bounces back the question just asked. A follow-up would build on something the client actually said, such as asking about a detail of their answer, which is the kind most tied to liking.
