true_statement: Linguist Geoffrey Pullum granted that The Elements of Style counsels moderation on the passive, but argued most of the sentences it offers as passives are not passives at all.
false_statement: Linguist Geoffrey Pullum argued that The Elements of Style bans the passive outright, though he granted that its example passive sentences are correctly identified.
explanation: 'Pullum''s complaint was about grammatical analysis: in the Strunk and White edition, three of the four example passives aren''t passives. The rule itself allows the passive when it''s convenient or necessary.'
