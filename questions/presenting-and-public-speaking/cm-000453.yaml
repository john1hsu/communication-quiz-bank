true_statement: If your draft talk runs over its slot when you estimate it at about 150 words a minute, cut text rather than plan to speak faster.
false_statement: If your draft talk runs over its slot when you estimate it at about 150 words a minute, plan to speak faster rather than cut text.
explanation: Rushing is one of the delivery problems listeners complain about most, and good speakers slow down for unfamiliar material and near the close. Trimming the script keeps a rate the room can follow.
