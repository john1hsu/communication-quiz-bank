id: cm-000431
area: barriers-and-psychology
kind: practice
topic: Emotional contagion
topic_type: Phenomenon
true_statement: Before a tense one-on-one, check and settle your own mood first, because your face, voice and posture carry it to the other person even when your words stay neutral.
false_statement: Before a tense one-on-one, check that your wording is neutral, because as long as your words stay neutral your mood stays with you rather than passing to the other person.
explanation: In Barsade's experiment the confederate changed only his nonverbal displays, yet the group's mood shifted. This is reasoned practice drawn from the mechanism rather than a tested protocol, but neutral words alone do not contain a mood.
