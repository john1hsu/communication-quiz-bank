topic: Mehrabian's 7-38-55 rule
topic_type: Concept
true_statement: A presentation coach tells a team their slide content barely matters because 93% of communication is nonverbal. That stretches Mehrabian's studies, which measured judgments of liking from conflicting cues in single-word tasks.
false_statement: A presentation coach tells a team their slide content barely matters because 93% of communication is nonverbal. That follows Mehrabian's studies, which measured how much meaning words carry in work briefings.
explanation: The 7-38-55 split came from two narrow 1967 lab studies of liking, with the verbal channel nearly empty by design. Mehrabian says it doesn't apply to communication in general; in briefings, words carry most of the information.
