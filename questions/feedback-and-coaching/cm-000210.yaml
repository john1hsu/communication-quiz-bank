id: cm-000210
area: feedback-and-coaching
kind: practice
topic: Feedback sandwich
topic_type: Technique
true_statement: If a report's work has three serious, recurring problems, hold a direct conversation about them rather than spreading them across a series of praise sandwiches.
false_statement: If a report's work has three serious, recurring problems, wrap each one in its own praise sandwich so every conversation stays positive and he doesn't get defensive.
explanation: A sandwich can carry at most one modest correction; serious or repeated issues need a fuller, direct talk. Routine cushioning also devalues praise, so people start bracing for the "but".
