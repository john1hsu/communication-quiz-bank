topic: The Effects of Feedback Interventions on Performance
topic_type: Study
true_statement: In Kluger and DeNisi's meta-analysis, feedback interventions paired with goal setting had stronger effects on performance, while those carrying praise had weaker ones.
false_statement: In Kluger and DeNisi's meta-analysis, feedback interventions carrying praise had stronger effects on performance, while those paired with goal setting had weaker ones.
explanation: Goals keep attention on the task, which strengthens feedback; praise pulls attention toward the self and dilutes it. So give feedback with a concrete target, such as two days instead of four next quarter.
