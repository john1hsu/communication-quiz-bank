true_statement: In a 2025 field experiment with U.S. tech job seekers, a short encouragement message raised the share who countered their offer to 61%, against 54% in the control group.
false_statement: In a 2025 field experiment with U.S. tech job seekers, a deep discount on paid negotiation coaching raised the share who countered their offer to 61%, against 54% in the control group.
explanation: Cullen, Pakzad-Hurson and Perez-Truglia found encouragement moved behaviour while cheap coaching did not change how many negotiated. That points to beliefs about risk, not missing skills, as the main barrier.
