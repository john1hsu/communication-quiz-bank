kind: scenario
topic: Praise and recognition
topic_type: Technique
true_statement: 'A manager messages an analyst: "Thanks for catching the duplicate invoices on Friday - the client got a clean report and renewed. Next time, though, loop me in sooner." Tacking the correction onto the thanks muddies the recognition.'
false_statement: 'A manager messages an analyst: "Thanks for catching the duplicate invoices on Friday - the client got a clean report and renewed. Next time, though, loop me in sooner." Adding the correction makes the recognition more useful.'
explanation: 'Recognition works best kept clean: no "but", correction or new request in the same message, or people learn to brace for the catch. Give the thanks on its own and raise the timing point separately.'
