id: cm-000050
area: barriers-and-psychology
kind: practice
topic: Illusion of transparency
topic_type: Barrier
true_statement: When a chat message depends on tone, such as a deadpan joke or mild annoyance, state the intent in words ("this is a joke", "I'm concerned about this date") rather than trusting tone to carry it.
false_statement: When a chat message depends on tone, such as a deadpan joke or mild annoyance, keep it short and trust a colleague who knows you well to read the tone correctly.
explanation: Email senders overestimate how well sarcasm, anger or humour come through, even with people who know them. Naming the intent removes the guesswork that text can't carry.
