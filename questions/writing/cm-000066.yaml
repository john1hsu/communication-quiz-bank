topic: Bottom line up front
topic_type: Technique
true_statement: 'Leading with the bottom line fits how people read: in Kieras''s 1979 experiments, readers usually built a passage''s main idea from its opening sentences.'
false_statement: 'Leading with the bottom line fits how people read: in Kieras''s 1979 experiments, readers usually built a passage''s main idea from its closing sentences.'
explanation: A theme sentence placed first shaped readers' summaries more than the same sentence mid-passage. BLUF itself remains practitioner advice, since no controlled study has compared message orders directly.
