true_statement: 'Working through D.A.E. after a tense call, a manager writes as step one: "She was rude to the client." That line is already an evaluation smuggled into the description.'
false_statement: 'Working through D.A.E. after a tense call, a manager writes as step one: "She was rude to the client." That line is a sound description, since it reports what happened on the call.'
explanation: '"Rude" is a judgement measured against the manager''s own norms. A description is what a camera would catch, such as "she ended the call without summarising next steps," which people who disagree could still accept.'
