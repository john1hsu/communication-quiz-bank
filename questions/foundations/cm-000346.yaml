true_statement: When the Open Science Collaboration repeated 100 psychology studies in 2015, only 36% of the replications produced significant results, against 97% of the originals.
false_statement: When the Open Science Collaboration repeated 100 psychology studies in 2015, 64% of the replications produced significant results, against 97% of the originals.
explanation: Barely a third of replications came out significant, with effects about half the original size. Before building a communication habit on a social-psychology finding, check whether it survived large replications.
