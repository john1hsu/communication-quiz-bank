topic: Feedback sandwich
topic_type: Technique
true_statement: In Parkes and colleagues' 2013 studies of medical students, sandwiched feedback changed how students felt about the feedback but not how they performed on their next piece of work.
false_statement: In Parkes and colleagues' 2013 studies of medical students, sandwiched feedback improved how students performed on their next piece of work but not how they felt about the feedback.
explanation: Students believed the sandwich helped, yet their later work showed no gain, which is why the technique is rated contested. It can reassure giver and receiver while leaving performance unchanged.
