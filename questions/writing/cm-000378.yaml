true_statement: In Jansen's experiments published in 2014, putting items in a bulleted list improved recall of those items but reduced recall of the text around the list.
false_statement: In Jansen's experiments published in 2014, putting items in a bulleted list improved recall of those items and also improved recall of the text around the list.
explanation: Bullets pull attention to what is inside them at the expense of the surrounding prose, so anything important left in the sentences around a list is more likely to be missed. The false version leaves out that cost.
