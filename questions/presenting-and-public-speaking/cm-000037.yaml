id: cm-000037
area: presenting-and-public-speaking
kind: scenario
topic: Anxiety reappraisal
topic_type: Technique
true_statement: Hands shaking before her first leadership briefing, an analyst tells herself, "My heart's racing because this matters; I'm excited to get the forecast approved." That is anxiety reappraisal.
false_statement: Hands shaking before her first leadership briefing, an analyst tells herself, "My heart's racing because this matters; I'm excited to get the forecast approved." That is a relaxation technique for lowering her arousal.
explanation: She accepts the arousal and relabels it as excitement aimed at an opportunity, rather than trying to calm down. Reappraisal changes what the jitters mean; it doesn't try to switch them off.
