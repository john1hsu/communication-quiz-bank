true_statement: Mapping an expense-tool rollout, an ops manager notes the payroll lead must sign off the export file but has little interest in the project. On the power-interest grid, that stakeholder should be kept satisfied.
false_statement: Mapping an expense-tool rollout, an ops manager notes the payroll lead must sign off the export file but has little interest in the project. On the power-interest grid, that stakeholder needs only to be kept informed.
explanation: 'Sign-off is power, so this is the high-power, lower-interest quadrant: a targeted briefing and timely sign-off, not just the go-live email. Keep informed is for those low on both power and interest.'
