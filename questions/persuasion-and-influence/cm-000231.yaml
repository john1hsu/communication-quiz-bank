id: cm-000231
area: persuasion-and-influence
kind: practice
topic: Elaboration likelihood model
topic_type: Theory
true_statement: For a busy steering committee that only needs to sign off, lead with a credible signal such as a respected peer team's pilot result, and keep the detailed analysis available rather than front and centre.
false_statement: For a busy steering committee that only needs to sign off, lead with the full detailed analysis and every argument, since detail persuades any audience whatever its time or interest.
explanation: The ELM says to build for the route an audience will actually take; detail a low-involvement audience won't read does little. The pilot result must be real, and the substance should stay available for anyone who wants to weigh it.
