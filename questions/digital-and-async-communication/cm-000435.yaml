true_statement: In a 2016 University of Minnesota study, readers disagreed about whether a single emoji's sentiment was positive, neutral or negative about a quarter of the time.
false_statement: In a 2016 University of Minnesota study, readers disagreed about whether a single emoji's sentiment was positive, neutral or negative about three-quarters of the time.
explanation: Disagreement came up in roughly one case in four, and grew when readers saw different platforms' renderings. That's why the advice is to pick one common, clearly positive emoji, if any.
