id: cm-000403
area: executive-and-client-communication
kind: scenario
topic: Executive presence
topic_type: Skill
true_statement: The CFO asks a programme manager whether the project will overrun. She lists every open risk, apologises twice and ends, "Honestly, it's hard to say." Her answer undercuts presence by showing hedging rather than a clear call under pressure.
false_statement: The CFO asks a programme manager whether the project will overrun. She lists every open risk, apologises twice and ends, "Honestly, it's hard to say." Her answer builds presence by showing the listen-to-learn style executives now prefer.
explanation: Confidence under pressure and decisiveness lead the gravitas pillar, and she offers neither. Listen-to-learn means asking and drawing others in, not withholding a judgement; a pause, her best estimate and the decision she needs would read far better.
