true_statement: Mullen, Johnson and Salas's 1991 meta-analysis found the idea losses of interacting brainstorming groups grew larger as the groups got bigger.
false_statement: Mullen, Johnson and Salas's 1991 meta-analysis found the idea losses of interacting brainstorming groups shrank as the groups got bigger.
explanation: Losses were larger in bigger groups, as well as with an authority figure present and with spoken rather than written ideas. That's why a large room should be split into small groups or asked to write.
