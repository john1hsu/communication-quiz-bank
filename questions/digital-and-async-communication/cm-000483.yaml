topic: Chat etiquette
topic_type: Technique
true_statement: When a chat thread about a release date has gone several rounds without agreement, move to a short call, then post the outcome back in the same thread.
false_statement: When a chat thread about a release date has gone several rounds without agreement, add an @channel alert so the whole team weighs in, then post the outcome back in the same thread.
explanation: Chat etiquette treats a few unresolved back-and-forths, or a topic turning sensitive, as the cue to talk live. Channel-wide alerts are for urgent items the team has agreed qualify, and widening an argument adds noise rather than agreement.
