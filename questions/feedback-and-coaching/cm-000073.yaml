true_statement: After a client workshop, a lead tells the presenter, "You're a natural presenter!" In Hattie and Timperley's terms that is self-level feedback, the kind that carries the least usable information.
false_statement: After a client workshop, a lead tells the presenter, "You're a natural presenter!" In Hattie and Timperley's terms that is process-level feedback, the kind with the most powerful effect.
explanation: It praises the person, not the work, so there is nothing to repeat. Process feedback would name what worked, such as opening with the client's own churn numbers before the recommendations.
