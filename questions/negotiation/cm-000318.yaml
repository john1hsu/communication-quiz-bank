id: cm-000318
area: negotiation
kind: scenario
topic: Interests vs. positions
topic_type: Principle
true_statement: A client insists, "The dashboard must go live by March 1." Asked why, she explains her board meets on March 3 and wants to see churn figures. The March 1 date is her position; showing the board churn figures is her interest.
false_statement: A client insists, "The dashboard must go live by March 1." Asked why, she explains her board meets on March 3 and wants to see churn figures. The March 1 date is her interest; showing the board churn figures is her position.
explanation: A position is the stated demand, here a date; the interest is the need behind it. Naming the interest opens other options, such as a one-off churn report for the board, that the date alone hides.
