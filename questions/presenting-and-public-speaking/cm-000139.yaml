kind: scenario
topic: Assertion-evidence slides
topic_type: Technique
true_statement: A product manager's slide is headed "Customer churn" above a chart of monthly cancellations. In assertion-evidence terms, that headline is still a topic, not an assertion.
false_statement: A product manager's slide is headed "Customer churn" above a chart of monthly cancellations. In assertion-evidence terms, that headline is an assertion, because a chart supports it.
explanation: An assertion headline states the point to accept, such as "Churn doubled among customers who never finished onboarding." A topic label leaves each listener to infer the conclusion while also listening.
