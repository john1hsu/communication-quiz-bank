topic: Setting reply-time expectations
topic_type: Technique
true_statement: In Giurge and Bohns's tests, a one-line "not urgent" note from the sender erased receivers' overestimate of how fast an out-of-hours email needed a reply, but it did not directly lower their rated stress.
false_statement: In Giurge and Bohns's tests, a one-line "not urgent" note from the sender erased receivers' overestimate of how fast an out-of-hours email needed a reply, and its main payoff was a direct drop in their rated stress.
explanation: The note closed the expectation gap in a scenario experiment with full-time employees, but any stress benefit was weak, indirect and seen only in exploratory analysis. Use the note to remove guesswork about timing, not as a proven stress cure.
