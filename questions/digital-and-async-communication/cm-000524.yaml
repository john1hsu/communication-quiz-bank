topic: Digital communication
topic_type: Field
true_statement: Annoyed by a missed hand-off, an engineer fires off a chat message to a colleague far blunter than anything he would say to her face. That is the uninhibited messaging that reduced social cues make easier, and a reason to reread before sending.
false_statement: Annoyed by a missed hand-off, an engineer fires off a chat message to a colleague far blunter than anything he would say to her face. That is the status equalisation that reduced social cues make easier, and a reason to reread before sending.
explanation: 'The tell is bluntness he would not use in person: with fewer cues about the person and setting, text gets less inhibited. Status equalisation is a different reduced-cues effect, about rank mattering less in who speaks up, and has nothing to do with tone.'
