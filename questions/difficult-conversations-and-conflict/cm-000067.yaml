true_statement: After a missed release, a manager tells the team, "My read is the handoff broke down somewhere. What would help us hit the next date?" In Gibb's terms she is using provisionalism and problem orientation, cues that lower defensiveness.
false_statement: After a missed release, a manager tells the team, "My read is the handoff broke down somewhere. What would help us hit the next date?" In Gibb's terms she is using strategy and neutrality, cues that raise defensiveness.
explanation: '"My read is" offers a view open to correction (provisionalism) and the question frames a shared problem rather than dictating a fix. Strategy means a hidden agenda and neutrality means detachment; neither shows here.'
