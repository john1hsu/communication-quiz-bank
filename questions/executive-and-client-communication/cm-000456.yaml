id: cm-000456
area: executive-and-client-communication
kind: practice
topic: Escalating a problem
topic_type: Technique
true_statement: Once you have escalated a scope dispute and are waiting for the sponsor's decision, keep the team working to the current plan, then confirm the decision in writing to everyone affected when it comes.
false_statement: Once you have escalated a scope dispute and are waiting for the sponsor's decision, pause the affected work so nothing is wasted, then confirm the decision in writing to everyone affected when it comes.
explanation: Practitioner guidance lists halting work while a decision is pending as a common escalation mistake; the plan in force stays in force until someone with authority changes it. Pausing turns the escalation into a delay of its own.
