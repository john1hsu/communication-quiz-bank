true_statement: A data scientist who knows her model best keeps asking her lead to present it to executives, saying "presenting isn't really my thing." That handing-off is a common way speaking anxiety works against a career.
false_statement: A data scientist who knows her model best keeps asking her lead to present it to executives, saying "presenting isn't really my thing." That is sensible delegation that keeps her work visible.
explanation: 'Speaking anxiety often operates through avoidance: others brief the executives, so the person''s work is seen less than it should be. The self-check is whether she is declining because it isn''t her job or because she fears it.'
