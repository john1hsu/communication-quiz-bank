true_statement: De Dreu and Weingart's 2003 meta-analysis found task conflict, not just relationship conflict, was negatively related to team performance and satisfaction, against the textbook claim that it helps.
false_statement: De Dreu and Weingart's 2003 meta-analysis found task conflict reliably improved team performance and satisfaction, while only relationship conflict hurt them.
explanation: The review contradicted the then-common view that disagreement about the work reliably helps teams. Later work found task conflict is least harmful when it stays separate from personal friction, so substance-only debate is not automatically healthy.
