topic: Readability formulas
topic_type: Technique
true_statement: Before running a readability score, strip out headings, bullet fragments and tables, because calculators count from full stop to full stop and a list can register as one enormous sentence.
false_statement: Before running a readability score, leave headings, bullet fragments and tables in place, because layout is part of what makes the text readable and should count in the score.
explanation: Non-prose distorts the counts, and the same text can score many grades apart across tools; preparing it first narrowed the spread to about two grades. Then use the score only to find passages worth rereading.
