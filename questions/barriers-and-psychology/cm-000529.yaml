topic: Communication apprehension
topic_type: Barrier
true_statement: 'Communication apprehension is broader than stage fright: McCroskey''s PRCA-24 scores it separately for group discussion, meetings, one-to-one conversation and public speaking.'
false_statement: 'Communication apprehension is another name for stage fright: McCroskey''s PRCA-24 scores it as anxiety about public speaking, with no separate settings.'
explanation: The measure covers four settings and adds them into a total, and the subscores show where someone's apprehension sits so practice can target it. Public-speaking anxiety is just its best-known form.
