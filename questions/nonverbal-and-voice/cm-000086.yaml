kind: practice
topic: Proxemics
topic_type: Concept
true_statement: When meeting a new client in person, start at a neutral social distance, watch whether they step back or lean in, and adjust your distance to them.
false_statement: When meeting a new client in person, keep to the distance that feels comfortable to you throughout, so that you come across as steady and consistent.
explanation: Distance norms differ between people and cultures, so the fix is to match and adapt. Holding your own comfort zone can make you seem aloof to a close-contact person or intrusive to a distant one.
