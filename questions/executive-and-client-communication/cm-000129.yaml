topic: Communicating uncertainty to decision makers
topic_type: Skill
true_statement: Gustafson and Rice's 2020 review found that technical uncertainty, such as ranges and probabilities, had only positive or null effects, while highlighting expert disagreement produced most of the negative effects.
false_statement: Gustafson and Rice's 2020 review found that highlighting expert disagreement had only positive or null effects, while technical uncertainty, such as ranges and probabilities, produced most of the negative effects.
explanation: Ranges rarely backfired, so stating them is low-risk; it is consensus uncertainty that tends to cost belief and trust. The review pooled no effect sizes and mostly studied public audiences, not managers.
