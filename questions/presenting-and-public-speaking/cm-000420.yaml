true_statement: A 2020 meta-analysis of 29 experiments found that cues signalling structure in multimedia learning gave a modest overall benefit (d = 0.38), with large variation between studies.
false_statement: A 2020 meta-analysis of 29 experiments found that cues signalling structure in multimedia learning gave a large, consistent benefit (d = 0.83), with little variation between studies.
explanation: The pooled effect was moderate and varied widely, with stronger effects in better-controlled designs. Most of this evidence comes from classrooms, so its size in short workplace briefings is an extrapolation.
