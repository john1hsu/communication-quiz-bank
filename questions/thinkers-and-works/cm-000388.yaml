kind: evidence
topic: The Relative Effectiveness of Active Listening in Initial Interactions
topic_type: Study
true_statement: In Weger and colleagues' 2014 first-conversation experiment, a partner who offered advice was rated about as socially attractive and satisfying to talk to as one who used active listening.
false_statement: In Weger and colleagues' 2014 first-conversation experiment, a partner who offered advice was rated less socially attractive and less satisfying to talk to than one who used active listening.
explanation: Active listening beat bare acknowledgement on liking and satisfaction, but not advice. Its distinct payoff was making people feel understood, so reflecting back is not a general boost to how others see you.
