id: cm-000252
area: presenting-and-public-speaking
kind: scenario
topic: Presentation rehearsal
topic_type: Technique
true_statement: 'Preparing a pitch to leadership, a manager runs it three times alone in front of a mirror and calls it rehearsed. He has skipped the part of rehearsal with the clearest evidence: a run-through before a few live listeners.'
false_statement: Preparing a pitch to leadership, a manager runs it three times alone in front of a mirror and calls it rehearsed. He has covered the part of rehearsal with the clearest evidence, since a mirror shows his delivery as listeners see it.
explanation: The tell is that nobody else hears the talk. Practising before an audience is the condition linked to better scores, and a mirror is only a last resort; ask three or four colleagues to sit in and say what was unclear.
