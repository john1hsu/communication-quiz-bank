kind: practice
topic: Habit reversal training
topic_type: Technique
true_statement: Before training yourself out of "um", record two or three short practice talks and count your fillers per minute, so you can tell later whether the training worked.
false_statement: Before training yourself out of "um", skip recording and simply resolve to stop in your next talk, since counting fillers only makes you more self-conscious.
explanation: Every speech study measured the filler rate before and after; without a baseline you can't tell if anything changed. Spotting fillers on recordings is also the first stage of awareness training.
