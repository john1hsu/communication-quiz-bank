id: cm-000041
area: questioning-and-conversation
kind: practice
topic: Teach-back
topic_type: Technique
true_statement: When asking for a teach-back, frame it as a check on your own explanation, as in "I want to make sure I explained that clearly."
false_statement: When asking for a teach-back, frame it as a check on their attention, as in "Let's see whether you were listening."
explanation: Owning the check keeps the other person's dignity intact and makes it easy to admit a gap. A check that sounds like an exam feels patronising and invites a defensive "yes, got it".
