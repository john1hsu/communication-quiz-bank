id: cm-000128
area: executive-and-client-communication
kind: practice
topic: Communicating uncertainty to decision makers
topic_type: Skill
true_statement: When an executive asks something you can't answer yet, say "We don't know yet; here's what we're doing to find out, and we'll update you by Thursday."
false_statement: When an executive asks something you can't answer yet, give your best guess in a confident tone, so that you don't look unprepared in front of them.
explanation: Crisis-communication guidance asks speakers to name what is unknown, what is being done and when they'll update. Projecting false certainty risks a decision built on a guess and costs credibility later.
