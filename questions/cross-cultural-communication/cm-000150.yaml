area: cross-cultural-communication
kind: practice
topic: Ethnocentrism
topic_type: Barrier
true_statement: When interviewing a candidate whose accent and style differ from yours, score the substance of each answer against written criteria before forming an overall impression.
false_statement: When interviewing a candidate whose accent and style differ from yours, form your overall impression first, then check it against the written criteria.
explanation: Ethnocentrism mostly distorts gut ratings of attraction, competence and character, so scoring substance first keeps the overall verdict anchored to evidence. Starting with the impression lets the bias set the frame the criteria then confirm.
