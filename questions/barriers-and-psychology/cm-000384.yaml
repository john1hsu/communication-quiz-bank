true_statement: Ginns's 2006 meta-analysis found that integrating related text and visuals improved learning clearly for complex material, but only slightly and non-significantly for simple material.
false_statement: Ginns's 2006 meta-analysis found that integrating related text and visuals improved learning clearly for simple material, but only slightly and non-significantly for complex material.
explanation: The large average effect came from hard content, which is where careful layout pays off. For a simple update the layout matters much less, so the false version gets the boundary the wrong way round.
