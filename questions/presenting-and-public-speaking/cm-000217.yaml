true_statement: Nathan Azrin and R. G. Nunn introduced habit reversal in 1973 as a treatment for nervous habits such as nail-biting and tics, long before it was applied to filler words.
false_statement: Nathan Azrin and R. G. Nunn introduced habit reversal in 2016 as a treatment for filler words in student speeches, before it was applied to nervous habits such as nail-biting.
explanation: The method began as a clinical package for habits and tics; behaviour analysts such as Mancuso and Miltenberger later applied a stripped-down version to speech in 2016.
