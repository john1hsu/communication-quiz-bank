true_statement: Feedback intervention theory holds that feedback helps most when it keeps attention on the task and how to learn it, and loses power as it pulls attention toward the person's self-image.
false_statement: Feedback intervention theory holds that feedback helps most when it draws attention to the person's standing and self-image, and loses power as it stays narrowly on the task.
explanation: Kluger and DeNisi explained feedback's mixed results by where it sends attention. Comments about the self pull focus away from the work, which is why the same conversation can lift or sink performance.
