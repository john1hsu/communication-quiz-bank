true_statement: In Oechssler, Roider and Schmitz's large online study, a 24-hour cooling-off period barely changed how often people rejected unfair offers when stakes were low, and helped only when stakes felt high.
false_statement: In Oechssler, Roider and Schmitz's large online study, a 24-hour cooling-off period sharply cut rejections of unfair offers when stakes were low, and mattered less when stakes felt high.
explanation: 'This study challenges how general the cooling-off benefit is: with ordinary cash stakes the delay made little difference. A pause is useful, but not a cure-all.'
