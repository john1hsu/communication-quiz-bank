kind: scenario
topic: Nonviolent Communication
topic_type: Framework
true_statement: A manager asks a report, "Would you be willing to send the weekly numbers by Thursday noon?" When she mentions a clash, he says a slip will show up in her review. In NVC terms, he made a demand.
false_statement: A manager asks a report, "Would you be willing to send the weekly numbers by Thursday noon?" When she mentions a clash, he says a slip will show up in her review. In NVC terms, he made a request.
explanation: 'NVC''s test is what happens after a "no": if declining is punished, it was a demand, however politely it was phrased. A real request stays open to her answer and explores other ways to meet the need.'
