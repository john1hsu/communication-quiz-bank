id: cm-000239
area: barriers-and-psychology
kind: scenario
topic: Considering others' contributions first
topic_type: Technique
true_statement: In a retro, a lead asks four engineers to estimate their own share of the migration work, and the numbers add up to 160%. The gap most likely reflects egocentric over-claiming, each person remembering their own work best.
false_statement: In a retro, a lead asks four engineers to estimate their own share of the migration work, and the numbers add up to 160%. The gap most likely shows that at least one engineer is deliberately inflating their share.
explanation: Research traces totals above 100% to memory and attention, not lying, and they grow with team size. Use the gap to surface overlooked work, for instance by having everyone list others' contributions before their own.
