id: cm-000316
area: listening
kind: practice
topic: Labeling emotions
topic_type: Technique
true_statement: When a senior stakeholder pushes hard for an earlier launch, label the business pressure, as in "It sounds like the board date is driving this," rather than her personal feelings.
false_statement: When a senior stakeholder pushes hard for an earlier launch, label her personal feelings, as in "It sounds like you're anxious about the board," rather than the business pressure.
explanation: With senior stakeholders, naming the business pressure lands better than naming their emotions; labeling the feeling itself is usually more welcome with an upset peer or report. This is practitioner guidance rather than a tested finding.
