true_statement: A new analyst emails a CFO she has never met, "Hey, need the Q3 numbers asap, thx," and the CFO is put off. In Jenny Thomas's terms that is sociopragmatic failure, misjudging the power and distance of the relationship.
false_statement: A new analyst emails a CFO she has never met, "Hey, need the Q3 numbers asap, thx," and the CFO is put off. In Jenny Thomas's terms that is pragmalinguistic failure, using a form that carries a different force than intended.
explanation: The request itself is clear; what misfires is a casual register that ignores the status gap, which is the sociopragmatic kind. Pragmalinguistic failure is when the form conveys the wrong force, like hearing "Would you like to read?" as a question about preference.
