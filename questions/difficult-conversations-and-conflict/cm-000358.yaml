topic: De-escalation
topic_type: Technique
true_statement: A supplier storms into reception shouting about an unpaid invoice, and the office manager says, "You need to calm down before we can talk." That is a common de-escalation mistake, because it challenges him and signals she isn't listening.
false_statement: A supplier storms into reception shouting about an unpaid invoice, and the office manager says, "You need to calm down before we can talk." That is setting a clear limit, a core de-escalation step.
explanation: 'Telling an agitated person to calm down is provocative: it orders rather than listens. A real limit is stated calmly as a fact about behaviour and paired with a choice; this line names no behaviour and offers no option.'
