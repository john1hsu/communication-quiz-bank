topic: Pragmatics
topic_type: Field
true_statement: 'Working out which "Friday" a handover note means is near-side pragmatics: the context needed to fix what was said at all.'
false_statement: 'Working out which "Friday" a handover note means is far-side pragmatics: the speech act performed and the implications beyond the words.'
explanation: Resolving references like "you", "this" or "Friday" is needed just to know what was said, which is the near side. Far-side pragmatics comes after, as in hearing a director's "quick suggestion" as an instruction.
