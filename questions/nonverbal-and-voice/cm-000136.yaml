topic: Camera-level gaze on video calls
topic_type: Technique
true_statement: A candidate joins a video interview with her laptop flat on the desk, so the camera looks up at her face. That low angle is a common setup mistake; the camera belongs at eye level or slightly above.
false_statement: A candidate joins a video interview with her laptop flat on the desk, so the camera looks up at her face. That low angle is the recommended setup, since cameras below eye level are judged most positively.
explanation: Coaches warn a camera looking up at you can make you seem arrogant, and raters judged a slightly high angle more positively. Propping the laptop on books fixes it.
