true_statement: On a call with a partner office, a consultant gets the delivery date she wanted by overruling their lead in front of his own team, who stay cold for weeks afterwards. By Deardorff's test, her behaviour was effective but not appropriate.
false_statement: On a call with a partner office, a consultant gets the delivery date she wanted by overruling their lead in front of his own team, who stay cold for weeks afterwards. By Deardorff's test, her behaviour was appropriate but not effective.
explanation: 'Deardorff''s outcome has two parts: effective means you reached your goal, appropriate means the other side saw your conduct as acceptable. She got the date, so it was effective; the public overruling and the chill that followed show it was not appropriate.'
