topic: Asynchronous communication
topic_type: Channel
true_statement: Yang and colleagues' study of Microsoft employees found that firm-wide remote work in 2020 made collaboration more siloed, with less time spent with people in other groups.
false_statement: Yang and colleagues' study of Microsoft employees found that firm-wide remote work in 2020 made collaboration less siloed, with more time spent with people in other groups.
explanation: As work shifted toward email and chat, cross-group collaboration fell and people added fewer new collaborators. Leaning only on async channels within your team can deepen silos, so reach across groups deliberately.
