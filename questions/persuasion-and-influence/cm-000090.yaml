kind: evidence
topic: Selling issues to leadership
topic_type: Technique
true_statement: The main evidence for issue-selling moves comes from retrospective accounts by managers at a single hospital, so the moves are linked to success but have not been tested in controlled trials.
false_statement: The main evidence for issue-selling moves comes from large controlled trials across many companies, so the moves are known to cause leaders to act on raised issues.
explanation: The 2001 study gathered 82 recalled accounts from one nonprofit hospital, and its authors note it mostly confirms standard change advice. That is why the technique is rated mixed rather than robust.
