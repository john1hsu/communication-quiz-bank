id: cm-000531
area: nonverbal-and-voice
kind: practice
topic: Facial expressions
topic_type: Phenomenon
true_statement: On a video call, make your nods, smiles and raised eyebrows a little larger than you would in person, so colleagues can see on a small tile that you are following.
false_statement: On a video call, make your nods, smiles and raised eyebrows a little smaller than you would in person, since the camera exaggerates every reaction on a small tile.
explanation: A resting face on a small video tile is easily read as disengaged, so deliberate, slightly enlarged reactions help others see you are listening. Shrinking them makes the misreading more likely, not less.
