true_statement: 'Halfway through a client briefing on a delayed rollout, the account lead says, "So, to recap this part: one delay came from the vendor and one from the audit, and both are now fixed." That is an internal summary.'
false_statement: 'Halfway through a client briefing on a delayed rollout, the account lead says, "So, to recap this part: one delay came from the vendor and one from the audit, and both are now fixed." That is an internal preview.'
explanation: The line looks back and recaps what was just covered, which makes it an internal summary. An internal preview looks forward and announces what is coming next, such as "Now the new date and the one risk to it."
