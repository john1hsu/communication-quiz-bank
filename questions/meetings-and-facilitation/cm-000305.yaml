topic: Workplace meetings
topic_type: Context
true_statement: In Rogelberg, Leach and Burnfield's 2006 survey, employees high in accomplishment striving felt worse when their meeting time came as many short meetings than as a few longer ones of the same total length.
false_statement: In Rogelberg, Leach and Burnfield's 2006 survey, employees high in accomplishment striving felt worse when their meeting time came as a few long meetings than as many short ones of the same total length.
explanation: For people driven to get their own work done, many short meetings hurt more than fewer, longer ones of the same total. People lower in that trait even reported better well-being with more meeting time, which is why asking the team beats one meeting rule for everyone.
