area: negotiation
kind: evidence
topic: Integrative negotiation
topic_type: Technique
true_statement: In De Dreu, Weingart and Kwon's 2000 meta-analysis, prosocial negotiators reached higher joint outcomes only when they were also firm about their own interests.
false_statement: In De Dreu, Weingart and Kwon's 2000 meta-analysis, prosocial negotiators reached higher joint outcomes whether or not they were firm about their own interests.
explanation: The gains appeared only when resistance to yielding was high or unknown, so concern for the other side has to come with firmness. Concern alone tends to produce concessions, not better joint deals; most of the studies were simulations.
