true_statement: A 2001 meta-analysis found cross-cultural training only modestly linked to adjustment (r = 0.12) and somewhat more to performance (r = 0.23).
false_statement: A 2001 meta-analysis found cross-cultural training only modestly linked to performance (r = 0.12) and somewhat more to adjustment (r = 0.23).
explanation: The smaller correlation was with adjustment and the larger with performance; both are small, which is why reviewers favour experiential learning with reflection over one-off courses. The false version swaps the two outcomes.
