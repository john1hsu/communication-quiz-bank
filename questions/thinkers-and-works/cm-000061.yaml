topic: Effective Writing for Army Leaders
topic_type: Work
true_statement: To coach a junior analyst's status memo with a quick-screen edit, highlight the bottom-line sentence, mark passive verbs and jargon, and hand it back asking them to move the highlight to the top and fix only what is marked.
false_statement: To coach a junior analyst's status memo with a quick-screen edit, rewrite the whole memo yourself in clean style and hand it back as the model to copy next time.
explanation: The quick-screen edit is one fast read that marks problems and leaves the fixing to the writer, so the analyst learns the pattern. A full rewrite is slower and teaches less.
