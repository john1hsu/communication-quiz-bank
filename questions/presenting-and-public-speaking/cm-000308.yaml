true_statement: Bourhis and Allen's 1998 synthesis of classroom experiments found that students given videotaped feedback improved their speaking skills without becoming significantly more anxious.
false_statement: Bourhis and Allen's 1998 synthesis of classroom experiments found that students given videotaped feedback improved their speaking skills but became significantly more anxious.
explanation: The pooled studies showed gains in content, skill and test scores with no significant rise in anxiety, which answers the common worry that watching yourself backfires. The evidence is dated and student-based, hence the mixed rating.
