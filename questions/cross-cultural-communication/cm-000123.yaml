true_statement: In 2008 Kyoung-Ah Nam and John Condon proposed renaming the D.I.E. exercise D.A.E., partly because "interpret" and "evaluate" are near-synonyms in everyday speech.
false_statement: In 2008 Janet and Milton Bennett proposed renaming the D.I.E. exercise D.A.E., partly because "interpret" and "evaluate" are near-synonyms in everyday speech.
explanation: The Bennetts adapted the exercise for intercultural workshops in 1975; the D.A.E. renaming came from Nam and Condon decades later. They also noted trainers kept apologising for the D.I.E. acronym.
