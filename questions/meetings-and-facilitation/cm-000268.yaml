true_statement: When a stakeholder keeps pulling a meeting off topic, start with a reminder of the agenda or ground rules, then try a time-box or parking-lot item, and save confronting them in the room for last.
false_statement: When a stakeholder keeps pulling a meeting off topic, confront them in the room straight away, then fall back on a time-box or parking-lot item, and save a reminder of the agenda for last.
explanation: 'Facilitators escalate gradually: point back to the agreed agenda or rules first, then time-box or park the item, then have a quiet word at a break. Confronting someone in front of the group is the last resort, not the opening move.'
