true_statement: Shaw, Wild and Colquitt's 2003 meta-analysis found explanations helped most after unfavourable outcomes, and excuses tended to work better than justifications.
false_statement: Shaw, Wild and Colquitt's 2003 meta-analysis found explanations helped most after favourable outcomes, and justifications tended to work better than excuses.
explanation: Accounts matter most when the news is bad, as fair-treatment research also finds. Excuses help by shifting responsibility, which is exactly why they must be true; inventing a mitigating cause is deception.
