area: persuasion-and-influence
kind: scenario
topic: Narrative persuasion
topic_type: Technique
true_statement: Arguing for a new escalation process, a support lead tells leadership about the year's single worst outage and never says it was a one-off. Her story is unrepresentative and can mislead them about how common the problem is.
false_statement: Arguing for a new escalation process, a support lead tells leadership about the year's single worst outage and never says it was a one-off. Her story is well chosen, since the most dramatic case draws listeners in most.
explanation: Listeners' judgements tend to follow a vivid case even when the wider evidence differs, so the story should be typical. She should pick a representative incident or say plainly how rare the outage was.
