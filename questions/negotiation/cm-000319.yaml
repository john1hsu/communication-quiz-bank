id: cm-000319
area: negotiation
kind: practice
topic: Interests vs. positions
topic_type: Principle
true_statement: When a peer team turns down your request for a two-week code freeze, ask what would go wrong for them if they agreed, and play back what you hear before proposing options.
false_statement: When a peer team turns down your request for a two-week code freeze, restate more firmly why the freeze matters to you before asking anything about their side.
explanation: Asking what your proposal would cost them surfaces the interests behind their refusal, and playing it back shows you heard it. Repeating your own case harder keeps both sides locked in positions.
