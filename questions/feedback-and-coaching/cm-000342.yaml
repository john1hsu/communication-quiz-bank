topic: Self-affirmation before feedback
topic_type: Technique
true_statement: Before a design critique, an architect spends five minutes telling herself, "My plan is solid and I covered every edge case." That defends the work under review rather than affirming an unrelated value.
false_statement: Before a design critique, an architect spends five minutes telling herself, "My plan is solid and I covered every edge case." That is self-affirmation before feedback, used as intended.
explanation: 'The decisive feature is what she reflects on: the very work about to be judged. Self-affirmation means writing about a value outside that domain, such as family or community, which widens the self instead of shoring up the threatened skill.'
