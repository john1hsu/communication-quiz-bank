true_statement: Cardon's review of contexting studies found communication channel was the best-supported part of the high/low-context model, while most studies of directness did not support it.
false_statement: Cardon's review of contexting studies found directness was the best-supported part of the high/low-context model, while most studies of communication channel did not support it.
explanation: Directness is the part most often discussed, yet it fared worst in the empirical tests; channel preferences held up best. That is one reason the model is treated as contested.
