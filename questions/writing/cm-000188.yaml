true_statement: 'An analyst''s report on rising tooling costs runs: "Week 1: we collected cost data. Week 2: we tested feed rates. Week 3: we found several patterns." It narrates the order of the work and buries the answer.'
false_statement: 'An analyst''s report on rising tooling costs runs: "Week 1: we collected cost data. Week 2: we tested feed rates. Week 3: we found several patterns." It follows the pyramid principle, building up from evidence to the answer.'
explanation: 'The pyramid puts the recommendation on top, then grouped reasons, then evidence: the order the reader thinks in. A week-by-week account mirrors the investigation, so the plant manager has to dig for what to do.'
