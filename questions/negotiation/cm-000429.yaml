true_statement: In Korobkin and Doherty's 2009 settlement simulations, the strongest predictor of who captured more of the surplus was how accurately each side estimated the other's reservation price.
false_statement: In Korobkin and Doherty's 2009 settlement simulations, the strongest predictor of who captured more of the surplus was how large each side's first offer was.
explanation: First-offer size mattered, but it came after the accuracy of estimating the counterpart's bottom line. The lesson is to research and probe the other side's walk-away point before you start dividing value.
