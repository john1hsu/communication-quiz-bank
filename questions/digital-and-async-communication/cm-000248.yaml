topic: Media richness theory
topic_type: Theory
true_statement: 'Two engineers who have worked together for years settle a knotty design disagreement over email with no trouble. Channel expansion theory explains it: email grows richer for people who share experience of the channel, topic and each other.'
false_statement: 'Two engineers who have worked together for years settle a knotty design disagreement over email with no trouble. Media richness theory explains it: email is a rich medium suited to equivocal problems.'
explanation: On Daft and Lengel's scale email is lean, so MRT would predict trouble here. Carlson and Zmud showed perceived richness isn't fixed by the medium but grows with shared experience, so lean channels work better between people who share context.
