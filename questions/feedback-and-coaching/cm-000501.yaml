kind: practice
topic: Radical candor
topic_type: Framework
true_statement: To start practising radical candor with a team, first ask for criticism of yourself, such as what you could stop doing to be easier to work with, then wait out the silence and reward the honesty.
false_statement: To start practising radical candor with a team, first give each report one piece of direct criticism, so they see candor modelled before you ask for criticism of yourself.
explanation: Scott's advice begins with soliciting feedback, not giving it; leading with criticism is how the approach slides into obnoxious aggression. Rewarding the first honest answer shows the request is real.
