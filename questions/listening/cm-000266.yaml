true_statement: Across Eyal, Steffel and Epley's 2018 series of experiments, imagining another person's perspective reduced self-centred thinking but gave no consistent gain in judging what they actually thought or felt.
false_statement: Across Eyal, Steffel and Epley's 2018 series of experiments, imagining another person's perspective reduced self-centred thinking and reliably improved judgments of what they actually thought or felt.
explanation: Perspective-taking pulled people away from their own viewpoint, yet accuracy did not rise and sometimes dropped while confidence went up. Use it to form hypotheses, then ask the person to get the answer right.
