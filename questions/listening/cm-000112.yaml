topic: Active listening
topic_type: Skill
true_statement: A teammate says she's worried her client demo will flop, and her lead replies at once, "Don't worry, you'll be great!" Rogers and Farson would count that quick reassurance as a response that can shut down honest talk.
false_statement: A teammate says she's worried her client demo will flop, and her lead replies at once, "Don't worry, you'll be great!" Rogers and Farson would count that as active listening, since it answers the feeling behind her words.
explanation: 'Reassurance skips understanding: it tells her how to feel instead of showing he grasped what worries her. Reflecting the worry and asking what concerns her most would keep her talking.'
