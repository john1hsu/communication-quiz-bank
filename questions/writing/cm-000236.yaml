true_statement: To hit a grade-8 target, a policy team rewrites a staff notice as "Leave. Approval needed. Submit form. Use portal. Manager signs. HR checks." It scores as very easy, but it was written to the number and leaves readers guessing.
false_statement: To hit a grade-8 target, a policy team rewrites a staff notice as "Leave. Approval needed. Submit form. Use portal. Manager signs. HR checks." Its very easy score shows the notice is now plain language.
explanation: Chopped sentences lower the score without saying the order, the deadline or who acts. Plain language is judged by whether readers can find, understand and use the content, which no formula measures.
