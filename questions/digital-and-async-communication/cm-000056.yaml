true_statement: When you send a non-urgent work email late in the evening, add a line saying the reply can wait until working hours.
false_statement: When you send a non-urgent work email late in the evening, send it without comment, since the reader can tell from the timestamp that it isn't urgent.
explanation: Receivers of off-hours email tend to assume senders want faster replies than they do. A one-line note about timing closed that gap in the urgency-bias studies; silence leaves the reader guessing.
