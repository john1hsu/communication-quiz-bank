topic: I-statements
topic_type: Technique
true_statement: Upset about a missed deadline, a project lead tells a colleague, "I feel that you don't respect my time." That is a disguised accusation, not a real I-statement.
false_statement: Upset about a missed deadline, a project lead tells a colleague, "I feel that you don't respect my time." That is a well-formed I-statement, because it opens with "I feel".
explanation: '"I feel that you..." puts a verdict about the other person''s motives behind an I. A real I-statement names an observable behaviour, its concrete effect and an actual emotion such as worry or frustration.'
