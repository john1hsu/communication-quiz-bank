true_statement: At kickoff, an HR director asks the analytics team to "make the onboarding report better" but can't say what better would look like. In Ojasalo's terms that is a fuzzy expectation, which the team should turn into a precise, checkable goal before building anything.
false_statement: At kickoff, an HR director asks the analytics team to "make the onboarding report better" but can't say what better would look like. In Ojasalo's terms that is an implicit expectation, which the team should turn into a precise, checkable goal before building anything.
explanation: Fuzzy means the client wants an improvement without knowing what it is, which is what happens here. An implicit expectation is a specific want the client assumes and never voices, such as expecting mobile access without mentioning it; both need surfacing, but they are different problems.
