area: foundations
kind: practice
topic: Grice's cooperative principle
topic_type: Principle
true_statement: When a manager asks whether a project is on track, answer that question first and add background after, since opening with background suggests you're avoiding the answer.
false_statement: When a manager asks whether a project is on track, give the background first so the answer makes sense, and save the yes or no for the end of your reply.
explanation: Listeners assume each contribution is relevant to the question, so a reply that starts elsewhere gets read as evasion. Answer, then add the context the reader needs.
