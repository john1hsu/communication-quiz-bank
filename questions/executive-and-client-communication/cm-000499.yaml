true_statement: The Canadian Health Services Research Foundation's 1:3:25 rule asks for one page of main messages, a three-page executive summary and no more than 25 pages of findings.
false_statement: The Canadian Health Services Research Foundation's 1:3:25 rule asks for a one-page executive summary, three pages of main messages and no more than 25 pages of findings.
explanation: In 1:3:25 the single page holds the key messages and the executive summary is the three-page middle layer, both sitting above a findings section capped at 25 pages. The false version swaps the two top layers.
