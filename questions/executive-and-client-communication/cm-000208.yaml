true_statement: In Keil and colleagues' 2014 field study of government IT projects, heavier auditing of status reports bred defensiveness and a cycle of distrust rather than more honest reporting.
false_statement: In Keil and colleagues' 2014 field study of government IT projects, heavier auditing of status reports produced more honest reporting, because teams knew they would be checked.
explanation: Teams who found scrutiny unfair grew defensive, auditors read that as deception and scrutinised harder. The one project with honest reporting was where both sides had agreed shared reporting expectations.
