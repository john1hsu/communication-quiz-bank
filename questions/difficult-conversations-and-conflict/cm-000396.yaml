topic: Thomas-Kilmann Conflict Mode Instrument
topic_type: Framework
true_statement: Because each TKI item makes you choose one mode over another, a high score on a mode shows a relative preference, not an absolute amount of that behaviour.
false_statement: Because each TKI item rates a mode on its own scale, a high score on a mode shows an absolute amount of that behaviour, comparable across people.
explanation: The TKI's 30 forced-choice pairs trade modes against each other, so scores describe how a person ranks the modes. Reading them as absolute amounts, or as a fixed type, is a common misuse.
