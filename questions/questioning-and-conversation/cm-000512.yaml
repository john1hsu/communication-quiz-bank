topic: Job interview
topic_type: Context
true_statement: An interviewer asks a candidate, "A key client threatens to leave over a missed deadline. What do you do in the first 24 hours?" That is a situational question.
false_statement: An interviewer asks a candidate, "A key client threatens to leave over a missed deadline. What do you do in the first 24 hours?" That is a behavioural question.
explanation: A situational question poses a job-like scenario to respond to; a behavioural one asks about a real past event, as in "Tell me about a time a client threatened to leave." Both work in structured interviews.
