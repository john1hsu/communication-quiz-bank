id: cm-000509
area: presenting-and-public-speaking
kind: scenario
topic: Death by PowerPoint
topic_type: AntiPattern
true_statement: 'At a quarterly review, a lead puts nine bullets in small type on each slide and reads every line aloud word for word while the leaders read along. That is death by PowerPoint: the slides carry the talk and compete with the speaker.'
false_statement: 'At a quarterly review, a lead puts nine bullets in small type on each slide and reads every line aloud word for word while the leaders read along. That is a wall of text: one unbroken block with nothing to guide the eye.'
explanation: Crowded bullet slides read aloud verbatim are the two signature faults audiences complained about most. A wall of text is an unbroken paragraph in writing; here the problem is fragmented bullets taking over from the speaker.
