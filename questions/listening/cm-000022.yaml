true_statement: In a planning meeting a manager asks, "Don't you think we should launch Monday?" That is a leading question that signals the answer she wants.
false_statement: In a planning meeting a manager asks, "Don't you think we should launch Monday?" That is an open-ended question that lets the team explain in their own words.
explanation: It can be settled with yes or no and builds the manager's preferred answer into the question. An open version would be something like "What would need to be true for a Monday launch?"
