true_statement: Caruso, Epley and Bazerman found that considering others' contributions first reduced over-claiming but lowered enjoyment and interest in future collaboration among the biggest contributors in cooperative groups.
false_statement: Caruso, Epley and Bazerman found that considering others' contributions first reduced over-claiming and raised enjoyment and interest in future collaboration among the biggest contributors in cooperative groups.
explanation: Seeing an uneven split clearly can sting those who carried most, which is why the technique's status is mixed. Pair it with a forward-looking talk about dividing the work next time.
