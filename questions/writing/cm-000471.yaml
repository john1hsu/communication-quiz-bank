true_statement: In Kieras's 1980 study, stating the main idea up front cut reading time for one unfamiliar technical passage to about 52 seconds, against about 81 seconds without it.
false_statement: In Kieras's 1980 study, stating the main idea up front cut reading time for one unfamiliar technical passage to about 81 seconds, against about 152 seconds without it.
explanation: The reported gap was roughly 52 versus 81 seconds, and it held for unfamiliar topics; with familiar ones readers worked out the main idea regardless. The false version inflates both times.
