true_statement: In Lane and Ferreira's 2008 experiments, drawing speakers' attention to information their partner couldn't see made them mention it to the partner more often.
false_statement: In Lane and Ferreira's 2008 experiments, drawing speakers' attention to information their partner couldn't see made them mention it to the partner less often.
explanation: Salient private information leaked into descriptions more, and partners then erred on about a third of them. Adapting to an audience is fragile under load, which is why a written profile and a real-reader check help.
