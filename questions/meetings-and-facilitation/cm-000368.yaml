topic: Brainstorming
topic_type: Technique
true_statement: When a call-out brainstorm stalls, switch the group to silent writing with ideas pooled on sticky notes, rather than just repeating the "no bad ideas" rule.
false_statement: When a call-out brainstorm stalls, keep the call-out format and firmly repeat the "no bad ideas" rule, since fear of judgment is what holds ideas back.
explanation: Fear of judgment was not the main cause of lost ideas in the classic experiments; the speaking queue was. Ground rules alone leave that queue in place, while writing and pooling in parallel removes it.
