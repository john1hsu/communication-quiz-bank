true_statement: A 1998 study found that turning nominalisations into verbs helped native English readers focus on the key information, while the nominalised version could work quite well for non-native readers.
false_statement: A 1998 study found that turning nominalisations into verbs helped non-native English readers focus on the key information, while the nominalised version could work quite well for native readers.
explanation: Spyridakis and Isakson's result supports one step of the method for native-speaker audiences only; the full routine is untested and rests on practitioner consensus. For global teams, check that the revised sentence still reads easily in a second language.
