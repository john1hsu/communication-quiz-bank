topic: Gesturing while speaking
topic_type: Skill
true_statement: Hostetter's 2011 meta-analysis found gestures helped listeners understand most when they added information the speech left out, rather than repeating what was said.
false_statement: Hostetter's 2011 meta-analysis found gestures helped listeners understand most when they repeated what was said, rather than adding information the speech left out.
explanation: Comprehension gains were larger for non-redundant gestures and for depicting physical actions rather than abstract ideas. So show the size, shape or sequence your words don't spell out.
