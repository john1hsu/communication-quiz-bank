id: cm-000127
area: executive-and-client-communication
kind: scenario
topic: Communicating uncertainty to decision makers
topic_type: Skill
true_statement: Asked how many customers a price rise will cost, a product lead tells the leadership team, "Churn should be fine, though obviously nobody can be sure." That pairs false reassurance with a blanket hedge, leaving nothing to plan with.
false_statement: Asked how many customers a price rise will cost, a product lead tells the leadership team, "Churn should be fine, though obviously nobody can be sure." That is well-communicated uncertainty, since it admits nobody can be sure.
explanation: Leaders can neither plan for the downside nor challenge the estimate. A better answer gives a best estimate, a plausible range, how solid the evidence is and when it will improve.
