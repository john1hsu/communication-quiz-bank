id: cm-000027
area: meetings-and-facilitation
kind: definition
topic: Psychological safety
topic_type: Phenomenon
true_statement: Psychological safety means people can admit mistakes and challenge each other without being punished; it doesn't mean being comfortable or free of accountability.
false_statement: Psychological safety means keeping meetings comfortable and shielding people from accountability for poor work.
explanation: It is about candour, and productive disagreement can feel uncomfortable even in a safe team. Leaders can still decline proposals and address poor work while keeping it safe to speak up.
