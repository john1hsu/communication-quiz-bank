topic: Acoustic speech-analysis coaching
topic_type: Technique
true_statement: In Hincks and Edlund's 2009 pitch-meter study, trainees clearly widened their pitch variation, yet expert listeners heard only slight gains in liveliness and no reliable gain in naturalness.
false_statement: In Hincks and Edlund's 2009 pitch-meter study, trainees clearly widened their pitch variation, and expert listeners heard large gains in liveliness and a reliable gain in naturalness.
explanation: The acoustic measure moved much more than listeners' impressions did, and the sample was tiny, so the evidence is rated mixed. A better reading on the meter is not proof of a better presenter; check the result by ear.
