true_statement: A 2024 scoping review found only seven studies of NVC in health-care work, just two of them experimental, so claims that NVC reliably resolves workplace conflict outrun the data.
false_statement: A 2024 scoping review found consistent results across dozens of randomised trials of NVC in health-care work, establishing it as a reliable way to resolve workplace conflict.
explanation: 'The evidence for NVC is encouraging but thin: few, small, mostly non-experimental studies and no large workplace trials. Treat it as a useful discipline, not a proven conflict cure.'
