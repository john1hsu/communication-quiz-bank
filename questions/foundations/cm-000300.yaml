true_statement: A lead messages a peer, "Need the Q3 numbers by 3. Thanks." The numbers arrive on time, but the peer stays cool with her for weeks. The message met its instrumental goal but missed its relational one.
false_statement: A lead messages a peer, "Need the Q3 numbers by 3. Thanks." The numbers arrive on time, but the peer stays cool with her for weeks. The message met its relational goal but missed its instrumental one.
explanation: The task got done, so the instrumental goal was met; the cooling shows what the curt request signalled about the relationship. Every request carries both, which is why a technically correct ask can still strain trust.
