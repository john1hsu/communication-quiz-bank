topic: Perspective-getting
topic_type: Technique
true_statement: When asking a report in a one-on-one what she really thinks of the planned office move, say why you are asking and that you want to hear the downsides, so an unwelcome answer feels safe to give.
false_statement: When asking a report in a one-on-one what she really thinks of the planned office move, ask briskly and take her first answer at face value, since asking directly is what makes you accurate.
explanation: A direct question only helps if the answer is honest, and a reply given under pressure or fear of consequences is weak evidence. Explaining your purpose and showing you can hear bad news makes candour possible.
