true_statement: Price and colleagues' 2015 review of de-escalation training found gains in staff knowledge, confidence and scenario performance, but only low-quality, conflicting evidence on assaults and injuries in practice.
false_statement: Price and colleagues' 2015 review of de-escalation training found clear reductions in assaults and injuries in practice, but little change in staff knowledge or confidence.
explanation: Training reliably improved what staff knew and how they did in practice scenarios; whether it cut real-world harm was poorly evidenced. That gap is why de-escalation's status is mixed despite confident recommendations.
