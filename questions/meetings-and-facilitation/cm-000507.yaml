id: cm-000507
area: meetings-and-facilitation
kind: practice
topic: Devil's advocacy
topic_type: Technique
true_statement: When a room seems agreed on a vendor switch, name a colleague as devil's advocate, say openly that the role is assigned, and have the proposal's owner answer each of her objections before you decide.
false_statement: When a room seems agreed on a vendor switch, ask "Any objections?" and, if nobody speaks up, take the silence as a tested decision and sign the contract.
explanation: An open call for objections in a room that already looks aligned rarely surfaces doubts. Assigning and labelling the critic role makes challenge part of the job rather than disloyalty, and forces the owner to deal with specific weaknesses before committing.
