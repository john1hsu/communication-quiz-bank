topic: Nominal group technique
topic_type: Technique
true_statement: During the round robin of a nominal group session, a junior analyst reads out her idea and a senior lead cuts in, "We tried that, it won't work." That is debate leaking into the round robin, which the facilitator should stop.
false_statement: During the round robin of a nominal group session, a junior analyst reads out her idea and a senior lead cuts in, "We tried that, it won't work." That is the clarification stage working as intended.
explanation: The round robin only records ideas, with no evaluation; even clarification is limited to explaining items, not judging them. Early critique from a senior voice brings back the blocking and status effects NGT exists to remove.
