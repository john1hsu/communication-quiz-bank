true_statement: 'A team''s RACI row for release notes reads: "A: tech writer drafts. R: product manager approves and publishes." The letters are swapped, since the approver is the Accountable one and the drafter is Responsible.'
false_statement: 'A team''s RACI row for release notes reads: "A: tech writer drafts. R: product manager approves and publishes." The letters are right, since the drafter is Accountable and the approver is Responsible.'
explanation: Responsible is whoever does the work; Accountable is the one person answerable for the result, with authority to approve or veto. Here the product manager signs off, so she is the A.
