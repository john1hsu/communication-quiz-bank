topic: William Strunk Jr.
topic_type: Person
true_statement: Applying Strunk's "omit needless words" to a status update means striking stock phrases like "the fact that" while keeping the dates, owners and figures the reader needs.
false_statement: Applying Strunk's "omit needless words" to a status update means cutting it to the fewest, shortest sentences possible, even if dates, owners and figures go.
explanation: Strunk said the rule did not mean only short sentences or dropping detail; it means every word should do work, as in cutting "the question as to whether" to "whether."
