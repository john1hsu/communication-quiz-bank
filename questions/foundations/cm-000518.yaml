true_statement: A project manager ends her request to another team with "No rush at all, whenever you get a chance, only if it's no trouble," and the fix she needs never arrives. In Spitzberg's grid of outcomes, that is sufficing.
false_statement: A project manager ends her request to another team with "No rush at all, whenever you get a chance, only if it's no trouble," and the fix she needs never arrives. In Spitzberg's grid of outcomes, that is maximizing.
explanation: 'Sufficing is polite and appropriate but not effective: nobody was offended, and nothing happened. Maximizing is the opposite corner, where you get your way but break norms or bruise the relationship.'
