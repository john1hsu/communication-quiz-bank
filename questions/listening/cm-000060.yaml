true_statement: In Weger's experiments, a paraphrase on its own did not make speakers feel more understood, but paraphrasing combined with follow-up questions did.
false_statement: In Weger's experiments, a paraphrase on its own made speakers feel more understood, but adding follow-up questions to the paraphrase gave no further benefit.
explanation: The 2010 study found a bare paraphrase mainly made the listener seem more likable; the 2014 follow-up, which paired paraphrasing with requests for more detail, raised feeling understood. So follow a restatement with a genuine question.
