topic: Persuasion
topic_type: Skill
true_statement: If you can't find a real benefit to your audience in what you're proposing, change the proposal rather than searching for a better way to spin it.
false_statement: If you can't find a real benefit to your audience in what you're proposing, keep the proposal and search for a framing that makes it sound like a win for them.
explanation: Conger's common-ground framing describes a proposal by what the audience truly gains. With no shared benefit, reframing is spin; reshaping the proposal so it serves their goals is the honest and more durable fix.
