true_statement: To sound more confident when pitching an idea aloud, project steadily and vary your loudness a little, rather than raising your pitch or speeding up.
false_statement: To sound more confident when pitching an idea aloud, raise your pitch and speed up a little, rather than projecting steadily or varying your loudness.
explanation: Van Zant and Berger found louder speech with some variation in volume made speakers seem more confident, which shifted attitudes, while pitch and rate did not reliably predict persuasion. The effects were small, so treat this as a modest edge.
