topic: Vocal delivery
topic_type: Skill
true_statement: Giving a budget update, a project lead slows down as she reaches the 18% overrun, says the figure louder, pauses, then makes her request, and the room asks about the number. Her voice is flagging what listeners should remember.
false_statement: Giving a budget update, a project lead slows down as she reaches the 18% overrun, says the figure louder, pauses, then makes her request, and the room asks about the number. Her voice is signalling doubt about the figure.
explanation: Slowing, a lift in volume and a deliberate silent pause together mark the key point and give listeners time to take it in. A planned pause before a stated request adds weight; it isn't the trailing-off of someone unsure.
