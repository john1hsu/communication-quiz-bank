topic: Shannon-Weaver model
topic_type: Theory
true_statement: 'A project manager sees that all five engineers opened her email moving the code freeze to Friday and concludes the change has landed. In Weaver''s three levels, she has evidence only for the technical level: the message was delivered.'
false_statement: 'A project manager sees that all five engineers opened her email moving the code freeze to Friday and concludes the change has landed. In Weaver''s three levels, she has evidence for the semantic level: they took the meaning she intended.'
explanation: Weaver separated delivery, understanding and effect on conduct. An opened email or read receipt proves only delivery; whether engineers read 'Friday' as she meant, or changed their plans, needs a reply or read-back.
