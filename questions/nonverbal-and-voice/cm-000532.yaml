true_statement: In Cowen, Keltner and colleagues' 2021 study of about 6 million videos, 16 kinds of facial expression were tied to similar social contexts, with about 70% of those links preserved across 12 world regions.
false_statement: In Cowen, Keltner and colleagues' 2021 study of about 6 million videos, 16 kinds of facial expression were tied to different social contexts, with only about 20% of those links preserved across 12 world regions.
explanation: The study supports some cross-cultural regularity in when expressions occur, though how often each appeared varied by region. That partial support is why the article lands on contested rather than debunked or settled.
