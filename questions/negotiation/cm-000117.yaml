topic: Multiple equivalent simultaneous offers
topic_type: Technique
true_statement: In Leonardelli and colleagues' experiments, MESOs anchored counteroffers more strongly than single offers because recipients saw them as a more sincere effort to reach agreement.
false_statement: In Leonardelli and colleagues' experiments, MESOs anchored counteroffers more strongly than single offers because recipients felt overloaded by the options and settled for the first one.
explanation: Perceived sincerity made the offers stronger reference points, especially when they were ambitious. Choice overload is a reason to cap MESOs at two or three packages, not the source of their pull.
