kind: scenario
topic: Hot-cold empathy gap
topic_type: Barrier
true_statement: A well-rested reviewer finds an error in a report a colleague wrote at the end of a 14-hour on-call shift and comments, "This is just sloppy." Reading a fatigued colleague's slip as a character flaw is the hot-cold empathy gap.
false_statement: A well-rested reviewer finds an error in a report a colleague wrote at the end of a 14-hour on-call shift and comments, "This is just sloppy." Reading a fatigued colleague's slip as a character flaw is the curse of knowledge.
explanation: 'The tell is a difference in state: a calm, rested judge underestimates how much fatigue drives behaviour and blames motivation instead of circumstances. The curse of knowledge is about being unable to forget what you know, not about misjudging someone''s emotional or physical state.'
