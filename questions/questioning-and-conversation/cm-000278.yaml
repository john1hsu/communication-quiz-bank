true_statement: In Eyal, Steffel and Epley's 2018 couples experiment, people in every condition believed they had judged about 14 of their partner's 20 opinions correctly, but averaged only about six.
false_statement: In Eyal, Steffel and Epley's 2018 couples experiment, people in every condition believed they had judged about 6 of their partner's 20 opinions correctly, but actually averaged about 14.
explanation: 'Predictors were overconfident, not underconfident: felt certainty stayed near 14 of 20 whatever they did, while real accuracy was far lower. That gap is why people skip asking and why asking must be a deliberate habit.'
