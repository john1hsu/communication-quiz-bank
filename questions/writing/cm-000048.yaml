true_statement: In Paolazzi and colleagues' 2019 experiments, passives were read faster than matched active sentences, but readers answered who-did-what questions less accurately after them.
false_statement: In Paolazzi and colleagues' 2019 experiments, passives were read more slowly than matched active sentences, but readers answered who-did-what questions just as accurately after them.
explanation: Speed favoured passives, yet accuracy about who did what dropped, a difficulty the authors place in remembering the sentence, not parsing it. That supports naming the actor when responsibility matters.
