true_statement: In Huang and colleagues' experiments, asking more questions made people better liked largely because their partners said more about themselves in response.
false_statement: In Huang and colleagues' experiments, asking more questions made people better liked largely because the askers came across as more competent and better informed.
explanation: Extra disclosure by the partner accounted for much of the rise in liking. The effects were small to moderate and come from a nearby behaviour, since humble inquiry itself is untested practitioner advice.
