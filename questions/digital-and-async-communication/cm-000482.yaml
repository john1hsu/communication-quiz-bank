kind: scenario
topic: Chat etiquette
topic_type: Technique
true_statement: Two engineers sort out a recurring build-config error over direct messages. A week later a third engineer asks the same question in the team channel and nobody can point to the answer. Solving it privately was a chat-etiquette mistake, because it hid the answer from the next person who needed it.
false_statement: Two engineers sort out a recurring build-config error over direct messages. A week later a third engineer asks the same question in the team channel and nobody can point to the answer. Solving it privately was good chat etiquette, because it kept the team channel free of noise.
explanation: Direct messages suit genuinely private or one-person matters; a team problem belongs in a channel thread so the answer stays findable. The tell is the repeat question that nobody can answer from the record.
