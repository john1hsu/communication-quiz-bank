true_statement: To raise a late delivery without putting the analyst on guard, say "The build shipped four days after the date in the plan" rather than "Your estimates were way off again."
false_statement: To raise a late delivery without putting the analyst on guard, say "Your estimates were way off again" rather than "The build shipped four days after the date in the plan," so the cause is named up front.
explanation: Describing an observable fact invites problem-solving, while a verdict on the person triggers a defence of the method. In the article's example, that defence crowded out the real cause, a late scope change.
