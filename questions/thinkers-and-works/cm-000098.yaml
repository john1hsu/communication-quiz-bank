topic: Message Equivocality, Media Selection, and Manager Performance
topic_type: Work
true_statement: A director walks over to tell a long-serving engineer about a reorganisation in person, partly to show that she cares. Daft and colleagues' companion study would class that as a symbolic reason for the channel choice.
false_statement: A director walks over to tell a long-serving engineer about a reorganisation in person, partly to show that she cares. Daft and colleagues' companion study would class that as a situational reason for the channel choice.
explanation: Symbolic reasons concern what the medium itself signals, such as importance or care. Situational reasons are practical limits like time and distance, which are not what drove this choice.
