true_statement: Credé argued that most felt-power studies compared expansive poses with slumped ones, and where a neutral baseline existed, the gap came from slumping making people feel worse, not expansive poses making them feel better.
false_statement: Credé argued that most felt-power studies compared expansive poses with slumped ones, and where a neutral baseline existed, the gap came from expansive poses making people feel better, not slumping making them feel worse.
explanation: Without a neutral comparison you can't tell which pose did the work, and the few studies with one pointed at slumping. That's why what survives of power posing is better summed up as "don't slump" than "stand like a superhero".
