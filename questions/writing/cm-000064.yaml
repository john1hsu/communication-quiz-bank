id: cm-000064
area: writing
kind: practice
topic: Bottom line up front
topic_type: Technique
true_statement: Before sending a decision email, reread only the subject line and first two sentences and ask whether a busy reader could act correctly on those alone.
false_statement: Before sending a decision email, reread it top to bottom and check that the background builds logically toward the request in the closing paragraph.
explanation: The BLUF self-check tests the opening, because many readers stop there. A message that builds to the ask at the end is the buried structure BLUF is meant to fix.
