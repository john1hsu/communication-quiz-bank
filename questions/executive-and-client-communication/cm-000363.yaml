true_statement: In Clingingsmith and Shane's 2018 field experiment, brief pitch training put more best-practice elements into entrepreneurs' pitches but did not raise investors' average interest.
false_statement: In Clingingsmith and Shane's 2018 field experiment, brief pitch training put more best-practice elements into entrepreneurs' pitches and clearly raised investors' average interest.
explanation: The average effect was slightly negative and not significant, with drops concentrated among weaker pitches. The authors' reading is that a clearer pitch helps listeners screen out weak ideas sooner; polish exposes the idea rather than rescuing it.
