topic: Politeness theory
topic_type: Theory
true_statement: When you must criticise a peer's analysis, redress the threat to her positive face, for instance by naming what she got right, rather than apologising as if you were imposing on her time.
false_statement: When you must criticise a peer's analysis, apologise as if you were imposing on her time, rather than redressing the threat to her positive face by naming what she got right.
explanation: Experiments suggest a strategy reads as most polite when it repairs the kind of face the act endangers. Criticism threatens the wish to be valued, so approval fits it; an apology suits a request that imposes on someone's freedom.
