true_statement: In a design review, a lead tells a junior writer her draft "looks great," then tells a peer afterwards that it was unusable. On the radical candor grid, that is manipulative insincerity.
false_statement: In a design review, a lead tells a junior writer her draft "looks great," then tells a peer afterwards that it was unusable. On the radical candor grid, that is ruinous empathy.
explanation: 'Flattery to the face plus complaints behind the back is low care and low challenge: manipulative insincerity, which Scott ranks worst. Ruinous empathy softens criticism out of real care, without the backstabbing.'
