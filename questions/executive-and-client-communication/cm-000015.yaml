true_statement: CIA estimator Sherman Kent argued in a 1964 essay that likelihood words need agreed numeric meanings, after colleagues read "serious possibility" as anything from unlikely to likely.
false_statement: CIA estimator Sherman Kent argued in a 1951 essay that likelihood words need agreed numeric meanings, after colleagues read "serious possibility" as anything from unlikely to likely.
explanation: The 1964 Studies in Intelligence essay looked back at a 1951 estimate that called an attack a "serious possibility"; 1951 is when the vague estimate was written, not when Kent proposed the fix.
