true_statement: In a large study of online requests, Wikipedia editors wrote more politely before winning administrator elections and less politely afterwards, matching the prediction that power lowers politeness.
false_statement: In a large study of online requests, Wikipedia editors wrote less politely before winning administrator elections and more politely afterwards, matching the prediction that power raises politeness.
explanation: Danescu-Niculescu-Mizil and colleagues found politeness dropped once editors gained status, and lower-reputation Stack Exchange users were more polite than high-reputation ones. The false version reverses the direction of the power effect.
